name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs run in parallel:
#   fast-tests      — unit + state-only tests, target <30 s, PR-gating
#   behavior-tests  — simulation-running tests (composite.run), target <5 min, PR-gating
# A PR only merges when BOTH are green (branch protection requires both).
#
# tests/test_initialize.py, test_kinetics_units.py, test_unit_bridge.py are
# deselected: any test that imports v2ecoli.types triggers a load of the
# unreleased bigraph-schema `api` branch (plum-dispatched serialize).
# PyPI bigraph-schema 1.1.1 doesn't have it, so collection fails with
# AttributeError on .dispatch. Re-enable after bigraph-schema ships those
# changes to PyPI.

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (PyPI only)
        # vivarium-workbench's wheel build fails under strict hatchling; the
        # upstream fix requires bigraph-schema>=1.4.1 (a core bump we're
        # deferring). It isn't imported by the test suite (testpaths=tests),
        # so skip building it here.
        run: uv sync --extra dev --no-install-package vivarium-workbench || uv sync --no-install-package vivarium-workbench

      - name: Run fast tests (no .run() calls)
        # Delegates to scripts/pytest_gate.sh: same IN-PROCESS selection as before
        # (no pytest-xdist — the runner's execnet worker intermittently dies mid-
        # suite; pytest-timeout catches a genuine hang instead), MINUS the
        # quarantined node ids in tests/known_failures.txt. Quarantine keeps a
        # single known-broken test (upstream-lib-pinned, awaiting a fixture) from
        # hard-blocking every PR — see that file. New/real failures still fail here.
        run: bash scripts/pytest_gate.sh

  behavior-tests:
    runs-on: ubuntu-latest
    # Job cap so a hang (e.g. an import/collection hang from a dep bump) fails
    # in minutes, not GitHub's 6h default. Normal run is ~9 min; cold ParCa
    # cache build adds headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (PyPI only)
        # vivarium-workbench's wheel build fails under strict hatchling; the
        # upstream fix requires bigraph-schema>=1.4.1 (a core bump we're
        # deferring). It isn't imported by the test suite (testpaths=tests),
        # so skip building it here.
        run: uv sync --extra dev --no-install-package vivarium-workbench || uv sync --no-install-package vivarium-workbench

      # Cache out/cache (initial_state.json + sim_data_cache.dill +
      # cache_version.json) across PRs. The cache key pins to EXACTLY the
      # same input files that cache_version.compute_cache_version
      # fingerprints (v2ecoli/library/cache_version.py:INPUT_FILES), so a
      # change to the ParCa fixture, the LoadSimData boundary, or any
      # composite document builder forces a rebuild on the next CI run.
      # cache_version.py is itself one of the INPUT_FILES entries (it hashes
      # its own bytes), so future additions to INPUT_FILES automatically
      # bust this key too — no separate hand-edit needed here beyond
      # keeping this list equal to INPUT_FILES. Enforced by
      # tests/test_cache_version_inputs.py::test_ci_key_matches_input_files.
      - name: Restore ParCa cache
        id: parca-cache
        uses: actions/cache@v4
        with:
          path: out/cache
          key: >-
            parca-cache-v4-${{ hashFiles(
              'models/parca/parca_state.pkl.gz',
              'v2ecoli/library/sim_data.py',
              'v2ecoli/library/unit_bridge.py',
              'v2ecoli/types/quantity.py',
              'v2ecoli/library/initial_conditions.py',
              'v2ecoli/library/cache_version.py',
              'v2ecoli/core.py',
              'v2ecoli/composites/ecoli_baseline.py',
              'v2ecoli/composites/ecoli_population.py',
              'v2ecoli/composites/ecoli_time_varying_env.py',
              'v2ecoli/composites/ecoli_colony.py',
              'v2ecoli/composites/ecoli_millard.py',
              'v2ecoli/composites/reactor_bird_coupled.py',
              'v2ecoli/steps/reactor_cell_coupler.py',
              'v2ecoli/steps/environment_mirror.py',
              'v2ecoli/composites/_helpers.py',
              'v2ecoli/composites/_millard_helpers.py'
            ) }}

      - name: Build ParCa cache on miss
        if: steps.parca-cache.outputs.cache-hit != 'true'
        run: uv run python scripts/build_cache.py

      - name: Run simulation-based behavior tests
        # Tight step cap: the 7 sim tests target ~9 min. A hang here (test body,
        # or an import/collection hang at pytest startup that pytest-timeout's
        # per-test cap can't catch) fails fast at 15 min instead of running on.
        timeout-minutes: 15
        env:
          CI: 'true'
        # -n auto: pytest-xdist parallelism. The 7 behavior tests are
        # mostly independent full-composite runs that each spend ~2 min
        # in the inner WCM; parallelizing across 4 workers should
        # roughly halve the wall time (target ~7 min vs ~14 min serial).
        # --dist=loadfile keeps a file's tests on one worker so any
        # module-level ParCa-cache-warm fixture pays its cost once.
        #
        # Quarantine: like the fast gate, deselect the node ids in
        # tests/known_failures.txt (the single source of truth) so a KNOWN
        # flaky/broken sim test doesn't hard-block every PR. Entries that aren't
        # sim tests simply aren't collected here, so their --deselect is a no-op.
        # The non-blocking quarantine-watch job still runs the full quarantined set.
        run: |
          deselect=$(grep -vE '^[[:space:]]*(#|$)' tests/known_failures.txt \
            | sed 's/^/--deselect=/' | tr '\n' ' ')
          uv run pytest \
            -m "sim and not slow" \
            --ignore=tests/test_initialize.py \
            --ignore=tests/test_kinetics_units.py \
            --ignore=tests/test_unit_bridge.py \
            $deselect \
            -n auto --dist=loadfile \
            -v --tb=short

  lint:
    # Breakage gate (ruff F + E722) scoped to PROJECT-OWN code only — the ported
    # wcEcoli/vEcoli model math (v2ecoli/processes, v2ecoli/library, v2ecoli/steps)
    # is excluded via [tool.ruff] extend-exclude in pyproject.toml AND by passing
    # the project-own dirs explicitly below. Lightweight: pip-installs ruff, no uv
    # sync (mirrors validate-status). ~5s.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install --quiet 'ruff==0.16.0'

      - name: Ruff check (project-own dirs)
        run: ruff check v2ecoli/composites v2ecoli/workflow pbg_v2ecoli reports scripts

  validate-status:
    # Lightweight read-only consistency check on investigation.yaml +
    # study yamls (single-study cadence enum, focus_study existence,
    # upstream-approval ordering, per-study status alignment). See
    # scripts/validate_status.py for the 7 rules. Runs in parallel with
    # the test jobs; ~1s total — no uv sync needed, just PyYAML.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate status fields
        # exit 0 = clean, 1 = errors (fail CI), 2 = warnings only (don't fail).
        run: |
          set +e
          python scripts/validate_status.py
          code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

  quarantine-watch:
    # NON-BLOCKING. Runs exactly the quarantined set (tests/known_failures.txt)
    # and always exits 0. Its only job is to notice when a quarantined test has
    # started PASSING — that's the actionable signal to delete its line. A test
    # that is red on every PR by design teaches everyone to ignore red; keeping
    # the watch separate and non-gating is what makes the blocking gate credible.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (PyPI only)
        run: uv sync --extra dev --no-install-package vivarium-workbench || uv sync --no-install-package vivarium-workbench

      - name: Quarantine watch (never fails; reports tests that now pass)
        run: bash scripts/pytest_gate.sh --only-known

  audit-gate:
    # L0–L5 study-reproducibility contract gate (viva_superpowers.study_audit).
    # HARD-tier failures (L0 structure, L1 resolvability, L5 graph-validity)
    # fail CI; richness (L2–L5) only warns. The 11 known/WIP failures on main
    # are parked in workspace/known_audit_failures.txt (a ratchet — a stale
    # entry that no longer fails ALSO reds CI, so the list only shrinks).
    # --package v2ecoli.composites registers the workspace's own generators so
    # its composites resolve (vivarium-workbench is intentionally NOT installed;
    # study_audit has no workbench dependency).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (PyPI only)
        run: uv sync --extra dev --no-install-package vivarium-workbench || uv sync --no-install-package vivarium-workbench

      - name: Run the L0–L5 audit gate
        run: |
          uv run python -m viva_superpowers.study_audit \
            --workspace workspace \
            --package v2ecoli.composites \
            --gate \
            --allowlist workspace/known_audit_failures.txt

  readme-check:
    # README.md's composites + investigations tables are generated from the
    # workspace by `vivarium-workbench gen-readme` (the ecosystem-wide command;
    # composites via composite_lookup, investigations from investigation.yaml).
    # This job needs vivarium-workbench + the workspace importable, so it uses
    # the full env (like publish-dashboard.yml), not the lean PyPI-only sync.
    # Regenerate locally with: vivarium-workbench gen-readme --workspace .
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install dependencies (incl. vivarium-workbench)
        # The hatchling build works now that bigraph-schema is un-pinned; the
        # `|| uv sync` fallback keeps this resilient (mirrors publish-dashboard.yml).
        run: uv sync --extra dev || uv sync

      - name: Install latest vivarium-workbench (for gen-readme)
        # uv.lock may pin a vivarium-workbench commit predating the gen-readme
        # command; reinstall @main so the CLI subcommand is present.
        run: uv pip install --reinstall-package vivarium-workbench "vivarium-workbench @ git+https://github.com/vivarium-collective/vivarium-workbench.git@main"

      - name: Check README generated sections are fresh
        # NB: activate the venv rather than `uv run` — `uv run` re-syncs to
        # uv.lock and would undo the ad-hoc vivarium-workbench@main install.
        run: |
          source .venv/bin/activate
          vivarium-workbench gen-readme --workspace "$PWD" --check
