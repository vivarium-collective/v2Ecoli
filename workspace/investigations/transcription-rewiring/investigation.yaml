schema_version: 2
name: transcription-rewiring
title: Transcription rewiring — promoter-resolved transcription
created: '2026-09-01'
status: active
question: Does resolving transcription by promoter rather than by transcription unit fix DnaG production,
  and with it the multi-generation replication arrest that appears once initiation has to acquire
  real replisome subunits?
hypothesis: The arrest is not a replication defect. It is a transcription defect that surfaces at
  the replisome. ParCa deduplicates transcription units by gene tuple, so the three promoters of
  the rpsU-dnaG-rpoD operon collapse into one TU. Regulation measured at one promoter is then applied
  to all of them, and dnaG is transcribed under the wrong regulatory context. DnaG falls far enough
  below its true abundance that replisomes cannot be assembled, and a lineage run with mechanistic_replisome=True
  arrests at a reproducible generation. Separating promoters from transcripts should restore DnaG
  without special-casing the operon.
description: 'Ordered as a causal chain, so each link is falsifiable on its own rather than standing
  or falling with the conclusion:

  1. mechanistic_replisome=True arrests a 12-generation lineage at a reproducible generation; the
  permissive setting does not. 2. The arrest coincides with DnaG depletion, not with a shortage of
  some other replisome subunit. 3. The model''s DnaG abundance is low against independent proteomics
  (Schmidt 2016, Soufi 2015, Mori 2021, Li 2014), not merely low against one dataset. 4. The cause
  is architectural — a transcription unit serves as both promoter and transcript, so operons with
  several promoters need several transcript species whose physical properties no measurement constrains.
  5. Promoter-resolved transcription restores DnaG and the lineage survives 12 generations.

  Link 4 is the contribution. Links 1-3 establish that the architecture has a measurable cost; link
  5 is the test.'
studies:
- mechanistic-replisome-arrest
- replisome-gate-sufficiency
- dnag-production-deficit
