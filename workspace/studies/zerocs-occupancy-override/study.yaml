  criteria:
  - test: zero-cs-tfs-are-bound-at-runtime
    prior: Do the 0CS TFs actually occupy their promoters at ~1.0 in the simulation?
  - test: non-zero-cs-tfs-track-their-fitted-occupancy
    prior: Do the TFs that use the fitted function agree with what the fit assumed?
  - test: restoring-the-fitted-occupancy-rescues-the-lineage
    prior: Does honouring the fitted occupancy for LexA let the cell live?
  - test: rescue-is-not-a-global-growth-artefact
