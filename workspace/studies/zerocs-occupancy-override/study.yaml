implementation_requirements:
- id: req-1
  status: not_started
  blocking: true
  summary: Add a runtime switch honouring the fitted pPromoterBound for 0CS TFs.
  detail: 'tf_binding.py:393 currently reads `if self.tf_to_tf_type[tf_id] == ''0CS'': pPromoterBound
    = 1.0`. The corrected arm needs that to consult the fitted occupancy instead, exposed as a process
    config key so both arms run from ONE cache and differ only at runtime -- the pattern replisome-gate-sufficiency
    and ppgpp-off-rescue both used. v2ecoli/processes/tf_binding.py is NOT in cache_version.INPUT_FILES,
    so this does not disturb fingerprint ea05ac9b23b1d843; that must be VERIFIED, not assumed, and
    the control arm must be shown bit-identical to the existing runs at fixed seed before the corrected
    arm is believed.'
- id: req-2
  status: not_started
  blocking: true
  summary: Decide and record WHICH fitted occupancy the corrected arm uses, before running.
  detail: 'pPromoterBound is per-condition: LexA is 0.5192 basal and 0.6615 active. The corrected
    arm must state which it honours and why, in the record, before any run -- otherwise the choice
    can be made after seeing which one rescues. Default proposal: the BASAL value, since these simulations
    run the basal condition. Recording this because studies 13-15 leaked exactly this way.'
- id: req-3
  status: not_started
  blocking: false
  summary: Pair occupancy measurement with pPromoterBound for the non-0CS control.
  detail: Only TFs whose sites are resolvable in bound_TF_coordinates can be paired. The unpairable
    count must be reported; if too few 1CS/2CS TFs are observable the control axis is underpowered
    and must be declared so rather than quietly graded on two TFs.
alternative_hypotheses:
- name: H1 the override is the lethal step
  discriminator: restoring-the-fitted-occupancy-rescues-the-lineage
  statement: 'Honouring the fitted occupancy leaves dnaG ~0.34 of its expression instead of 4.3e-08,
    DnaG accumulates, the replisome gate is satisfied and the lineage completes. Predicts the rescue
    axis PASSES with generation time unchanged. Favoured: the arithmetic is explicit and the DnaG-ablation
    arm already showed 12/12 completion once the gate stops waiting on DnaG.'
- name: H2 the override matters but is not sufficient
  discriminator: restoring-the-fitted-occupancy-rescues-the-lineage
  statement: dnaG recovers but the lineage still stalls, meaning something else also limits it --
    the 2.13x activator residual, or a second depleted subunit. Predicts the rescue axis FAILS while
    dnaG's transcription measurably improves, which would be a partial result worth having.
- name: H3 the rescue is a global artefact
  discriminator: rescue-is-not-a-global-growth-artefact
  statement: LexA has 45 targets, so relaxing its occupancy shifts a whole regulon. A lineage that
    survives because everything shifted says nothing about dnaG. This is exactly how ppgpp-off-rescue's
    apparent rescue was voided, and the same control is carried over.
- name: H4 the divergence is general, not 0CS-specific
  discriminator: non-zero-cs-tfs-track-their-fitted-occupancy
  statement: 1CS and 2CS TFs also diverge from their fitted occupancies, meaning the 0CS branch is
    not the defect and this study is aimed at the wrong two lines.
falsifiability: 'The rescue axis is a genuine experiment with a stated prediction, not a description:
  the arm either completes 8+ generations or it does not. The global-artefact control has already
  voided one rescue claim in this investigation, so it is not a formality. And H4 can invalidate
  the study''s target entirely by showing the divergence is not 0CS-specific.'
assumptions:
- assumption: The fitted pPromoterBound is the right occupancy to honour.
  basis: It is what ParCa assumed when choosing delta, so honouring it makes the runtime self-consistent
    with the fit. That is a consistency argument, NOT a claim that 0.5192 is biologically correct
    for LexA -- which this study does not establish and cannot.
  risk: medium
- assumption: tf_binding.py is not cache-hashed.
  basis: Checked against cache_version.INPUT_FILES; req-1 requires re-verifying and proving bit-identity
    of the control arm.
  risk: low
simulation_set:
- name: fitted-occupancy
  kind: single
  status: planned
  base_model: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
