schema_version: 4
name: zerocs-occupancy-override
title: The two lines that kill the cell
investigation: transcription-rewiring
study_type: root_cause
phase: Decide
created: '2026-09-04'
status: superseded
design_status: complete
implementation_status: not_started
simulation_status: not_run
evaluation_status: evaluated
gate_status: not_applicable
expert_review_status: not_requested
question: 'The amended foldchange-to-delta-fidelity showed ParCa''s encoding is nearly faithful --
  lexA->rpoD is 1.88x off, not 1.5e+07x -- and that dnaG''s silencing is a RUNTIME occupancy effect:
  a delta of r = -0.99999996 leaves a survivable 0.34 of expression at the fitted occupancy of 0.6615
  but 4.3e-08 at 1.0. tf_binding.py:393 sets pPromoterBound = 1.0 unconditionally for TFs typed 0CS,
  and LexA is 0CS while ParCa fitted it at 0.5192/0.6615. Does honouring the fitted occupancy rescue
  the lineage?'
units_and_time:
  tick: 1 s of simulated time; generations delimited by division events.
  quantities:
    pPromoterBound: probability a TF occupies a promoter site (dimensionless)
    occupancy: measured fraction of timesteps a TF is bound at a promoter coordinate
    generations divided: count of successful divisions before a stall
behavior_tests:
- name: zero-cs-tfs-are-bound-at-runtime
  classification: primary
  gate_class: acceptance_criterion
  question: Do the 0CS TFs actually occupy their promoters at ~1.0 in the simulation?
  description: 'The measured runtime occupancy of 0CS TF promoters is at least 0.95.


    Confirms the code path executes as read. tf_binding.py:393 sets pPromoterBound = 1.0 unconditionally
    for TFs typed 0CS, bypassing the fitted p_promoter_bound_tf. LexA measured 0.988 rising to 1.000
    in dnag-promoter-availability, but that is one TF; this axis asks whether the override is visible
    generally. Checked FIRST because every axis below assumes it.


    Threshold provenance: theory. 0.95 allows for the stochastic rounding and the available-TF cap
    that can hold occupancy just under 1 without contradicting a hard-coded probability of 1.'
  measure:
    kind: derived
    path: median measured occupancy across 0CS TF promoter sites in tf_binding, the hard-coded pPromoterBound
      override
    detail: median over observable 0CS TFs of the fraction of timesteps their promoter coordinates
      are bound.
  pass_if:
    low: 0.95
    high: 1.0
    provenance:
      kind: theory
      note: Bounded above by 1.0; 0.95 tolerates stochastic rounding and the available-TF cap.
  status: pending
- name: non-zero-cs-tfs-track-their-fitted-occupancy
  classification: primary
  gate_class: acceptance_criterion
  question: Do the TFs that use the fitted function agree with what the fit assumed?
  description: 'For 1CS and 2CS TFs, the ratio of measured runtime occupancy to the fit''s pPromoterBound
    basal value lies within [0.67, 1.5].


    THE DISCRIMINATING CONTROL, and the axis that decides whether this is a 0CS-specific defect or
    a general fit-versus-runtime divergence. 12 of 23 TFs are 1CS and 4 are 2CS; they call p_promoter_bound_tf,
    the same fitted function ParCa used, so they SHOULD agree. If they diverge too, the problem is
    not the 0CS branch and this study is aimed at the wrong line.


    Threshold provenance: theory. The standing agreement band.'
  measure:
    kind: derived
    path: median measured-over-fitted pPromoterBound ratio for 1CS/2CS TFs in tf_binding, the control
      on the 0CS override
    detail: median runtime/pPromoterBound ratio across observable non-0CS TFs.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Two-sided; these TFs should agree in both directions if the fitted function is being
        honoured.
  status: pending
  control: negative
- name: restoring-the-fitted-occupancy-rescues-the-lineage
  classification: primary
  gate_class: acceptance_criterion
  question: Does honouring the fitted occupancy for LexA let the cell live?
  description: 'With LexA''s binding probability set to its fitted pPromoterBound instead of the
    hard-coded 1.0, lineages complete at least 8 generations, against the 4-5 they currently reach.


    THE PAYOFF AXIS, and the first time this investigation tests a fix rather than describing a defect.
    Everything so far is diagnosis. The arithmetic says a delta of r = -0.99999996 yields a retained
    fraction of 0.34 at the fitted active occupancy of 0.6615 and 4.3e-08 at 1.0, so honouring the
    fit should leave dnaG with roughly a third of its expression -- survivable, on the evidence of
    replisome-gate-sufficiency''s DnaG-ablation arm completing 12 of 12. If the lineage still stalls,
    the occupancy override is not the lethal step and the diagnosis is incomplete.


    Threshold provenance: theory. 8 generations is comfortably beyond the 4-5 stall and short of
    the full 12, so a partial rescue still counts as one.'
  measure:
    kind: derived
    path: minimum generations divided with lexA at its fitted pPromoterBound, rescuing dnaG on the
      rpoD operon
    detail: minimum divided-generation count across seeds in the corrected arm.
  pass_if:
    low: 8
    high: 12
    provenance:
      kind: theory
      note: Spans 1.5x. Anchored at 8 -- clearly past the 4-5 stall -- rather than demanding all
        12, so a partial rescue is still recognised as one.
  status: pending
- name: rescue-is-not-a-global-growth-artefact
  classification: primary
  gate_class: acceptance_criterion
  question: Is any rescue attributable to LexA rather than to perturbing the model generally?
  description: 'In the corrected arm, generation time stays within 50% of the paired control''s.


    The negative control, carried over from ppgpp-off-rescue where the equivalent axis fired and
    correctly voided a rescue claim. Changing a TF''s occupancy alters expression across its whole
    regulon -- LexA has 45 targets -- so a lineage that survives because everything shifted is not
    evidence about dnaG.


    Threshold provenance: theory. The same 50% band that ppgpp-off-rescue used, so the two are comparable.'
  measure:
    kind: derived
    path: generation-time ratio, corrected versus control, for the lexA pPromoterBound change affecting
      dnaG and rpoD
    detail: median tau in the corrected arm over median tau in the control, generations 1-3.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Two-sided at roughly 50%, matching ppgpp-off-rescue's control so the studies read on
        one scale.
  status: pending
  control: negative
- name: two-zero-cs-tfs-were-fitted-below-one
  classification: supporting
  gate_class: regression_pin
  question: How many 0CS TFs does the override actually contradict?
  description: 'Exactly 2 of the 7 0CS TFs carry a fitted pPromoterBound below 1: PC00010 (LexA,
    0.5192 basal / 0.6615 active) and PD00519 (0.3600). The other five are fitted at 1.0 and the
    override is harmless for them.


    POST-HOC: measured while scoping. A pin recording the blast radius, and a reminder that the defect
    is not ''0CS handling is broken'' but ''two TFs were fitted at partial occupancy and the runtime
    ignores it''.'
  measure:
    kind: derived
    path: count of 0CS TFs whose fitted pPromoterBound is below 1, including lexA which silences
      dnaG via rpoD
    detail: number of the 7 0CS TFs with fitted basal occupancy < 1.
  pass_if:
    op: <=
    value: 2
    provenance:
      kind: post_hoc
      note: Measured while scoping; a blast-radius pin.
  status: pending
