    launching.
robustness:
  n_replicates: 3
  seeds:
  - 0
  - 1
  - 2
  parameter_sweep: false
  note: 3 seeds per arm, genuinely independent since the generation-1 seed fix. Sufficient to distinguish
    a 12-generation completion from a 4-5 stall, which is categorical; not sufficient to estimate
    a stall distribution.
