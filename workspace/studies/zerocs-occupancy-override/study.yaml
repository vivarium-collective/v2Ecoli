corrections:
- date: '2026-09-07'
  field: causal account of LexA at the rpsU-dnaG-rpoD operon
  status: flagged, text preserved
  summary: dnaG is a DIRECT LexA target (fold_changes_nca.tsv, log2FC -1.71), not an rpoD passenger.
    The real defect is cistron-level regulation unioned to TUs with only one dnaG-bearing TU, making
    TU-specific differential regulation structurally impossible.
  raised_by: user
  verified_against:
  - fold_changes_nca.tsv
  - tf_to_fold_change
  - target_tf
