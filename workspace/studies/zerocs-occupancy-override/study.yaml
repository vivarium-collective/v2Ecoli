  expected: generation time within 50% of control.
  observed: ''
  result: PENDING
limitations:
- "CORRECTION 2026-09-07 — this study's account of WHY LexA acts on the rpsU-dnaG-rpoD operon is\
  \ wrong, and the wrongness is inherited, not original to it.\nStatements in this file to the effect\
  \ that 'LexA regulates rpoD and dnaG is silenced as a passenger', or that a dnaG-bearing TU acquires\
  \ LexA because it contains rpoD, do not match the model. They came from checking only fold_changes.tsv,\
  \ which carries lexA->rpoD at log2FC -0.65 and no dnaG entry. There is a SECOND source, fold_changes_nca.tsv:\n\
  \    lexA  dnaG  -1.71        lexA  rpsU  -1.89\nand it is the one in force. tf_to_fold_change['PC00010']\
  \ holds EG10239_RNA (dnaG) at 0.30566, which is 2^-1.71 exactly, plus EG10896_RNA (rpsU) — and\
  \ does NOT contain EG10920_RNA (rpoD) at all. target_tf likewise lists PC00010 for dnaG and rpsU,\
  \ not rpoD. LexA is a DIRECT, cistron-level regulator of dnaG in this model. dnaG is not a passenger.\n\
  The real structural defect is different and stronger: regulation is assigned per CISTRON and then\
  \ unioned onto every TU containing that cistron (relation.py::_build_RNA_to_tf_mapping). dnaG's\
  \ LexA edge therefore lands on whatever TU carries dnaG, and after the gene-set dedup there is\
  \ exactly ONE such TU. The model cannot express 'LexA represses dnaG through this promoter but\
  \ not that one' — TU-specific differential regulation is structurally impossible, not merely mis-assigned.\
  \ It also means restoring the deduplicated promoters could not have separated them: all three TUs\
  \ carry an identical cistron set, so cistron-level regulation attaches LexA to all three.\nWHAT\
  \ THIS DOES AND DOES NOT INVALIDATE: measurements of the encoded delta, occupancy, the deficit\
  \ and the lineage outcomes are unaffected — they measured the model as built. What is wrong is\
  \ the causal STORY told about them. Any figure computed against rpoD's -0.65 as dnaG's input baseline\
  \ is wrong and should be recomputed against -1.71; in this investigation that includes the fold-change-to-delta\
  \ distortion, which is 7.08e+06-fold, not 1.48e+07.\nLeft in place rather than rewritten: the original\
  \ text is preserved above so the record shows what was believed when the work was done."
- Honouring the fitted occupancy makes the runtime self-consistent with the fit. It does NOT establish
  that 0.5192 is biologically right for LexA -- an SOS repressor is expected to be largely bound
  in unstressed cells, so the fitted value may itself be wrong and this study cannot tell.
- Only TFs resolvable in bound_TF_coordinates can be paired for the control axis; if few 1CS/2CS
  TFs are observable it is underpowered and must be declared so.
- The other affected 0CS TF, PD00519 (fitted 0.3600), is changed by the same switch, so a rescue
  cannot be attributed to LexA alone without a LexA-only arm this design does not include.
- 'A rescue would show the override is SUFFICIENT to cause the stall, not that it is the only defect:
  the 2.13x activator residual is untouched by it.'
claim: 'Superseded before running: it would have tested a fix for the trigger rather than the cause,
  and on a misreading of what the fitted occupancy means.'
conclusion: 'Retired unrun, on the user''s observation that dnaG is not rescued by occupancy either
  way.

  Two things were wrong with it. First, I read the fitted pPromoterBound as a binding affinity; it
  is not. getter_functions'' fit computes min(1, tf_counts * init_to_average / tf_targets) with the
  comment ''If TF exists, the promoter is always bound to the TF'' -- so LexA''s 0.5192 is a SCARCITY
  ratio, the fraction of its sites it has copies to cover. 0CS means always-bound-if-present, and
  the runtime''s hard-coded 1.0 is a deliberate expression of that, not a bug. ''Honouring the fitted
  occupancy'' would have imposed a fixed per-site probability that neither the fit nor the runtime
  means.

  Second, and decisively: occupancy is the trigger, not the cause. With the constraint-pinned delta
  r = -0.99999996, dnaG retains 0.48 at q=0.52, 0.34 at q=0.66, 0.012 at q=0.988 and 4.3e-08 at q=1.0
  -- so any occupancy fix leaves the cell on a knife-edge. With the delta the measured fold change
  implies (r = -0.3627), dnaG retains 0.637 even at q = 1.0. LexA can be permanently bound, which
  is what an SOS repressor should be in an unstressed cell, and dnaG is fine.

  Superseded by tu-dedup-promoter-collapse, which targets the most upstream defect: getter_functions
  discards TUs that share a gene set but differ in start coordinate -- distinct promoters -- taking
  637 TUs across 428 groups, including both alternative dnaG transcripts.'
confidence: Refuted
findings:
- summary: The fitted pPromoterBound is a scarcity ratio, not a binding affinity; the 0CS override
    is deliberate.
  status: novel
  evidence:
    from_run: analysis-only
  explanation: fit_sim_data_1.py computes limited_tf_counts = min(1, tf_counts * init_to_average
    / tf_targets) for 0CS TFs, commented 'If TF exists, the promoter is always bound to the TF'.
    LexA's 0.5192 therefore means it has copies for ~52% of its sites, and the runtime models the
    same scarcity by capping n_to_bind at n_available_TF. Both sides intend always-bound-if-present.
    My framing of the runtime as 'ignoring the fit' was wrong.
- summary: Occupancy is the trigger; the constraint-pinned delta is the cause.
  status: novel
  evidence:
    from_run: analysis-only
    observed: 0.637
    units: retained at q=1 with the correct delta
  explanation: retained = 1 + r*q. With r pinned at -1 by ParCa's constraint the cell sits on a cliff
    -- 0.34 at q=0.66, 4.3e-08 at q=1.0 -- so the difference between generation 1 surviving and generation
    3 dying is q moving from 0.988 to 1.000. With r = -0.3627, the value lexA->rpoD's log2FC of -0.65
    implies, dnaG retains 0.637 across the whole occupancy range and is insensitive to q. Fixing
    occupancy treats the trigger.
