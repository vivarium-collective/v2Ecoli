- name: non-zero-cs-tfs-track-their-fitted-occupancy
  kind: negative
  hypothesis: If 1CS/2CS TFs diverge too, the 0CS branch is not the defect.
  expected: median runtime/fitted ratio within [0.67, 1.5].
  observed: ''
  result: PENDING
- name: rescue-is-not-a-global-growth-artefact
