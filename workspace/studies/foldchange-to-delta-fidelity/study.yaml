- name: foldchange-to-delta-fidelity__static
  status: complete
  canonical: true
  started_at: '2026-09-04T02:30:00Z'
  started_at_iso: '2026-09-04T02:30:00Z'
  note: 'NO SIMULATION. Reads the ParCa cache (fingerprint ea05ac9b23b1d843) and reconstruction/ecoli/flat/fold_changes.tsv.
    564 of 907 fold changes joined to a delta entry; the 435 that did not are accounted for and NOT
