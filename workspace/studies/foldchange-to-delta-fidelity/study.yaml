amendment:
  date: '2026-09-04'
  by: activator-overshoot
  summary: 'Every fidelity number in this study was computed with the FULL-SWING comparison (1 +
    delta/alpha) against 2**log2FC. activator-overshoot showed the fold change is measured across
    a TF''s ACTIVE-vs-INACTIVE occupancy swing, so the correct comparison is FC_pred = (1 + r*p_a)/(1
    + r*p_i). All five axes are recomputed here; the pre-registered bands are UNCHANGED, only the
    measurement is corrected. Two verdicts change: the lexA-rpod pin goes from 1.476e+07 to 1.8828,
    and distortion-grows-with-repression-strength flips from PASS to FAIL.'
  what_survives: Activators are genuinely over-encoded (2.13x) and 2 entries still imply a negative
    probability. The encoding is not perfect.
  what_does_not: The headline claim that ParCa misencodes fold changes 'by a median factor of 2,
    in both directions' is substantially wrong. Repressors are near-perfect at 0.9998, and the direction-asymmetry
    was an artefact of comparing a full-swing ratio against a partial-swing measurement.
