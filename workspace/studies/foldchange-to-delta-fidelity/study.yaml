canonical_runs:
- foldchange-to-delta-fidelity__static
findings:
- summary: 'AMENDED: the fit is nearly faithful. dnaG''s silencing is a RUNTIME occupancy effect,
    not an encoding error.'
  status: contradicts
  evidence:
    from_test: lexa-rpod-discrepancy
    observed: 1.8828
    units: expected/predicted at the fit's occupancy
  explanation: 'The single largest correction in this investigation. I reported the lexA->rpoD encoding
    as 1.476e+07-fold wrong; corrected for the occupancy swing it is 1.88x wrong. At the occupancy
    ParCa assumed (p_active = 0.6615) the delta predicts a retained fraction of 0.3385 against a
    measured 0.6373.

    The same delta is catastrophic only at full occupancy: retained = 1 + r*q with r = -0.99999996
    gives 0.481 at the fit''s basal q=0.5192, 0.3385 at its active q=0.6615, 0.0120 at the runtime
    generation-1 q=0.988, and 4.3e-08 at q=1.0. The response is nearly linear in q until it collapses
    in the last percent.

    So the two defects COMBINE and neither is lethal alone: deltav-conversion-diagnosis''s constraint
    pins r at -1, which is harmless at the fitted occupancy, and the runtime then drives q to 1.0,
    where r = -1 means total silencing. Repressors overall are essentially perfectly encoded (median
    0.9998).'
  expected: {}
  provenance:
    run_ids:
    - foldchange-to-delta-fidelity__static
- summary: The TF-regulation layer does not faithfully encode its own fold-change data, in either
    direction.
  status: contradicts
  evidence:
    from_test: distortion-is-systematic
    observed: 2.0063
    units: median implied/expected retained
    divergence_factor: 0.02533333
  explanation: 'Across 564 joined TF-target entries the median encoded retained fraction is 2.01x
    its source fold change, and the median understates it: only 22.6% of repressing and 15.5% of
    activating entries land within a factor of 1.5. Repressors sit at 0.628x (receiving LESS than
    specified) and activators at 4.77x (receiving MORE). Because the activator control fails alongside
    the repressors, the defect is in the conversion itself and not in its negative branch -- H2 supported,
    H1 and H4 refuted.'
  expected:
    range:
    - 0.67
    - 1.5
  provenance:
    run_ids:
    - foldchange-to-delta-fidelity__static
- summary: The distortion is uniform in fold-change magnitude, so it is not saturation or clipping.
  status: novel
  evidence:
    from_test: distortion-grows-with-repression-strength
    observed: 1.1659
    units: strong/weak ratio of median log-distortion
    divergence_factor: 0.1068
  explanation: 'Strong repressors are distorted 1.17x as much as weak ones -- effectively not at
    all. H3 is refuted. The motivating case already pointed this way: lexA->rpoD is a MODEST log2FC
    of -0.65 that became total silencing, which a magnitude-dependent saturation could not produce.
    Whatever the conversion does wrong, it does it regardless of how strong the measured regulation
    is.'
  expected:
    range:
    - 0.67
    - 1.5
  provenance:
    run_ids:
    - foldchange-to-delta-fidelity__static
- summary: Six TF-target pairs encode a NEGATIVE initiation probability.
  status: novel
  evidence:
    from_test: delta-respects-the-probability-bound
    observed: 6
    units: entries below zero
  explanation: hns->leuO (-2.16e-06), argR->carA and argR->carB (-3.09e-11, same TU), argR->artJ
    (-1.03e-08), arcA->lpd (-8.01e-10) and ihfA->glpT (-7.19e-09). Six distinct TFs, so not one pathological
    pair. A multinomial cannot accept a negative probability, so either something clips these at
    runtime or the distribution is malformed; pc00010-repression-arithmetic's negative-probability
    axis asks which.
  expected: {}
  provenance:
    run_ids:
    - foldchange-to-delta-fidelity__static
- summary: 'dnaG''s silencing is one instance of the systematic defect; dnaG is a direct LexA target,
    not an operon passenger (corrected 2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv
    log2FC -1.71).'
  status: confirms
  evidence:
    from_test: lexa-rpod-discrepancy
    observed: 14764919.0
    units: expected/implied retained
  explanation: 'lexA->rpoD carries a measured log2FC of -0.65 (retain 0.637); the delta on TU00352[c]
    retains 4.3167e-08. LexA regulates dnaG directly (log2FC -1.71) and rpsU; rpoD is absent from
    tf_to_fold_change. dnaG is silenced as a LexA TARGET, not as a passenger (corrected 2026-09-07:
    dnaG is a DIRECT LexA target, fold_changes_nca.tsv log2FC -1.71). rpoD also sits in TU0-14460[c],
    which is distorted 1.849e+07-fold, so the same measured datum produces two different encodings.'
  expected: {}
  provenance:
    run_ids:
    - foldchange-to-delta-fidelity__static
biological_summary: 'Transcription factors turn genes up or down, and the model learns how much from
  a table of measured fold changes -- 907 of them, each saying how far a target''s expression moves
  when its regulator binds. This study asked whether the model''s internal numbers still say what
  that table says. Mostly they do not. Across the 564 entries that could be checked, the typical
  gene ends up encoded at twice the expression its measurement specifies, and only about one in five
  lands within a factor of 1.5 of it. Genes that should be turned down are pushed too far down; genes
  that should be turned up are pushed nearly five-fold too far up.


  Six entries are worse than wrong in degree: they encode a negative probability of being transcribed,
  which is not a quantity that can exist.


  The case that led here is an ordinary example. LexA, the repressor that holds the cell''s DNA-damage
  response in check, is measured as reducing rpoD to about 64% -- a modest touch on the brake. The
  model encodes it as reducing it to four parts in a hundred million: the gene is switched off entirely.
  dnaG, which the cell needs to start every round of DNA replication, sits in the same operon as
  rpoD, but is itself a LexA target (log2FC -1.71) and is silenced through its own edge (corrected
  2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv log2FC -1.71). The cell then runs
  out of primase and stops dividing. A modest, well-measured piece of regulation became a lethal
  one somewhere between the data table and the simulation.'
conclusion_verdicts:
- claim: The distortion is isolated to dnaG's operon (H1)
  verdict: refuted
  basis: Median 2.01x across 564 entries; only ~20% within a factor of 1.5.
- claim: The TF-regulation layer systematically misencodes fold changes (H2)
  verdict: supported
  basis: 'Both subgroups fail: repressors 0.628x, activators 4.77x.'
- claim: The defect is saturation on strong regulation (H3)
  verdict: refuted
  basis: Strong-vs-weak distortion ratio 1.17 -- uniform in magnitude.
- claim: The defect is specific to repression (H4)
  verdict: refuted
  basis: Activators are distorted 4.77x, worse than repressors.
discovery_implications:
- 'dnaG''s collapse is not a dnaG or even a LexA phenomenon. It is one draw from a layer that misrepresents
  its inputs generally, and dnaG is exposed through its own LexA edge (corrected 2026-09-07: dnaG
  is a DIRECT LexA target, fold_changes_nca.tsv log2FC -1.71).'
- Every result in this investigation that leaned on delta_prob inherits this defect and should be
  re-read with it in mind.
- Six TF-target pairs encode negative initiation probabilities. Whether they reach the sampler is
  pc00010-repression-arithmetic's question; that they exist in the fit is this study's.
- The next question is which ParCa stage performs the fold-change-to-deltaV conversion (req-2, not
  blocking and not done here). Until it is found, the defect is characterised but not located.
- 40% of joined records come from cistrons in polycistronic TUs, where one delta must serve several
  fold changes. That structural ambiguity is worth its own treatment and connects to the known TU-dedup
  issue.
