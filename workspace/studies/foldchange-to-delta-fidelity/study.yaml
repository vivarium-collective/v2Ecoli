implementation_requirements:
- id: req-1
  status: complete
  blocking: true
  summary: Join delta_prob entries to their source fold changes.
  detail: 'fold_changes.tsv is keyed by (TF common name, TARGET CISTRON common name); delta_prob
    is keyed by (TU index, TF index). The join needs three maps, all already available: tf_ids from
    ecoli-tf-binding, the cistron_tu_mapping_matrix carried on several listener configs, and gene
    common-name to cistron id. A cistron regulated in a POLYCISTRONIC TU is the crux of this study
    -- LexA regulates dnaG DIRECTLY (log2FC -1.71) and also rpsU; rpoD is not in tf_to_fold_change
    at all -- so the join must record which cistron each TU-level delta came from and must not silently
    collapse a multi-cistron TU to one target. Entries that cannot be joined are reported as a count,
    never dropped quietly.'
- id: req-2
  status: not_started
  blocking: false
  summary: Locate the ParCa stage that converts fold changes into deltaV.
  detail: 'Needed to interpret a FAIL rather than merely record one. transcription_regulation.py
    exposes get_delta_prob_matrix but the deltaV values arrive precomputed in sim_data; the conversion
    happens earlier in the ParCa fit. Not blocking: the fidelity measurement stands whether or not
    the responsible line is found.'
alternative_hypotheses:
- name: H1 isolated pathology
  discriminator: distortion-is-systematic
  statement: Only a handful of entries are distorted and the network is otherwise faithful. Predicts
    distortion-is-systematic PASSES while the lexA-rpoD pin stays extreme -- a bad entry, not a bad
    layer.
- name: H2 systematic encoding defect
  discriminator: distortion-is-systematic
  statement: The median entry is misencoded by more than 2x, meaning the TF-regulation layer does
    not represent its input data and every result in this investigation that leaned on delta_prob
    needs revisiting.
- name: H3 saturation on strong repression
  discriminator: distortion-grows-with-repression-strength
  statement: Faithful for weak regulation and divergent for strong, i.e. a clipping or saturation
    behaviour. The dnaG case argues AGAINST the naive version of this -- a modest -0.65 became total
    silencing -- so a confirmation here would mean the saturation is not driven by fold-change magnitude
    at all.
- name: H4 repression-specific
  discriminator: activators-are-encoded-faithfully
  statement: Activators are encoded faithfully and repressors are not, localising the defect to the
    negative branch of the conversion.
falsifiability: 'Every hypothesis is separated by a named axis, and the activator subset is a genuine
  control rather than a formality: 523 of 907 fold changes are positive, so if the conversion were
  simply broken both subsets would fail together. The study also cannot be satisfied by its own motivating
  case -- that is a PIN, explicitly post-hoc, and the acceptance criteria are all network-level quantities
  not yet measured.'
assumptions:
- assumption: 2**log2FC is the retained fraction the delta should encode.
  basis: fold_changes.tsv declares its column as 'log2 FC mean', and a delta is defined in transcription_regulation.get_delta_prob_matrix
    as the change in initiation probability when the TF is bound; with ppgpp=True it is divided by
    basal_prob and so becomes relative, making 1 + delta the retained fraction directly comparable
    to 2**log2FC.
  risk: low
- assumption: A TU-level delta is attributable to its regulated cistron's fold change.
  basis: 'Necessary for the join, and imperfect: a TU carrying several regulated cistrons has one
    delta and several fold changes. req-1 requires such TUs be recorded rather than collapsed, and
    the study reports single-cistron and multi-cistron joins separately so this assumption is visible
    in the result instead of buried in it.'
  risk: medium
simulation_set: []
planned_runs:
- name: static-fit-analysis
  status: planned
  n_steps: 0
  details: 'NO SIMULATION AT ALL. This study reads two static artefacts: the ParCa cache (out/cache/sim_data_cache.dill,
    fingerprint ea05ac9b23b1d843) and reconstruction/ecoli/flat/fold_changes.tsv. It is a fit-validation
    study, and its result is a property of the cache every study in this investigation shares, not
    of any run.'
robustness:
  n_replicates: 1
  seeds: []
  parameter_sweep: false
  note: 'Replication is not meaningful: the quantities are deterministic properties of a fixed cache
    and a fixed TSV. The relevant breadth is the 907 fold changes and 47 TFs, not repeated draws.'
controls:
- name: activators-are-encoded-faithfully
  kind: negative
  hypothesis: If activators are distorted too, the defect is the conversion itself, not the repression
    branch.
  expected: median |log10 discrepancy| below 0.3 for positive fold changes.
  observed: Activators distorted 4.77x (receiving MORE than specified) against repressors at 0.628x
    (receiving less). The conversion is wrong in both directions.
  result: FAIL
limitations:
- The recorded value 1.8828 for lexa-rpod-discrepancy does not reproduce from this study's own measure.py,
  which returns 1.476e+07. It originated in a 'corrected conversion' that deltav-conversion-diagnosis
  later failed to validate. Any downstream claim resting on '1.88x off' should be treated as unsupported.
- "CORRECTION 2026-09-07 — this study's account of WHY LexA acts on the rpsU-dnaG-rpoD operon is\
  \ wrong, and the wrongness is inherited, not original to it.\nStatements in this file to the effect\
  \ that 'LexA regulates rpoD and dnaG is silenced as a passenger', or that a dnaG-bearing TU acquires\
  \ LexA because it contains rpoD, do not match the model. They came from checking only fold_changes.tsv,\
  \ which carries lexA->rpoD at log2FC -0.65 and no dnaG entry. There is a SECOND source, fold_changes_nca.tsv:\n\
  \    lexA  dnaG  -1.71        lexA  rpsU  -1.89\nand it is the one in force. tf_to_fold_change['PC00010']\
  \ holds EG10239_RNA (dnaG) at 0.30566, which is 2^-1.71 exactly, plus EG10896_RNA (rpsU) — and\
  \ does NOT contain EG10920_RNA (rpoD) at all. target_tf likewise lists PC00010 for dnaG and rpsU,\
  \ not rpoD. LexA is a DIRECT, cistron-level regulator of dnaG in this model. dnaG is not a passenger.\n\
  The real structural defect is different and stronger: regulation is assigned per CISTRON and then\
  \ unioned onto every TU containing that cistron (relation.py::_build_RNA_to_tf_mapping). dnaG's\
  \ LexA edge therefore lands on whatever TU carries dnaG, and after the gene-set dedup there is\
  \ exactly ONE such TU. The model cannot express 'LexA represses dnaG through this promoter but\
  \ not that one' — TU-specific differential regulation is structurally impossible, not merely mis-assigned.\
  \ It also means restoring the deduplicated promoters could not have separated them: all three TUs\
  \ carry an identical cistron set, so cistron-level regulation attaches LexA to all three.\nWHAT\
  \ THIS DOES AND DOES NOT INVALIDATE: measurements of the encoded delta, occupancy, the deficit\
  \ and the lineage outcomes are unaffected — they measured the model as built. What is wrong is\
  \ the causal STORY told about them. Any figure computed against rpoD's -0.65 as dnaG's input baseline\
  \ is wrong and should be recomputed against -1.71; in this investigation that includes the fold-change-to-delta\
  \ distortion, which is 7.08e+06-fold, not 1.48e+07.\nLeft in place rather than rewritten: the original\
  \ text is preserved above so the record shows what was believed when the work was done."
- The join is by common gene name between two independently maintained artefacts; unjoinable entries
  are counted and reported, but a systematic naming mismatch could bias which entries are examined.
- A polycistronic TU carrying several regulated cistrons has one delta and several fold changes.
  Reported separately, but no single expected value exists for such entries.
- 'The study measures fidelity between input and encoding. It does NOT establish which is right:
  a faithful encoding of a wrong fold change would pass every axis here.'
- The result is a property of cache fingerprint ea05ac9b23b1d843. A cache rebuilt after a ParCa change
  could differ, and this investigation has a recorded LexA-related ParCa fix on another branch whose
  relationship to this cache has not been checked.
- The cache under test (ea05ac9b23b1d843) deliberately PREDATES the LexA-related ParCa fix recorded
  on another branch. This study is therefore the discovery of the defect in an unfixed cache, not
  a check that the fix works; whether that fix addresses the systematic distortion measured here
  is a separate question.
claim: 'AMENDED: repressors are near-perfectly encoded (0.9998) and lexA->rpoD is 1.88x off, not
  1.5e+07x. dnaG is silenced because runtime LexA occupancy reaches 1.0, where a constraint-pinned
  delta of -1 becomes catastrophic -- not because ParCa misencoded the fold change.'
conclusion: 'Refuted, and more broadly than the motivating case. Across 564 joined entries the median
  encoded retained fraction is 2.01x its source fold change, with only ~20% landing within a factor
  of 1.5. The activator control FAILS alongside the repressors -- activators receive 4.77x what their
  fold change specifies while repressors receive 0.628x -- so the conversion is wrong in both directions
  rather than in its repression branch (H4 refuted). The distortion is uniform in fold-change magnitude
  (1.17x strong-vs-weak), so it is not saturation or clipping (H3 refuted). Six entries across six
  distinct TFs encode a NEGATIVE initiation probability. H2, a systematic encoding defect, is what
  survives.

  This reframes the investigation. dnaG''s collapse is not a dnaG phenomenon and not even a LexA
  phenomenon: it is one draw from a layer that misrepresents its inputs generally, and dnaG is exposed
  to it through its own cistron-level LexA edge, not through rpoD (corrected 2026-09-07: dnaG is
  a DIRECT LexA target, fold_changes_nca.tsv log2FC -1.71). Every result in this investigation that
  leaned on delta_prob inherits this, and the cache under test (ea05ac9b23b1d843) is a pre-fix cache
  being used deliberately to reproduce the discovery.

  What this study does NOT establish: which side is right. A faithful encoding of a wrong fold change
  would pass every axis here, and locating the responsible ParCa stage (req-2) was not blocking and
  was not done.


  AMENDED 2026-09-04 after activator-overshoot. Every number above was computed with the wrong comparison
  -- a full-swing 1 + delta/alpha against a fold change measured across a PARTIAL occupancy swing.
  Recomputed with FC_pred = (1 + r*p_a)/(1 + r*p_i) against the unchanged pre-registered bands: the
  network median falls 2.006 -> 1.538, activators 4.773 -> 2.131, negative-probability entries 6
  -> 2, and the lexA->rpoD pin 1.476e+07 -> 1.8828. The repressor median goes 0.6276 -> 0.9998.

  What survives: activators are genuinely over-encoded at 2.13x, and two entries still imply a negative
  probability. What does NOT survive is this study''s headline -- ParCa does not misencode fold changes
  by a median factor of 2 in both directions. Repressors are near-perfect, and the bidirectional
  asymmetry was my comparison error.

  The reframe matters more than the numbers: the FIT is nearly faithful and dnaG''s silencing is
  a RUNTIME occupancy effect. The constraint pins r at -1, harmless at the fitted occupancy of 0.66,
  and the simulation then drives occupancy to 1.0 where that same delta means total silencing. Two
  defects that are individually survivable and jointly lethal.'
confidence: Refuted
