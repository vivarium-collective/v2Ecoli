schema_version: 4
name: model-vs-experimental-proteome
created: '2026-09-08'
status: complete
phase: Decide
baseline:
- name: ecoli_baseline
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params: {}
variants: []
title: Does the identifiability defect show up against measured protein counts?
investigation: transcription-rewiring
study_type: validation
design_status: complete
implementation_status: not_started
simulation_status: complete
evaluation_status: evaluated
gate_status: partial
expert_review_status: not_requested
question: 'Every finding in this investigation so far compares the model to ITSELF or to a database:
  the 7.08e+06x fold-change-to-delta discrepancy is against the model''s own input, the 474 contradicted
  regulatory edges are against EcoCyc, and the 307 underdetermined TUs, 86%-liftable zeros and 23%
  protein movement are all the model against the model. Nothing has been compared to a measurement.

  That matters because the defects are established but their CONSEQUENCE is not. If genes sitting
  on underdetermined TUs, or carrying regulation EcoCyc contradicts, are no further from measured
  protein abundance than the rest of the model, then the defects are real, provable and immaterial
  — and the months of structural work the May impact assessment scoped as Option 3 would not be warranted.
  If they are systematically worse, that is the externally-validated case for doing it.

  Are the affected cohorts measurably further from experimental protein counts than the model at
  large?'
units_and_time:
  tick: 1 s of simulated time; the comparison reads generation-mean protein counts at steady state.
  quantities:
    protein count: 'molecules per cell (model: listeners.monomer_counts; experiment: copies/cell)'
    log-ratio error: log10(model count / measured count), signed; 0 = exact agreement
    cohort: a set of genes defined by which defect touches them
    hand-adjusted: a molecule whose expression, translation efficiency or degradation rate was tuned
      by hand in the flat files
datasets:
- name: Schmidt 2016
  role: PRIMARY validation
  independent: true
  path: ~/Documents/Proteomics data/schmidt et al 2016/41587_2016_BFnbt3418_MOESM18_ESM (1).xlsx
  note: 'The anchor. v2ecoli''s protein abundances are NOT seeded from it — they emerge from RNA-seq
    expression x Li 2014 translation efficiency / SILAC degradation, so agreement is prediction,
    not calibration. Multiple conditions available; use the one matching the simulated medium and
    say which. Model side: shipped out/cache, default configuration, generations 2-12, median across
    3 seeds.'
- name: Mori 2021
  role: comparison
  independent: true
  path: ~/Documents/Proteomics data/mori et al 2021/
  note: 'Second independent proteome. Its value is disagreement: where Schmidt and Mori differ for
    a gene, the model cannot be scored against either without saying so, and that between-dataset
    spread is the noise floor for the whole comparison.'
- name: Maeck 2015
  role: comparison
  independent: true
  path: ~/Documents/Proteomics data/maeck et al 2015/
  note: Third independent proteome; same role as Mori, coverage permitting.
- name: Li 2014
  role: NOT VALIDATION — model input
  independent: false
  path: ~/Documents/Proteomics data/Li et al 2014/
  note: EXCLUDED from validation by construction. Li 2014 ribosome profiling IS a ParCa input, via
    flat/translation_efficiency.tsv. Scoring the model against it would measure how well ParCa reproduces
    its own input. Retained only to check whether the affected cohorts are unusual in translation
    efficiency, which is a different question.
cohorts:
- name: underdetermined-tu
  n_expected: 307
  definition: genes whose TU sits in a rank-deficient NNLS block (tu-expression-identifiability)
  note: the identifiability cohort; their TU expression is a solver artefact
- name: contradicted-regulation
  n_expected: 473
  definition: genes on a TU carrying a regulatory edge EcoCyc places on a different TU of the same
    operon
  note: the misattribution cohort (promoter-specific-regulation)
- name: hand-adjusted
  n_expected: 65 molecules + 25 structural rows
  definition: "EXCLUSION cohort. Compiled by analyses/tuning_inventory.py, which sweeps ALL 131 TSVs\
    \ under flat/ including subdirectories.\nDIRECT parameter adjustments — 65 distinct molecules:\n\
    \  balanced_translation_efficiencies 28, translation_efficiencies_adjustments 25,\n  rna_expression_adjustments\
    \ 10, rna_deg_rates_adjustments 3, protein_deg_rates_adjustments 1\nSTRUCTURAL removals carrying\
    \ tuning intent — 25 rows:\n  fold_changes_removed 20 of 36 ('Remove to increase ribosome counts…',\
    \ 'Remove to get expression of arcA')\n  complexation_reactions_removed 4 of 36 ('Removed to\
    \ prevent the reaction from depleting DNA helicase', '…depleting subunits of the full 30S ribosome')\n\
    \  equilibrium_reactions_removed 1 of 77 ('…causes issues with simulations')"
  note: 'For these the model was adjusted toward the right answer, with comments stating the intent.
    Agreement with experiment is partly circular, so they are excluded from the headline comparison
    and scored separately as a POSITIVE CONTROL.

    The structural removals matter as much as the direct ones and are easy to miss: removing a complexation
    reaction protects a free monomer pool, so it changes predicted protein counts just as surely
    as editing an expression value. The DNA-helicase and 30S entries protect exactly the kind of
    essential subunit this investigation cares about.

    SCOPE RESOLVED (req-3): the inventory is COMPLETE, not a lower bound. v2ecoli''s ParCa applies
    no code-level tuning — the adjust_* helpers are data-driven, and adjust_final_expression, the
    one function that could hard-code per-gene factors, is never called. fit_sim_data_1.py is the
    upstream wcEcoli fitter and is not on v2ecoli''s execution path.'
- name: baseline
  definition: every remaining gene with a measured abundance in the primary dataset
  note: the reference distribution the cohorts are compared against
behavior_tests:
- name: coverage-is-sufficient-to-compare
  classification: supporting
  gate_class: acceptance_criterion
  question: Do enough genes in each cohort have a measured abundance to compare at all?
  description: 'At least 50% of each cohort''s genes have a Schmidt 2016 measurement in the matched
    condition.


    The gate on the whole study. A cohort with sparse coverage cannot be compared to baseline, and
    a difference measured on 30 of 307 genes is not a model-wide claim.


    Threshold provenance: theory. 50% is the floor below which any cohort-level statistic is dominated
    by which genes happen to be detected rather than by the model.'
  measure:
    kind: derived
    path: minimum, over cohorts, of the fraction of genes with a primary-dataset measurement
    detail: gene-symbol join to Schmidt 2016; unmatched genes reported, never silently dropped.
  pass_if:
    low: 0.5
    high: 1.0
    provenance:
      kind: theory
      note: Bounded above by 1.0; below 0.5 a cohort statistic reflects detection bias more than
        the model.
  status: failed
  result: FAIL
  measured_value: 0.4955
  evaluated_by: agent
  detail: "0.4955 against a band of [0.5, 1.0]. FAIL by 0.0045, recorded as pre-registered.\n  underdetermined-tu\
    \   287 genes, 190 with Schmidt, coverage 0.6620\n  hand-adjusted         53 genes,  48 with\
    \ Schmidt, coverage 0.9057\n  baseline            4022 genes, 1993 with Schmidt, coverage 0.4955\n\
    The failure is on the BASELINE reference population, not on either comparison cohort. Both of\
    \ those clear the floor comfortably. Schmidt 2016 measures 2352 genes against the model's 4309\
    \ monomers, so roughly half the model's proteome is simply not in the dataset.\nAXIS MIS-SPECIFICATION,\
    \ recorded rather than fixed after the fact. I wrote the measure as the minimum over ALL cohorts\
    \ including baseline. The question it was meant to answer is whether each COMPARISON cohort has\
    \ enough measured genes to be compared against a reference — for which 1993 baseline genes is\
    \ ample. Taking the minimum over the reference population itself makes the gate fail on a property\
    \ of the dataset rather than on comparability. Re-specifying it now would be post-hoc, so the\
    \ FAIL stands and any successor should scope the measure to the comparison cohorts explicitly.\n\
    The study remains feasible: 190 underdetermined genes against 1993 baseline genes is a workable\
    \ comparison, and that is what the axis was for."
- name: between-dataset-spread-sets-the-noise-floor
  classification: supporting
  gate_class: acceptance_criterion
  question: How much do the experimental datasets disagree with each other?
  description: 'Median |log10(Schmidt / Mori)| over genes measured in both, reported as the floor
    against which any model-vs-experiment difference must be judged.


    Without this the study can report a model error that is smaller than the disagreement between
    two measurements of the same quantity, which would be meaningless. Recorded as an acceptance
    criterion rather than a pin because a large value would invalidate the comparison, not merely
    qualify it.


    Threshold provenance: theory. Proteomics replicates across labs are commonly within a few-fold;
    above 0.5 dex (about 3x) the datasets are too inconsistent to adjudicate a 2x model error.'
  measure:
    kind: derived
    path: median |log10(Schmidt / Mori)| across genes present in both
    detail: same condition where available; state the condition pairing explicitly.
  pass_if:
    op: <=
    value: 0.5
    provenance:
      kind: theory
      note: 0.5 dex is about 3x. Above it, a 2x model discrepancy cannot be distinguished from measurement
        disagreement.
  status: failed
  result: FAIL
  measured_value: 0.5296
  evaluated_by: agent
  detail: "0.5296 dex (3.39x) against a band of <= 0.5 dex. FAIL by 0.03, recorded as pre-registered.\n\
    Schmidt 2016 Glucose against Maeck 2015 M9, 1464 genes measured in both:\n  p25 0.287 dex (1.94x)\
    \ | median 0.530 (3.39x) | p75 0.857 (7.19x) | p90 1.356 (22.7x)\n  agreeing within 2x: 26.4%\
    \   within 3x: 44.7%\nTwo independent absolute proteomes of the same organism in comparable minimal\
    \ media disagree by 3.4x at the median, and three quarters of genes disagree by more than 2x.\
    \ That is the floor against which any model-vs-experiment claim must be read.\nWHAT IT DOES AND\
    \ DOES NOT INVALIDATE. It does NOT mechanically kill the cohort axes: those compare MEDIAN |log10\
    \ error| aggregated over ~190 and ~1993 genes, and an aggregate can resolve a difference below\
    \ per-gene noise provided the noise is unbiased between cohorts. It DOES mean the pre-registered\
    \ 1.3x cohort band sits well inside the per-gene measurement noise, so a cohort result near that\
    \ boundary cannot be distinguished from dataset choice. H3 — that the comparison cannot adjudicate\
    \ — is partially supported and must be carried into the cohort verdicts rather than mentioned\
    \ once here.\nMori 2021 could not serve as a second check: it reports MASS FRACTIONS, not copies\
    \ per cell, and converting needs total protein mass and per-protein molecular weights, assumptions\
    \ this study has not made."
- name: underdetermined-cohort-is-worse
  classification: primary
  gate_class: acceptance_criterion
  question: Are genes on underdetermined TUs further from measured abundance than the rest of the
    model?
  description: 'Ratio of median |log10 error| for the underdetermined-TU cohort over the baseline
    cohort, on genes measured in Schmidt 2016, excluding hand-adjusted molecules.


    THE axis. tu-expression-identifiability showed the tie-break moves 23% of affected proteins by
    more than 2x BETWEEN TWO EQUALLY-VALID MODEL ARMS. It could not say whether either arm is right.
    This asks whether the arbitrariness costs accuracy against measurement.


    Band is two-sided so that BOTH answers are informative: at or below 1.0 the defect is immaterial
    to predictive accuracy and the structural fix is not warranted on these grounds; materially above
    1.0 it is. Anchored at 1.3 because a 30% inflation of median error is the smallest effect worth
    acting on given the between-dataset noise floor.


    Threshold provenance: theory, stated before measurement.'
  measure:
    kind: derived
    path: median |log10(model/measured)| for the underdetermined cohort over the same for baseline
    detail: Schmidt 2016 primary; hand-adjusted molecules excluded from both cohorts; Mori 2021 as
      a repeat.
  pass_if:
    low: 0.7
    high: 1.3
    provenance:
      kind: theory
      note: Two-sided about parity. PASS means the cohort is indistinguishable from baseline — the
        defect does not cost accuracy. FAIL above 1.3 means it does. FAIL below 0.7 would mean affected
        genes are BETTER predicted, which would itself need explaining.
  status: passed
  result: PASS
  measured_value: 0.8809
  evaluated_by: agent
  detail: '0.8809 against a two-sided band of [0.7, 1.3]. PASS — the cohort is INDISTINGUISHABLE
    from baseline, and if anything slightly better: cohort median 0.3655 dex against baseline 0.4150,
    n=189.

    THE STUDY''S CENTRAL RESULT, and it is a null. tu-expression-identifiability established that
    307 TUs carry expression the cistron data never determines, that 86% of their zeros are arbitrary,
    and that the tie-break moves 23% of their proteins by more than 2x between equally-valid arms.
    None of that costs measurable accuracy against an independent proteome.

    H2 — real but absorbed — is supported over H1. The defect is a correctness problem, not an accuracy
    one, and the structural fix scoped as Option 3 in the May impact assessment is NOT warranted
    on accuracy grounds.

    Read against the noise floor: the cohort differs from baseline by 0.05 dex where two experimental
    datasets differ by 0.53 dex per gene. The aggregate can resolve that only if the noise is unbiased
    between cohorts, which is assumed rather than shown. A null this close to parity is more robust
    to that assumption than a marginal positive would have been, but it is not immune to it.'
- name: contradicted-regulation-cohort-is-worse
  classification: primary
  gate_class: acceptance_criterion
  question: Are genes whose regulation EcoCyc contradicts further from measured abundance?
  description: 'Same construction for the 473 contradicted-regulation genes.


    promoter-specific-regulation removed those edges and the lineage survived, but survival is a
    weak test — it says the cell lives, not that abundances improved. If this cohort is no worse
    than baseline, the misattribution is real and cheap; if it is worse, the correction has an externally-measurable
    benefit and that is the argument for adopting it by default rather than behind a flag.


    Threshold provenance: theory, same band and reasoning as the axis above.'
  measure:
    kind: derived
    path: median |log10(model/measured)| for the contradicted cohort over baseline
    detail: same exclusions and repeat dataset.
  pass_if:
    low: 0.7
    high: 1.3
    provenance:
      kind: theory
      note: As above; two-sided about parity.
  status: passed
  result: PASS
  measured_value: 1.0549
  evaluated_by: agent
  detail: '1.0549 against [0.7, 1.3]. PASS — indistinguishable from baseline. Cohort median 0.4378
    dex against baseline 0.4150, n=290.

    Genes carrying regulation EcoCyc places on a different promoter are no further from measured
    abundance than the rest of the model. So the misattribution promoter-specific-regulation corrected
    is real (EcoCyc contradicts 473 edges) and consequential for LINEAGE SURVIVAL under subunit gating
    (12 generations against 4-9), but it does not show up in steady-state protein abundance under
    the default configuration. Those are compatible: the dnaG rescue was about a threshold effect
    on one essential primase, not about population-wide abundance error.'
- name: hand-adjusted-cohort-is-better
  classification: primary
  gate_class: acceptance_criterion
  question: Does the hand-tuning show up as better agreement, confirming it must be excluded?
  description: 'Ratio of median |log10 error| for the 65 hand-adjusted molecules over baseline. Predicted
    BELOW 1.0 — they should agree better, because they were tuned toward agreement.


    The control that validates the exclusion. If hand-adjusted molecules are NOT better predicted,
    the adjustments are not doing what their comments claim and the exclusion is over-cautious. If
    they ARE, the exclusion is necessary and the headline comparison is clean.


    Threshold provenance: theory. PASS requires demonstrably better agreement, which is what justifies
    removing them from the other axes.'
  measure:
    kind: derived
    path: median |log10(model/measured)| for hand-adjusted molecules over baseline
    detail: the 65 molecules from flat/adjustments/ plus the 26 fold_changes_removed targets, scored
      separately.
  pass_if:
    op: <=
    value: 0.8
    provenance:
      kind: theory
      note: At least 20% lower median error than baseline, the minimum that demonstrates the tuning
        took effect.
  status: passed
  result: PASS
  measured_value: 0.7775
  evaluated_by: agent
  detail: '0.7775 against a band of <= 0.8. PASS — hand-tuned molecules ARE better predicted: cohort
    median 0.3227 dex against baseline 0.4150, n=48.

    The positive control works, which is what validates excluding them. Had they NOT been better
    predicted, the join or the count extraction would have been suspect and every other number here
    with it.

    CONFOUND, recorded before the result and still standing: this cohort has 0.906 Schmidt coverage
    against baseline''s 0.496, so it is disproportionately abundant and well-measured. Part of the
    advantage may be abundance rather than tuning. An abundance-matched baseline subset would separate
    them and has not been run.'
- name: model-wide-accuracy-baseline
  classification: supporting
  gate_class: regression_pin
  question: How well does the model predict measured protein abundance overall?
  description: Median |log10(model/measured)| across all comparable genes. A PIN — it has never been
    measured in this workspace, so no threshold can be pre-registered honestly. It exists so every
    cohort ratio above has a stated denominator, and so the number cannot drift unnoticed.
  measure:
    kind: derived
    path: median |log10(model/measured)| over all genes with a Schmidt measurement
    detail: excluding hand-adjusted molecules; reported with the interquartile range.
  pass_if:
    op: <=
    value: 2.0
    provenance:
      kind: post_hoc
      note: 2.0 dex (100x) is a deliberately loose drift guard, not a quality claim. Replace with
        a real pin once measured.
  status: passed
  result: PASS
  measured_value: 0.415
  evaluated_by: agent
  detail: 'Median |log10(model/Schmidt Glucose)| = 0.4150 dex, i.e. 2.60x, over 1728 baseline genes.
    IQR 0.187-0.839. Within 2x: 38.7%. Within 10x: 80.8%.

    This is the first external accuracy number for v2ecoli''s proteome in this workspace, and it
    is better than it might look: the model sits 2.60x from Schmidt while Schmidt sits 3.39x from
    Maeck. The model agrees with the primary dataset more closely than two independent experimental
    datasets agree with each other.

    That comparison is indicative, not exact — 2.60x is over 1728 genes and 3.39x over a different
    1464 — but the order is the point: model error is at or below inter-laboratory measurement spread.
    Recorded as a pin because no threshold could be pre-registered honestly for a quantity never
    measured here before.'
preregistered:
  declared_before_runs: true
  date: '2026-09-08'
  criteria:
  - test: coverage-is-sufficient-to-compare
    prior: Schmidt 2016 covers over half of each cohort; this is a gate, not a finding
  - test: between-dataset-spread-sets-the-noise-floor
    prior: independent proteomes agree within about 3x, so a 2x model effect is adjudicable
  - test: underdetermined-cohort-is-worse
    prior: genuinely uncertain. The tie-break moves 23% of these proteins >2x between arms, so a
      real accuracy cost is plausible; but ParCa refits downstream and may absorb it. I am not predicting
      a direction.
  - test: contradicted-regulation-cohort-is-worse
    prior: I expect a modest excess error, since these genes carry regulation applied to the wrong
      promoter, but the effect is likely smaller than the identifiability one because most contradicted
      edges are on well-determined TUs
  - test: hand-adjusted-cohort-is-better
    prior: they should be better predicted; that is what the adjustments were for, and their comments
      say so
alternative_hypotheses:
- name: H1 the defects cost predictive accuracy
  discriminator: underdetermined-cohort-is-worse
  statement: Affected cohorts sit measurably further from measured abundance, giving an externally-validated
    case for the structural fix the May impact assessment scoped as Option 3.
- name: H2 real but absorbed
  discriminator: underdetermined-cohort-is-worse
  statement: 'The defects are real in the parameters but ParCa''s downstream refitting absorbs them,
    so predicted abundances are no worse. Plausible: the fit re-balances mass and expression after
    the TU split, and tu-expression-identifiability found growth completely unaffected (tau ratio
    0.978). This would make the identifiability work a correctness argument, not an accuracy one.'
- name: H3 the comparison cannot adjudicate
  discriminator: between-dataset-spread-sets-the-noise-floor
  statement: 'Independent proteomes disagree by more than the effect being measured, so neither H1
    nor H2 is decidable from this data. A real outcome, not a failure mode to hide: it would redirect
    effort to a condition-matched or targeted measurement rather than a genome-wide comparison.'
- name: H4 baseline accuracy is too poor to resolve cohorts
  discriminator: model-wide-accuracy-baseline
  statement: If the model is already many-fold off for most genes, a 30% difference in median error
    between cohorts is noise. This is why the baseline is pinned rather than assumed.
falsifiability: 'The study fails at its own gate if Schmidt 2016 covers under half of any cohort,
  or if independent proteomes disagree by more than 0.5 dex — in either case no cohort claim is supportable
  and that is the finding. The hand-adjusted control is the internal check: if molecules explicitly
  tuned toward experimental agreement are NOT better predicted, the join or the count extraction
  is wrong and every other number in the study is suspect.'
controls:
- name: hand-adjusted cohort (positive)
  kind: positive
  detail: Molecules tuned toward agreement must show better agreement. If they do not, the pipeline
    is broken, not the model.
- name: second independent proteome (replication)
  kind: replication
  detail: Every cohort ratio repeated on Mori 2021. A conclusion holding on one dataset only is reported
    as such.
- name: Li 2014 exclusion (negative)
  kind: negative
  detail: Li 2014 is a ParCa INPUT via translation_efficiency.tsv. Scoring against it would measure
    ParCa reproducing its own input and should show near-perfect agreement; if it does not, the extraction
    is wrong. Used as a diagnostic, never as validation.
assumptions:
- name: Schmidt 2016 is independent of the model
  detail: Protein abundances emerge from RNA-seq expression x Li 2014 translation efficiency / SILAC
    degradation. Schmidt is not among ParCa's inputs. The 65 hand-adjusted molecules are the known
    exception and are excluded.
  risk: low
- name: the hand-adjustment inventory is complete
  detail: Compiled from flat/adjustments/ (5 files) and fold_changes_removed.tsv. Other tuning may
    exist elsewhere in ParCa code rather than data — fit_sim_data_1.py is named as the source in
    several _comments fields, so code-level adjustments are likely and are NOT yet enumerated.
  risk: medium
- name: gene-symbol join is reliable
  detail: Model uses EcoCyc frame ids; proteomes use gene symbols or UniProt. The join is the most
    likely source of silent error, and this investigation has already lost a whole afternoon to a
    name-matching bug (the 9-of-23 TF figure). Unmatched genes are reported, never dropped silently.
  risk: high
- name: condition matching
  detail: Schmidt 2016 reports many growth conditions. The comparison must use the one matching the
    simulated medium and say which; comparing glucose-minimal model output to an LB proteome would
    be a category error.
  risk: medium
implementation_requirements:
- id: req-1
  status: not_started
  blocking: true
  summary: Extract and cache the proteomics datasets as tidy TSVs with provenance.
  detail: Read the four xlsx sources into references/proteomics/<dataset>.tsv keyed on gene symbol
    + UniProt where available, recording sheet name, column and condition. The xlsx files stay outside
    the repo; the derived tables are small enough to commit and make the join auditable.
- id: req-2
  status: not_started
  blocking: true
  summary: Build the frame-id to gene-symbol map and REPORT its failures.
  detail: Highest-risk step. Emit matched and unmatched counts per cohort; a cohort losing most of
    its genes to the join is a coverage failure, not a small-n result.
- id: req-3
  status: done
  blocking: false
  summary: Enumerate CODE-level parameter adjustments; the data-level sweep is a lower bound.
  detail: 'Several _comments name fit_sim_data_1.py as the source, so the 65-molecule inventory from
    flat/adjustments/ is a lower bound. Any molecule tuned in code must join the exclusion cohort
    before the headline comparison is graded.

    The data-level inventory is now reproducible (analyses/tuning_inventory.py, all 131 TSVs). What
    it cannot see is tuning applied in Python: fit_sim_data_1.py is named as the _source in rna_expression_adjustments,
    translation_efficiencies_adjustments, rna_deg_rates_adjustments and protein_deg_rates_adjustments,
    so that file is the place to look first.'
  finding: "ANSWERED, and negatively: v2ecoli's ParCa applies NO code-level parameter tuning beyond\
    \ the flat files, so the 65-molecule inventory is COMPLETE rather than a lower bound.\nEvidence,\
    \ four independent checks:\n  1. No hard-coded molecule id paired with a numeric tweak anywhere\
    \ in v2ecoli/processes/parca/ (regex over EG#####/G####/CPLX*/MONOMER* against *=, /=, factor,\
    \ scale).\n  2. The five adjust_*/balance_* helpers in step_02_input_adjustments.py are PURE:\
    \ each takes an `adjustments` dict argument and applies it. No ids are named in code.\n  3. That\
    \ dict is state['adjustments'], and its contents match the flat files exactly — translation_efficiencies\
    \ 25, balanced_translation_efficiencies 4 groups, rna_expression 10, rna_deg_rates 3, protein_deg_rates\
    \ 1.\n  4. simulation_data.adjust_final_expression — the one function that COULD apply arbitrary\
    \ per-gene factors, mutating synth_prob, rna_expression, exp_free, exp_ppgpp, basal_prob and\
    \ delta_prob together — is DEFINED BUT NEVER CALLED in v2ecoli. It is dead code inherited from\
    \ wcEcoli; step_09 mentions it only in docstrings.\nThe fit_sim_data_1.py named in several _source\
    \ fields is the upstream wcEcoli fitter, present in .venv but not on v2ecoli's execution path.\
    \ Those fields record where the VALUES came from, not code that runs here."
- id: req-4
  status: not_started
  blocking: false
  summary: Reuse the existing monomer-count reader.
  detail: listeners.monomer_counts via the distilled runs; do not re-derive counts from expression.
- id: req-5
  status: done
  blocking: true
  summary: Simulate the SHIPPED model (out/cache, default config) and extract counts.
  detail: 'Resolved by the correction above: the baseline arm is out/cache in its default configuration,
    which has never been simulated in this session. 3 seeds x 12 generations, distilled keeping listeners__monomer_counts.

    Note the earlier framing of this requirement assumed a choice between a short window and a corrected
    model. Both horns were artefacts of running mechanistic_replisome=True.'
  finding: 'Shipped model, DEFAULT configuration, 3 seeds x 12 generations: 12/12 divided in every
    seed. No arrest — direct confirmation that the arrest belongs to mechanistic_replisome=True and
    not to the shipped model. Distilled to out/model-vs-experimental-proteome-distilled with monomer_counts
    kept (19.6 GB -> 8.7 MB).'
limitations:
- 'EXTRACTION BUG, found and fixed before any number was recorded, and worth carrying as a warning.
  Schmidt Table S6 contains THREE sections with IDENTICAL column names — ''Protein copies/cell''
  at column 7, ''Protein Mass (fg)/Cell'' at 29, ''Coefficient of Variance (%)'' at 51. Selecting
  a condition by column NAME returns the LAST match, so the first extraction read coefficients of
  variation as if they were copy numbers and produced a 101x noise floor. Sections are now selected
  by POSITION from the row-1 labels. Any future use of this workbook must do the same.

  A second bug in the same pass: the Maeck gene-symbol parser had an inverted predicate and selected
  JW locus tags instead of symbols, cutting the Schmidt overlap to 515 genes. Fixed, overlap is 1465.'
- 'The tuning inventory was built twice. A first pass used a narrow keyword list and found only the
  adjustments/ directory, missing fold_changes_removed.tsv and complexation_reactions_removed.tsv
  entirely — the second of which protects essential-subunit pools and is directly relevant here.
  The committed inventory sweeps all 131 TSVs with a broad pattern and prints every hit for inspection,
  but the episode is the reason req-3 is blocking: a keyword sweep cannot find tuning that lives
  in code.'
- Protein counts are compared at one condition. A cohort effect could be condition-specific and this
  design would miss it.
- The hand-adjustment inventory covers DATA-level tuning only. Code-level adjustments in fit_sim_data_1.py
  are named in the comments and not yet enumerated (req-3), so the exclusion cohort is a lower bound
  and baseline accuracy may be flattered.
- 'A null result — cohorts indistinguishable from baseline — bounds the defects'' cost at this resolution.
  It does not show they are harmless: a gene can be predicted to the right abundance through compensating
  errors, and dnaG itself is a case where the phenotype, not the count, was the observable that mattered.'
- Schmidt 2016 measures a population average. The model is single-cell; heterogeneity is invisible
  to this comparison.
- Schmidt 2016 covers 2352 genes against the model's 4309 monomers, so about half the model's proteome
  has no measurement and every cohort claim is restricted to the measured half. Detection is biased
  toward abundant proteins, so the comparison is systematically better-informed about abundant genes.
- 'CONFOUND for the hand-adjusted positive control: that cohort has 0.9057 Schmidt coverage against
  the baseline''s 0.4955. Tuned genes are disproportionately abundant and well-measured, so if they
  show better agreement it may reflect abundance and measurement quality rather than the tuning.
  The control should be compared against an abundance-matched baseline subset, not the whole baseline.'
- 'The shipped model does not hold a true steady state over 12 generations: generation time rises
  43 -> 55-59 min, dry mass falls ~700 -> ~600 fg, and total protein burden falls ~18%, reproducibly
  across seeds. Counts are compared in the most stable window available (generations 4-12, ~6% burden
  drift), but the comparison is against a slowly shrinking cell rather than the balanced exponential
  growth Schmidt measured.'
discovery_implications:
  resolved_uncertainties:
  - 'Whether the identifiability and misattribution defects cost measurable predictive accuracy:
    they do not, at steady state in glucose minimal, against Schmidt 2016.'
  - 'How accurate v2ecoli''s proteome is against an independent measurement: 2.60x median, 38.7%
    within 2x, 80.8% within 10x — at or below the 3.39x spread between two experimental datasets.'
  remaining_uncertainties:
  - Whether the identifiability and misattribution defects cost measurable predictive accuracy —
    the study's whole point.
  - Whether promoter-resolved apportionment (per_promoter_ratios.tsv, Thomason 2015) would improve
    agreement; this study sets the baseline that question needs but does not answer it.
  followup_study_proposals:
  - id: promoter-ratios-improve-accuracy
    title: Does per-promoter apportionment improve agreement with measured abundance?
    motivation: SUPERSEDED as a priority by this study's null result. The direct test of promoter-resolved
      apportionment was worth running only if the underdetermined cohort proved measurably worse.
      It is not (0.88x baseline error). Any case for per_promoter_ratios.tsv now has to rest on correctness,
      on specific threshold-sensitive loci such as dnaG, or on conditions this study did not test
      — not on genome-wide abundance accuracy.
    mechanism: Replace the NNLS vertex with measured per-promoter shares and re-measure the cohort
      error.
