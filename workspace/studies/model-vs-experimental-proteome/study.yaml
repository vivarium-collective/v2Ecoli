claim: The identifiability and misattribution defects do NOT cost measurable predictive accuracy.
  Genes on underdetermined TUs sit at 0.88x baseline error and genes with EcoCyc-contradicted regulation
  at 1.05x, both inside a [0.7, 1.3] band. The model as a whole predicts Schmidt 2016 protein abundances
  to 2.60x at the median — closer than Schmidt and Maeck agree with each other (3.39x). So the structural
  fix scoped as Option 3 in the May impact assessment is not warranted on accuracy grounds; the defects
  are correctness problems, not accuracy ones.
confidence: Accepted
count_extraction:
  decided: '2026-09-08'
  question: How should model protein counts be extracted for comparison?
  method: 'Generation-MEAN monomer counts (listeners.monomer_counts), taken over DIVIDING generations
    from generation 2 onward, median across seeds. Never an instantaneous timepoint: counts double
    and halve within a cycle by construction, so a single tick is a phase measurement, not an abundance.

    The arrest generation is EXCLUDED wherever a lineage arrests. It runs to the 200-minute cap with
    dry mass at 3000-4500 fg against a normal ~700, so its counts describe a pathological state.
    An earlier version of this analysis anchored convergence on the final generation and was measuring
    exactly that artefact.'
  evidence: "Consecutive-generation drift in median |log10(gen_n / gen_n-1)| over dividing generations:\n\
    \  vertex   seed1  0.134, 0.116, 0.113, 0.110, 0.115, 0.117, 0.117  (gens 1-8)\n  vertex   seed0\
    \  0.134, 0.122, 0.114\n  min-norm seed0  0.145, 0.139, 0.131, 0.126\nGeneration 1 sits slightly\
    \ high; from generation 2 the drift PLATEAUS at 0.11-0.13 dex and does not shrink further. So\
    \ the transient is short — one generation — but there is no asymptotic convergence either."
  consequence: 'The plateau is a THIRD noise floor, alongside between-dataset disagreement and between-seed
    spread: the model''s own generation-to-generation reproducibility is about 1.3x. Any cohort difference
    smaller than that is not resolvable no matter how many genes are compared, and averaging over
    generations and seeds is what buys it down.

    It also bounds the pre-registered cohort bands. Those ask for a 1.3x ratio of MEDIAN |log10 error|
    between cohorts, which is a different quantity from a 1.3x per-generation drift in counts — but
    the two being the same order is a warning that the design is near its resolution limit, and should
    be stated when the axes are graded rather than discovered afterwards.'
  open_decision: 'RESOLVED 2026-09-08. The dilemma rested on a wrong premise — that the unmodified
    model has no long steady state. It does: mechanistic_replisome defaults to FALSE in a built composite,
    so the shipped configuration does not gate on subunit availability and lineages complete.

    DECISION: the baseline is out/cache — the shipped model, 3277 TUs, DEFAULT configuration — simulated
    for 12 generations across 3 seeds, counts taken as generation means over dividing generations
    from generation 2, median across seeds. That is what v2ecoli ships and what Schmidt measured:
    balanced exponential growth.

    The mechanistic_replisome=True arms become a SEPARATE question — does the accuracy picture change
    under subunit gating — rather than the baseline. Framing them as the baseline would have compared
    Schmidt''s steady-state proteome against a model in replication arrest.'
  window:
    generations: 4-12 inclusive
    excluded: 1-3 (transient), 13 (birth stub)
    seeds: 3
    statistic: generation mean per gene, then median across generations and seeds
    evidence: "Measured on the shipped-default runs rather than assumed.\n  median |log10(gen_n /\
      \ gen_2)| per gene:\n    seed0  g3 0.126  g4 0.188  g5-g12 0.196-0.217  g13 0.305\n    seed1\
      \  g3 0.128  g4 0.207  g5-g12 0.182-0.216  g13 0.282\n    seed2  g3 0.144  g4 0.214  g5-g12\
      \ 0.180-0.207  g13 0.268\nCounts move away from generation 2 and then PLATEAU from generation\
      \ 4 — they settle to a level, they do not keep migrating. Generations 2-3 are still transient,\
      \ so the window opens at 4.\nGeneration 13 is a BIRTH STUB, not a generation: a 12-generation\
      \ request records 13 partitions because the final daughter emits one tick. Its total protein\
      \ burden is 3.59M against ~5M for a real generation — half a cell. Including it would drag\
      \ every gene's mean down by roughly a third."
    caveat: 'The window is stable but not stationary. Across generations 4-12 total protein burden
      declines from 5.31M to 4.98M, about 6%, and over the full run from 6.08M — roughly 18%. Generation
      time rises 43 -> 55-59 min and dry mass falls ~700 -> ~600 fg over the same span, consistently
      across all three seeds, so this is a property of the model rather than seed noise.

      The shipped model is therefore slowly SHRINKING over twelve generations rather than sitting
      at balanced growth. Schmidt 2016 measured balanced exponential growth, so the comparison is
      against a model state that is close to but not exactly the experimental condition. A ~6% drift
      within the window is small against the 1.3x noise floors already recorded, but it means the
      choice of window shifts absolute counts and must be stated, not buried.'
corrections:
- date: '2026-09-08'
  field: what "the shipped model" does
  status: corrected
  raised_by: user
  summary: 'Statements that the shipped/unmodified model arrests at 4-9 generations are wrong as
    written. Every arrest in this investigation — the original one in mechanistic-replisome-arrest
    and all of ours this week — came from runs passing mechanistic_replisome=True explicitly. The
    effective default in a built composite is FALSE: the process schema in chromosome_replication.py
    declares _default True, but the composite overrides it, verified by building ecoli_baseline against
    out/cache and reading the instantiated parameter. Under the default the model does not gate on
    subunit availability and lineages complete.

    Correct statement: under mechanistic_replisome=True, a non-default setting this investigation
    deliberately studies, lineages arrest at 4-9 generations. Under the default they do not.

    I asserted the wrong version repeatedly after reading the schema default and not checking what
    a real build carries. out/cache — the actual shipped model — has never been simulated in this
    session; its behaviour was inferred from 3279-TU arms that differ from it.'
