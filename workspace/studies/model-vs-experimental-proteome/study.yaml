findings:
- summary: 'The defects are real and provable but do not reach predictive accuracy: both affected
    cohorts are indistinguishable from baseline against an independent proteome.'
  status: novel
  tier: interpretation
  mechanism_origin: emergent
  evidence:
    from_run: model-vs-experimental-proteome__shipped-default
    from_tests:
    - underdetermined-cohort-is-worse
    - contradicted-regulation-cohort-is-worse
    - hand-adjusted-cohort-is-better
    - model-wide-accuracy-baseline
    observed: underdetermined 0.3655 dex (n=189) and contradicted 0.4378 (n=290) against baseline
      0.4150 (n=1728) — ratios 0.88 and 1.05; hand-adjusted control 0.3227, ratio 0.78; Schmidt-vs-Maeck
      noise floor 0.5296
    units: dex, i.e. |log10(model copies per cell / measured copies per cell)|
  explanation: 'This investigation spent three days establishing defects by internal consistency:
    a 7.08e+06x fold-change-to-delta discrepancy, 473 regulatory edges EcoCyc contradicts, 307 TUs
    whose expression the data never determines with 86% of their zeros arbitrary, and a tie-break
    that moves 23% of affected proteins more than 2x between equally-valid arms. Every one of those
    is real and none was measured against experiment.


    Measured against experiment, none of them shows up. Both cohorts sit inside a two-sided parity
    band, and the underdetermined cohort is if anything slightly BETTER predicted than the rest of
    the model.


    The positive control makes the null interpretable rather than merely quiet: molecules hand-tuned
    in the flat files ARE better predicted (0.78x baseline error), so the pipeline can detect a real
    accuracy difference when one exists. It found one where tuning was applied and none where the
    defects live.


    H2 — real but absorbed — is supported over H1. ParCa refits mass, expression and the metabolic
    layer downstream of the TU split, and the evidence is that this absorbs the arbitrariness before
    it reaches steady-state abundance. The practical consequence is a decision: the months of structural
    work scoped as Option 3 in the May impact assessment is not justified by accuracy, and the case
    for promoter-resolved apportionment has to rest on correctness, on specific loci like dnaG where
    a threshold effect matters, or on conditions this study did not test.


    What the null does NOT say. It does not say the defects are harmless: dnaG''s own consequence
    was a lineage arrest under subunit gating, not an abundance error, and this study measured the
    default configuration at one condition. A gene can also reach the right abundance through compensating
    errors. The claim is bounded to steady-state abundance in glucose minimal.'
report:
  verdict: passed
  basis: '4 of 6 axes pass, including all three substantive cohort axes and the positive control.
    The two failures are both gate/scope axes failing by a hair — coverage 0.4955 on the baseline
    reference population, and the noise floor at 0.5296 dex — and both are recorded with their consequences
    rather than waived. The central result is a null: neither defect cohort is distinguishable from
    baseline, while the hand-tuned control is, so the pipeline can detect an accuracy difference
    and found none where the defects live.'
