runs:
- name: tu-expression-identifiability__static
  status: complete
  canonical: true
  started_at: '2026-09-05T17:30:00Z'
  started_at_iso: '2026-09-05T17:30:00Z'
  note: 'Axes 1-4 on the SHIPPED fixture models/parca/parca_state.pkl.gz — exact linear algebra,
    no simulation, deterministic. analyses/identifiability.py takes the state path as argv so any
    arm runs through identical code. Axes 5-6 (phenotype and growth) remain PENDING: they need the
    min-norm tie-break wired into ParCa (req-1) and two simulated arms.

    A second static comparison (vertex vs min-norm ParCa builds) was run afterwards and is recorded
    on the blocked axes: it FAILED the positive control and revealed the deg_rate spread.'
  outcomes:
    underdetermined-tu-count:
      result: PASS
      measured_value: 307
      detail: '76 rank-deficient blocks covering 307 of 3277 TUs (9.4%), total nullity 95 — 95 free
        parameters the cistron data never constrains. req-4: ZERO blocks sit within 10x of the SVD
        tolerance, so the floating-point rank concern does not bite; the 0/1 mapping matrix gives
        clean rank determination.'
    cistron-fit-is-indifferent-to-the-split:
      result: PASS
      measured_value: 7.725e-19
      detail: Normalised cistron residual 6.052258e-05 for both the NNLS vertex and the minimum-norm
        optimum; change 7.7e-19, eleven orders under the 1e-9 bound. The alternatives are genuinely
        equally optimal, so every other axis is interpretable. This was the gate on the whole study.
    vertex-zeros-admit-equal-cost-alternatives:
      result: PASS
      measured_value: 0.8571
      detail: '90 of 105 vertex zeros are liftable at equal cost — an EXACT result from LP feasibility
        over the whole optimal face, not a witness test.

        METHOD NOTE, because the first attempt was wrong and the difference decided the verdict:
        using the minimum-norm point as a witness gave 0.3238 and a FAIL. That only asks whether
        one particular alternative lifts the zero, and undercounts by construction. The LP asks whether
        ANY direction on the face does: find d with sub@d = 0, d_j >= 1, and d_i >= 0 for every other
        currently-zero coordinate. 0.8571 is the answer to the question the axis actually posed.

        H4 (the zeros are forced by nonnegativity) is REFUTED: 86% of them encode a solver choice,
        not a data-driven prediction of silence. The model''s hard zeros carry no evidential weight,
        which is the weaker and correct claim — it does not follow that those transcripts are made.'
    alternative-optimum-moves-many-tus:
      result: FAIL
      measured_value: 0.1824
      detail: '56 of 307 underdetermined TUs move more than 2x between the NNLS vertex and the minimum-norm
        optimum. Below the 0.3 floor. Recorded as pre-registered.

        The failure is about the PROBE, not the phenomenon, and the study said so before running:
        minimum-norm is by construction the optimum closest to the origin, so it is the most conservative
        possible alternative. It answers ''does this one alternative differ'' when the axis meant
        to ask ''how much is unconstrained''.

        Measured properly, per TU, as the width of the optimal face (max and min of x_j over {x >=
        0 : sub x = sub x*}, two LPs each): 198 of 307 TUs — 64.5% — CAN vary by more than 2x with
        zero change to the cistron fit. Median face width is 14.2% of the block''s total expression,
        and 48 TUs (15.6%) have a width exceeding half their block''s total. Pinned separately as
        optimal-face-width-pin; not substituted for this verdict, since the threshold was chosen
        after seeing the data.'
