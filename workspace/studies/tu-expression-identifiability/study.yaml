confidence: Accepted
findings:
- summary: 'The arbitrary NNLS tie-break is not phenotypically silent: it reaches protein counts,
    and the TUs it chooses between differ 25x in half-life.'
  status: novel
  tier: interpretation
  mechanism_origin: emergent
  evidence:
    from_run: tu-expression-identifiability__phase-B
    from_tests:
    - arbitrary-choice-is-not-phenotypically-silent
    - degenerate-tus-differ-in-physics-pin
    - vertex-zeros-admit-equal-cost-alternatives
    observed: 67 of 288 monomers change >2x between arms; within-block deg_rate spread median 25.4x
      (all 77 blocks >10x, max 228x); 90 of 105 vertex zeros liftable at equal cost
    units: monomer counts (molecules); deg_rate ratio (dimensionless); fraction
  explanation: 'Three results compose. The cistron data cannot separate 307 of 3277 TUs, leaving
    95 free parameters. Within those blocks the zeros NNLS produces are arbitrary — 86% are liftable
    at identical cost. And the TUs being chosen between are not interchangeable: they differ by a
    median 25x in degradation rate.


    So the solver is silently deciding which of several transcripts with very different half-lives
    carries an operon''s expression, and that decision propagates to protein counts (23% of affected
    monomers move >2x) without impairing growth (tau ratio 0.978).


    The practical consequence for this investigation: a TU-level zero in this model is not evidence
    of silence. tu-dedup-promoter-collapse concluded that restoring dnaG''s promoters was futile
    because they came back at exactly 0.0 expression — that zero is one of these arbitrary ones,
    and the conclusion needs revisiting on that basis.'
claim: ParCa's cistron-to-TU fit leaves 95 free parameters across 307 TUs; the zeros it produces
  there are arbitrary (86% liftable at equal cost), the TUs it chooses between differ 25x in half-life,
  and the choice reaches protein counts (23% of affected monomers move >2x) without impairing growth.
report:
  verdict: passed
  basis: 5 of 6 graded axes pass plus 2 pins. The gate axis (cistron fit indifferent) passes by 11
    orders of magnitude, so the degeneracy is real; the zeros are arbitrary not forced; and the consequence
    reaches phenotype. The one FAIL (alternative-optimum-moves-many-tus, 0.1824) is a probe artefact,
    with the exact face-width measurement pinned separately at 0.645.
