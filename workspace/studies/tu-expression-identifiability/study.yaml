      measured_value: 0.9783
      detail: 'Median generation time over generations 1-3: vertex 46.0 min, minimum-norm 45.0 min,
        ratio 0.9783 in a band of [0.67, 1.5]. Redistributing expression within the optimal face
        does not impair growth, so the protein-count differences above are not a by-product of a
        damaged cell.

        Divided-generation counts vertex [4, 8, 3] against min-norm [5, 5, 3] — no separation, and
