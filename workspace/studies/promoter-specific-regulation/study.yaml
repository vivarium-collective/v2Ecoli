        \ idx_rprotein peer median:\n  promoter-specific   8.8e-05 / 1.1e-04 / 1.3e-04  -> deficits\
        \ 7.2x, 6.9x, 6.6x, median 6.93x\n  attribution-control 3.9e-08 / 1.4e-05 / 1.2e-11  -> deficits\
        \ 19471x, 50x, 5.7e7x, median 19471x\nThe corrected arm raises dnaG transcription by three\
        \ to four orders of magnitude and is tight across seeds; the control is near-silent in two\
        \ seeds of three.\nIt also slightly BEATS the ceiling this axis was scoped against. dnag-locus-targeted-fix\
        \ measured LexA's entire contribution at 0.455 of the log deficit, which implies a residual\
        \ of 8.19x; the measured residual is 6.93x. So promoter-specific attribution recovers marginally\
        \ more than deleting the LexA edge outright, plausibly because it also corrects other misattributed\
        \ edges at this locus or among the peer set. That was not predicted.\nANCHOR SENSITIVITY,\
        \ recorded as a secondary observation and NOT substituted for the verdict: the fraction-closed\
        \ formula is anchored at the 47.4x deficit pc00010-repression-arithmetic measured in a different\
        \ setup. This experiment's own control sits at 19471x, and anchored to that the fraction\
        \ closed is 0.8040. The pre-registered 0.4983 stands as the graded value; the anchor mismatch\
        \ is a design flaw in the axis, to be fixed by pre-registering an anchor measured from the\
        \ study's own control rather than an inherited constant."
findings:
- summary: 'The rule gets dnaG right and the network wrong: it removes the LexA/TU00352 edge but
    strips 89.5% of adjudicated edges.'
  status: contradicts
  evidence:
    from_test: most-edges-are-unchanged
    observed: 0.1049
    units: fraction retained
    divergence_factor: 0.83861538
  explanation: Applied uniformly, the rule reproduces the LexA judgement the EcoCyc coordinates imply
    -- TU00352 loses its edge, as predicted before running. But it also removes 89.5% of every other
    adjudicated edge, which makes it a different model rather than a correction and voids any rescue
    Phase B could have shown. The disruption control was carried over from ppgpp-off-rescue precisely
    to catch this, and it did.
  expected:
    range:
    - 0.65
    - 1.0
  provenance:
    run_ids:
    - promoter-specific-regulation__phase-A
- summary: 'The failure is NOT the tolerance. Distances are bimodal: a tenth of edges match a site
    exactly, the rest have no nearby site at all.'
  status: novel
  evidence:
    from_test: most-edges-are-unchanged
    observed: 0.177
    units: retention at a 500 bp tolerance
    divergence_factor: 0.83861538
  explanation: p5 and p10 of |implied TSS - TU start| are 0.5 bp, while p25 is 1568 bp, p50 14376
    bp and p75 103123 bp. Loosening the tolerance a hundredfold moves retention only 0.1049 -> 0.1770,
    so no window rescues it. A smooth distribution would indicate a calibration problem; a sharp
    mode at 0.5 bp plus a long tail indicates the export covers SOME promoters exactly and misses
    others entirely.
  expected:
    range:
    - 0.65
    - 1.0
  provenance:
    run_ids:
    - promoter-specific-regulation__phase-A
- summary: Two readings remain open and this data cannot separate them.
  status: novel
  evidence:
    from_run: promoter-specific-regulation__phase-A
  explanation: 'Either (a) the model''s TF-TU assignments are largely unsupported by binding-site
    evidence, or (b) the export is an incomplete subset and the rule strips real regulation wherever
    a site is missing. The bimodality favours (b), and so does the coverage: only 9 of 23 model TFs
    appear at all, 29.2% of sites name no promoter, and 11.6% name one without an offset. I cannot
    distinguish them from this file, and it would be wrong to present the 89.5% as evidence against
    the model.

    The dnaG case is unaffected either way: LexA''s site IS in the export and matches TU00435 to
    0.5 bp, so the evidence there is positive rather than an absence.'
- summary: 'Promoter-specific attribution rescues the lineage: every corrected seed completes 12
    generations where every control seed arrests, and it does so without perturbing growth.'
  status: novel
  tier: mechanism
  mechanism_origin: engineered
  evidence:
    from_run: promoter-specific-regulation__phase-C
    from_tests:
    - lineage-completes
    - rescue-is-not-a-global-growth-artefact
    observed: divided-generation counts [12, 12, 12] corrected against [4, 8, 3] control; median
      generation time 45.0 min against 46.0 min over generations 1-3, ratio 0.9783
    units: generations (count); minutes (generation time); ratio dimensionless
  explanation: 'All three control seeds arrest with one signature: division stops, growth continues,
    dry mass runs away from a normal ~700 fg to 3000-4500 fg, and the lineage halts. No tracebacks
    -- these are clean division failures, the replication arrest this investigation is named after,
    and they land at generations 4, 9 and 5.


    The corrected arm shows none of it. Twelve generations, every one dividing, masses in the normal
    range throughout.


    The growth control is what makes this attributable. Over generations 1-3, before any control
    seed arrests, the two arms are indistinguishable at 45.0 against 46.0 min. So the correction
    is not buying survival by slowing the cell down or perturbing the network globally; the arms
    diverge only at the point where the control fails.


    Mechanistically this reproduces dnag-locus-targeted-fix''s 12-generation rescue, but as a GENERAL
    rule derived from EcoCyc rather than a hand-placed deletion at one locus. That is the same result
    on a far better footing: the intervention is ''attribute regulation where the operator is'',
    applied uniformly to 474 edges, not ''remove this one edge because we know it is wrong''.'
- summary: dnaG transcription rises three to four orders of magnitude and slightly EXCEEDS the ceiling
    the LexA-deletion study measured, which was not predicted.
  status: novel
  tier: observation
  evidence:
    from_run: promoter-specific-regulation__phase-C
    from_tests:
    - dnag-transcription-recovers
    observed: generation-3 dnaG synthesis probability 8.8e-05 / 1.1e-04 / 1.3e-04 corrected against
      3.9e-08 / 1.4e-05 / 1.2e-11 control; residual peer deficit 6.93x median corrected against 19471x
      control
    units: synthesis probability (dimensionless); deficit as peer-median over dnaG
  explanation: 'The corrected arm is tight across seeds (deficits 7.2x, 6.9x, 6.6x). The control
    is near-silent in two seeds of three, at 3.9e-08 and 1.2e-11.


    dnag-locus-targeted-fix measured LexA''s entire contribution at 0.455 of the log deficit, which
    implies a residual of 8.19x -- the most any promoter fix could achieve, since the deficit factorises
    as 2.6x basal x 8.2x ppGpp x 6.2x LexA and no promoter fix touches the first two terms. The measured
    residual is 6.93x, slightly BETTER than that ceiling.


    I predicted this arm would match the ceiling and not exceed it. It exceeded it. The likely reason
    is that promoter-specific attribution corrects more than the one LexA edge: other misattributed
    edges at this locus, or among the idx_rprotein peer set the deficit is measured against, also
    move. That was not predicted and is not directly tested here.'
conclusion_verdicts:
- claim: The rule removes the misattributed LexA edge (H1's first step)
  verdict: supported
  basis: 'TU00352''s LexA edge removed by the uniform rule, as predicted before running. Confirmed
    again in the implemented arm: fitted delta -1.000000 -> 0.0.'
- claim: The BLIND rule (delete every unconfirmed edge) is applicable network-wide
  verdict: refuted
  basis: Retention 0.1049 against a required 0.65. Re-measured with correct TF name resolution it
    is 0.2353 at 50 bp and only 0.6409 at 5 kb -- higher, still failing. This verdict stands.
- claim: The disruption is a tolerance artefact
  verdict: refuted
  basis: Bimodal distances; a 100x looser tolerance moves retention only 0.1049 -> 0.1770.
- claim: The 89.5% shows the model's assignments are wrong
  verdict: partly supported
  basis: 'Was undetermined -- ''indistinguishable from an incomplete export''. Now determined against
    EcoCyc''s primary flatfiles: of 1464 declared edges, 44.4% are CONFIRMED, 32.4% are CONTRADICTED
    (recorded at the operon but on a different TU) and 23.3% are UNRECORDED. So roughly a third of
    the model''s assignments are positionally wrong and a quarter are simply unattested -- not the
    near-universal error the 89.5% implied, and not nothing.'
- claim: The CONTRADICTION-GATED rule is applicable network-wide
  verdict: supported
  basis: 474 of 1464 edges changed, unchanged fraction 0.6762 against the 0.65 floor, verified against
    a matched control (both 3279 TUs, flag the only difference). Offline prediction and in-model
    implementation agree to within one edge. NOTE this is a DIFFERENT rule from the one the pre-registered
    axis graded; it is not that axis passing on re-measurement.
- claim: The corrected wiring rescues dnaG
  verdict: undetermined
  basis: 'Not simulated. And bounded a priori: TU00435 carries basal_prob 0.0 from the degenerate
    cistron-to-TU expression fit, so LexA lands on an inert transcript and this is functionally dnag-locus-targeted-fix''s
    edge deletion, ceiling 0.455.'
- claim: The corrected wiring rescues dnaG
  verdict: supported
  basis: Was undetermined pending simulation. 12/12/12 generations corrected against 4/8/3 control,
    with generation time indistinguishable over generations 1-3 (ratio 0.9783), and dnaG transcription
    three to four orders of magnitude higher. The transcription axis nonetheless FAILS as pre-registered
    at 0.4983 against a 0.5 floor -- see the anchor caveat.
- claim: Dropping 474 regulatory edges is safe for the cell
  verdict: supported
  basis: The risk in the committed change. Corrected lineages run 12 generations at normal mass and
    normal doubling time; nothing suggests the removed edges were load-bearing for viability.
discovery_implications:
- 'A targeted correction at the dnaG locus IS supported: LexA''s site is present in the data and
  matches TU00435 to 0.5 bp, so removing its edge from TU00352 rests on positive evidence rather
  than an absence.'
- 'SUPERSEDED 2026-09-05. This read: ''A network-wide promoter-specific fix is NOT supportable from
  this export. It needs the complete regulation table -- regulation.dat from the Pathway Tools distribution
  -- so that a missing site means no site rather than not exported.'' That table is now in hand (references/ecocyc-30.0/,
  gitignored as licensed data). regulation.dat holds 5803 Transcription-Factor-Binding records keyed
  on REGULATOR ids the model already uses, and dnabindsites.dat resolves each site to a TU id the
  model already uses. So the distinction this limitation asked for can now be made per edge: an edge
  is CONTRADICTED when EcoCyc records that TF at that operon but on a different promoter, and UNRECORDED
  when EcoCyc says nothing. Only the contradicted pile justifies changing the model. That measurement
  has not been run yet.'
- 'The bimodal distance distribution is itself a useful diagnostic for any future attribution work:
  exact matches at 0.5 bp show the join is sound where data exists, so the long tail is about coverage
  rather than method.'
- TU00434 sits 22.5 bp from the implied TSS and does NOT match, so even restoring it would not carry
  the LexA edge under this rule -- contradicting what I assumed when scoping tu-dedup-promoter-collapse.
- The join needs no name matching. regulation.dat REGULATOR values are model TF ids (PC00010, CPLX0-7740)
  and dnabindsites.dat COMPONENT-OF values are model TU ids (TU00435), so the three name-resolution
  traps that corrupted the original 9-of-23 coverage figure cannot arise on this path. Any future
  attribution work should read the .dat files, not the text export.
- 'Phase C settles the safety question the static verification could not: dropping 474 regulatory
  edges does not impair viability or growth. What it does not settle is attribution -- which corrected
  edges do the work -- nor the anchor flaw in the transcription axis.'
- The residual 6.93x deficit is now the bound on what any promoter-level fix can achieve, and it
  sits under the 2.6x basal x 8.2x ppGpp terms that no promoter correction touches. The ppGpp term
  is the largest remaining factor and has a scoped study waiting (ppgpp-basal-residual).
- 'Methodological: the fraction-of-log-deficit-closed construction is unsound wherever the control
  collapses toward zero. Sibling axes built on it (notably dnag-locus-targeted-fix''s 0.455 ceiling)
  should have their seed-stability checked before the numbers are quoted.'
baseline:
- name: cistron-content-control
  composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
  params:
    config_overrides: *id005
conclusion_logic:
  if_primary_tests_fail:
    diagnose:
    - question: Why did promoter-specific-regulation's primary criteria fail, and what does that
        leave open?
      seeded_study: dnag-locus-targeted-fix
      note: Seeded from this study's declared successor (parent_studies relation leads-to/refines),
        not invented to clear the flag.
pipeline_gate:
  prerequisites:
  - study: tu-dedup-promoter-collapse
    condition: complete
    relation: leads-to
    note: Takes up the fix that study's Phase A showed restoration alone cannot deliver.
  - study: pc00010-repression-arithmetic
    condition: complete
    relation: calibrates-threshold
    note: Its 47.4x deficit sets the recovery band.
  - study: deltav-conversion-diagnosis
    condition: complete
    relation: evidence
    note: Supplies the constraint mechanism the re-attribution must not disturb.
report:
  verdict: passed
  basis: '5 of 7 axes pass. The rescue is demonstrated and attributable: 12/12/12 generations against
    4/8/3, with generation time indistinguishable before the control arrests. Two axes fail honestly
    -- the blind rule''s disruption control (superseded by the contradiction-gated rule, recorded
    separately) and dnag-transcription-recovers by 0.0017 against an inherited anchor. Neither failure
    undermines the rescue; both are recorded rather than re-badged.'
ecocyc_model_coverage:
  measured: '2026-09-07'
  script: analyses/ecocyc_model_coverage.py
  source: EcoCyc 30.0 PGDB flatfiles (references/ecocyc-30.0/, gitignored as licensed)
  transcription_units:
    ecocyc_transunits_dat: 3772
    model_input_tsv: 3766
    model_rna_data: 3277
    source_tus_present_in_ecocyc: 3766
    ecocyc_tus_absent_from_input: 6
    absent_from_model_total: 760
    explicitly_removed: 64
    not_kept_thereafter: 696
    kept_with_tu_id: 3006
    single_gene_renamed: 271
    dedup_casualties_all_source: 637
    dedup_casualties_excluding_removed: 624
  transcription_factors:
    ecocyc_distinct_regulators: 279
    model_tfs: 23
    model_tfs_found_in_ecocyc: 23
    model_tfs_found_without_aliases: 20
    ecocyc_regulators_represented_fraction: 0.082
    ecocyc_tf_binding_records: 5803
    records_belonging_to_model_tfs: 2120
    records_belonging_fraction: 0.365
    model_declared_edges: 1462
  note: 'Scope facts bounding every claim in this investigation that leans on the EcoCyc join. The
    two databases are lopsided in OPPOSITE directions.

    TUs: the input is essentially complete — all 3766 source TUs exist in EcoCyc 30.0 and only 6
    EcoCyc TUs never reach the input file. The loss is INTERNAL to the model build: 64 removed as
    unsupported types, 696 not kept thereafter, 760 absent in total, which reproduces tu-coverage-loss
    exactly. Of those, the gene-set dedup is the dominant mechanism. The 271 single-gene entries
    carrying gene-RNA ids rather than TU* ids are relabelled, not lost.

    Dedup casualties reconcile at two numbers for one phenomenon: 637 counted over all source TUs
    (what tu-coverage-loss records) and 624 counted after excluding the 64 explicitly removed, because
    13 TUs are in both sets. Neither is wrong; quote the denominator.

    TFs: the model holds 23 of EcoCyc''s 279 regulators — 8.2%, a curated subset by design, being
    the TFs with condition data ParCa can fit. All 23 resolve in EcoCyc, but only 20 without the
    three id aliases; FNR''s model id FNR-4FE-4S-CPLX does not exist in EcoCyc 30.0 at all. Only
    2120 of EcoCyc''s 5803 TF-binding records (36.5%) concern the model''s TFs.

    CONSEQUENCE for the promoter-specific correction: it only ever touches the model''s own 1462
    edges and never adds regulation, so the 91.8% of EcoCyc regulators the model lacks is out of
    scope. It is also why the UNRECORDED bucket (23% of edges) had to be left alone rather than deleted
    — with the model holding a slice of EcoCyc''s TFs, and EcoCyc itself incomplete for any given
    promoter, absence of a record is weak evidence.'
embed_visualizations:
- name: EcoCyc 30.0 vs the model — coverage in both directions
  url: /reports/figures/promoter-specific-regulation/ecocyc_model_coverage.html
  description: 'Side-by-side counts for transcription units and transcription factors, with the input
    -> model loss broken out. The two databases are incomplete in OPPOSITE directions: the model
    holds 3277 of 3766 source TUs (all of which exist in EcoCyc, so the loss is internal to the model
    build) but only 23 of EcoCyc''s 279 regulators. That asymmetry is what makes ''EcoCyc has no
    record here'' weak evidence, and is why the promoter-specific rule deletes only contradicted
    edges.'
  generated_by: scripts/build_ecocyc_coverage_figure.py
  source_data: analyses/ecocyc_model_coverage.py
