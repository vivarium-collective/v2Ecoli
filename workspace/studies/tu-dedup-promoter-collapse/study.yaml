limitations:
- "CORRECTION 2026-09-07 — this study's account of WHY LexA acts on the rpsU-dnaG-rpoD operon is\
  \ wrong, and the wrongness is inherited, not original to it.\nStatements in this file to the effect\
  \ that 'LexA regulates rpoD and dnaG is silenced as a passenger', or that a dnaG-bearing TU acquires\
  \ LexA because it contains rpoD, do not match the model. They came from checking only fold_changes.tsv,\
  \ which carries lexA->rpoD at log2FC -0.65 and no dnaG entry. There is a SECOND source, fold_changes_nca.tsv:\n\
  \    lexA  dnaG  -1.71        lexA  rpsU  -1.89\nand it is the one in force. tf_to_fold_change['PC00010']\
  \ holds EG10239_RNA (dnaG) at 0.30566, which is 2^-1.71 exactly, plus EG10896_RNA (rpsU) — and\
  \ does NOT contain EG10920_RNA (rpoD) at all. target_tf likewise lists PC00010 for dnaG and rpsU,\
  \ not rpoD. LexA is a DIRECT, cistron-level regulator of dnaG in this model. dnaG is not a passenger.\n\
  The real structural defect is different and stronger: regulation is assigned per CISTRON and then\
  \ unioned onto every TU containing that cistron (relation.py::_build_RNA_to_tf_mapping). dnaG's\
  \ LexA edge therefore lands on whatever TU carries dnaG, and after the gene-set dedup there is\
  \ exactly ONE such TU. The model cannot express 'LexA represses dnaG through this promoter but\
  \ not that one' — TU-specific differential regulation is structurally impossible, not merely mis-assigned.\
  \ It also means restoring the deduplicated promoters could not have separated them: all three TUs\
  \ carry an identical cistron set, so cistron-level regulation attaches LexA to all three.\nWHAT\
  \ THIS DOES AND DOES NOT INVALIDATE: measurements of the encoded delta, occupancy, the deficit\
  \ and the lineage outcomes are unaffected — they measured the model as built. What is wrong is\
  \ the causal STORY told about them. Any figure computed against rpoD's -0.65 as dnaG's input baseline\
  \ is wrong and should be recomputed against -1.71; in this investigation that includes the fold-change-to-delta\
  \ distortion, which is 7.08e+06-fold, not 1.48e+07.\nLeft in place rather than rewritten: the original\
  \ text is preserved above so the record shows what was believed when the work was done."
- THE COMPARISON IS ACROSS CACHES. Restoring TUs forces a full ParCa refit, so the restored arm cannot
  share fingerprint ea05ac9b23b1d843 with the control. Every prior study here compared arms within
  one cache; this one cannot, and the control's stall must be re-verified on matched seeds rather
  than assumed.
- Restoring only the 2 dnaG TUs is the clean experiment but is not the fix a modeller would ship;
  the general fix restores all 637 and changes transcriptome-wide allocation, which this study deliberately
  does not test.
- 'The study can show restoration is SUFFICIENT to rescue dnaG without showing the dedup is the only
  defect: the constraint artefact, the cistron-content regulation rule and the 2.13x activator residual
  are all untouched by it.'
- Whether the discarded TUs are biologically real distinct promoters rests on the source data's coordinates
  and evidence codes. The repo carries no TF-binding-site-to-promoter mapping, so this study cannot
  verify that LexA's operator lies upstream of TU00352 and not of TU00434/TU00435 -- which is the
  fact that would make the biology decisive.
- The EcoCyc export gives site positions and the operon each is attributed to, but not per-TU regulation,
  so the rpsUp3-to-TU00435 identification rests on matching the site name's stated offset (4.5 bases
  downstream) against TU00435's start coordinate. The agreement is 0.5 bp, but it is an inference
  from a name string, not a declared mapping.
claim: LexA's operator is at rpsUp3, which the dedup discarded; the model then applied LexA's repression
  to TU00352, a promoter LexA does not regulate. Restoring the discarded promoters does not fix it
  -- the cistron-to-TU expression fit is degenerate for identical cistron sets and leaves the restored
  pair at exactly zero expression, so the repair has to be made in how regulation is assigned, not
  in which TUs exist.
conclusion: '## Claims


  dnaG is silenced through the wrong promoter, and restoring the right one does not repair it.


  Phase A established the misassignment: the only LexA site at this locus is at rpsUp3 (TSS 3210734.5,
  matching TU00435''s start of 3210735), and TU00435 is one of the two TUs the gene-set dedup discards.
  The model kept TU00352, whose TSS is 88 bp upstream of the operator, and `rna_id_to_regulating_tfs`
  handed it LexA anyway because it contains dnaG, itself a direct LexA target (corrected 2026-09-07:
  dnaG is a DIRECT LexA target, fold_changes_nca.tsv log2FC -1.71).


  Phase B tested the obvious repair -- restore the discarded promoters and refit -- and it fails
  on both axes. Zero of the three dnaG-bearing TUs escape the probability-validity boundary (band
  [2, 3]), and LexA does not move: the locus''s single fitted edge stays on TU00352 at -0.9999999684857455,
  essentially unchanged from -0.999999956832897 in the unmodified cache (band [0.99, 1.0], measured
  0.0).


  The reason is not the one the study pre-registered as H2. H2 predicted the restored TUs would be
  pinned because they share a gene set and so nearly share an alpha and a LexA delta. They are not
  pinned that way -- they receive no alpha at all. The three TUs map to an identical cistron set
  (EG10239_RNA, EG10896_RNA, EG10920_RNA), and cistron-level abundance cannot distinguish three columns
  that contribute to it identically. The fit is degenerate, the solver returns a vertex of the solution
  set, and one TU takes everything: 5.430831e-06 to TU00352, exactly 0.0 to both restored TUs. A
  TU with zero expression gets alpha 0, and `calculateRnapRecruitment` then writes 0 for every one
  of its TF deltas. The restored promoters are structurally present and completely inert.


  Regulation itself was wired correctly -- `rna_id_to_regulating_tfs` assigns PC00010 to all three
  TUs. It is the expression allocation, not the regulation assignment, that strands them.


  This also explains why the dedup exists at all. Collapsing identical-gene-set TUs is what keeps
  the fit determinate; relaxing it without a rule for splitting expression between promoters relocates
  the problem rather than solving it.


  ## Evidence


  Graded against `out/cache_tudedup_full` (full-mode ParCa, 178.5 s, then `scripts/build_cache.py`),
  via `analyses/phase_b.py`, which takes the cache directory as `argv[1]` so the same code produced
  every arm.


  | | unmodified `out/cache` | debug refit (discarded) | full refit (graded) |

  |---|---|---|---|

  | TUs | 3277 | 3279 | 3279 |

  | delta_prob edges | 979 | 6 | 978 |

  | TUs carrying a TF | 727 | 6 | 727 |

  | LexA (PC00010) edges | 45 | 0 | 45 |


  A first refit on 2026-09-04 was discarded before grading rather than reported: it ran in ParCa
  fast/debug mode, which prunes `tf_to_active_inactive_conditions` to a single key (`step_02_input_adjustments.py:228`),
  so it carried almost no transcription regulation. Both axes read the fitted TF structure and would
  have been graded against regulation that was globally absent. The control that caught it was running
  the identical extraction against the unmodified cache, where it reproduces TU00352''s known LexA
  delta; the debug cache returned 0.0 for the same read.


  Degeneracy measurement: 1 TU group in the model has an identical cistron set (the 3 dnaG TUs --
  every other such group is still collapsed by the dedup), and 1 of 1 is winner-take-all.


  ## Limitations


  - The narrow relaxation restores 2 of the 637 discarded TUs. Nothing here measures what a global
  restoration would do, and the degeneracy result predicts it would be worse, not better: it would
  create 428 winner-take-all groups instead of one.

  - Phase C (the lineage arm) was not run, so axes 4-6 stay pending. That follows the rule pre-registered
  at design time -- if all three dnaG TUs remain pinned, H2 holds and Phase C is not worth running
  -- and not a resource decision made after seeing the result.

  - The refitted cache is a different fingerprint from the control, so every comparison here is across-cache.
  This was recorded as a design weakness before the refit was run.

  - The winner-take-all result rests on a single group, because the narrow relaxation deliberately
  created only one. It is a mechanism demonstrated once, not a rate measured over many.


  ## Next steps


  Assign regulation by promoter coordinates rather than by cistron content. Phase A already pointed
  here, and Phase B now rules out the alternative: if regulation were assigned by whether a promoter
  contains the binding site, TU00352 would carry no LexA delta at all, dnaG would be unrepressed,
  and no change to the TU set would be needed -- which matters, because changing the TU set is exactly
  what the degeneracy makes unworkable.'
