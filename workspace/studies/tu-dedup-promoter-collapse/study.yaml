planned_runs:
- name: phase-A-static
  status: planned
  n_steps: 0
  details: NO SIMULATION. Confirms the dedup discards distinct promoters (axis 1) and records the
    blast radius. Runs before any rebuild, and can refute the premise cheaply.
- name: phase-B-refit
  status: planned
  n_steps: 0
  details: 'ParCa rebuild with TU00434/TU00435 restored, then axis 2 read statically from the new
    cache. This is the decision point: if all three dnaG TUs are still pinned at the boundary, H2
    holds and Phase C is not worth running.'
- name: phase-C-lineage
  status: planned
  n_steps: 6
  details: 3 seeds x 2 arms x 12 generations, only if Phase B shows an escape. ~30-60 min per run.
    Disk is at 56 GB with out/ holding 51 GB, so distil dnag-promoter-availability's 28 GB first;
    a ParCa rebuild also needs room.
robustness:
  n_replicates: 3
  seeds:
  - 0
  - 1
  - 2
  parameter_sweep: false
  note: 3 independent seeds per arm, enough to separate a 12-generation completion from a 4-5 stall.
    The across-cache comparison is the dominant uncertainty here, not seed variance.
