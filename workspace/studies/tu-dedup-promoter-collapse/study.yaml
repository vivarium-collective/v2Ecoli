findings:
- summary: 'DECISIVE: LexA''s operator is at rpsUp3, the promoter the dedup DISCARDED. The model
    represses a promoter LexA does not regulate.'
  status: novel
  evidence:
    from_run: tu-dedup-promoter-collapse__phase-A
    observed: 3210735
    units: TU00435 start vs implied rpsUp3 TSS 3210734.5
  explanation: 'From EcoCyc''s TF binding-site export (references/all-transcription-factor-binding-sites.txt,
    4356 sites): the only LexA site at this locus is ''LexA DNA-binding-site 4.5 bases downstream
    of rpsUp3'', spanning 3210729-3210749 on the + strand, attributed to the rpsU-dnaG-rpoD operon.
    Its centre at 3210739 minus 4.5 puts rpsUp3''s TSS at 3210734.5 -- TU00435''s start of 3210735,
    to within half a base.

    The model kept TU00352 (start 3210646, 88 bp UPSTREAM of the operator) and discarded both TU00434
    and TU00435. rna_id_to_regulating_tfs then assigned LexA to TU00352 because it contains dnaG,
    a direct LexA target (corrected 2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv
    log2FC -1.71). So dnaG is silenced through rpsUp1, a promoter LexA has no site at, while the
    promoter LexA actually represses was removed from the model.

    Two defects compose exactly: the dedup removed the regulated promoter, and cistron-content regulation
    reassigned its repressor to an unregulated one.'
- summary: Promoter-specific regulation ALONE would free dnaG, because the surviving TU is not a
    LexA target.
  status: novel
  evidence:
    from_run: tu-dedup-promoter-collapse__phase-A
  explanation: 'This reorders the candidate fixes. If regulation were assigned by promoter rather
    than by cistron content, TU00352 -- the only surviving dnaG-bearing TU -- would carry NO LexA
    delta at all, since LexA''s site is at rpsUp3. dnaG would be unrepressed and the constraint-pinned
    delta would never touch it. That is cheaper than restoring TUs and does not require changing
    the TU set.

    It is also slightly WRONG biologically: the correct model has three promoters with LexA repressing
    one of them, so dnaG should lose roughly a third of its supply under SOS, not none. The faithful
    fix is both changes together -- restore the promoters AND assign regulation by promoter. Restoration
    alone would not help, because the cistron-content rule would hand LexA to all three.'
- summary: 'Restoring a deduplicated promoter is inert: the cistron-to-TU expression fit is degenerate
    for TUs with identical cistron sets and gives the restored pair exactly zero expression.'
  status: novel
  tier: mechanism
  mechanism_origin: emergent
  evidence:
    from_run: tu-dedup-promoter-collapse__phase-B
    from_tests:
    - restored-dnag-tus-escape-the-constraint
    - lexa-still-regulates-rpsup3
    observed: basal expression 5.430831e-06 / 0.0 / 0.0 across TU00352 / TU00434 / TU00435; 1 of
      1 identical-cistron-set TU groups is winner-take-all; LexA edge count 45 in both the unmodified
      and the refitted cache, with the locus's single edge still on TU00352
    units: basal expression fraction (dimensionless); TU groups; delta_prob edges
  explanation: 'TU00352, TU00434 and TU00435 map to an identical cistron set -- EG10239_RNA, EG10896_RNA,
    EG10920_RNA -- and after the narrow relaxation they are the ONLY such group left in the model
    (1 group, 3 TUs; every other identical-set group is still collapsed by the dedup). Cistron-level
    abundance cannot distinguish three columns that contribute identically to it, so the fit is degenerate:
    any split of the operon''s expression across the three is equally consistent with the data. The
    solver returns a vertex of that solution set, putting all the mass on one TU. Measured: 1 of
    1 such groups is winner-take-all.


    The consequence is that restoration cannot help on its own. A TU with zero expression gets alpha
    0, and calculateRnapRecruitment then writes 0 for every one of its TF deltas -- so the restored
    promoters are structurally present and completely inert. Regulation was in fact wired correctly:
    rna_id_to_regulating_tfs assigns PC00010 to all three TUs. It is the expression allocation, not
    the regulation assignment, that strands them.


    This also explains why the dedup exists. Collapsing identical-gene-set TUs is what keeps the
    fit determinate; relaxing it without supplying a rule for splitting expression between promoters
    just moves the problem. Any real fix needs either promoter-resolved expression data to break
    the tie, or -- cheaper, and the direction this study''s Phase A finding already pointed at --
    assigning regulation by promoter coordinates rather than by cistron content, which needs no change
    to the TU set at all.'
