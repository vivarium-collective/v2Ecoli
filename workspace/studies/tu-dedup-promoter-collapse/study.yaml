implementation_requirements:
- id: req-1
  status: done
  blocking: true
  summary: Relax the gene-set dedup for the dnaG locus and REBUILD ParCa.
  detail: 'getter_functions.py:220-262 keys on the sorted gene tuple and `continue`s past later TUs.
    The minimal intervention is to key on (gene tuple, left_end_pos, right_end_pos) so distinct promoters
    survive, applied narrowly first -- restoring only TU00434 and TU00435 -- so the arm changes ONE
    thing. This REQUIRES A FULL ParCa REBUILD: the TU set changes, so basal_prob, delta_prob and
    the whole r_vector are refitted. The resulting cache will NOT be fingerprint ea05ac9b23b1d843,
    so the control arm must be the EXISTING cache and every comparison must be stated as across-cache.
    That is a real weakness of this design and is recorded as a limitation rather than glossed.'
- id: req-2
  status: done
  blocking: true
  summary: Decide narrow-vs-global restoration BEFORE running, and record it.
  detail: Restoring all 637 dedup casualties changes the transcriptome-wide basal allocation and
    would make any dnaG result uninterpretable. Restoring only the 2 dnaG TUs is the clean experiment.
    Recording the choice -- NARROW -- before running, so a global restoration cannot be substituted
    later if the narrow one fails to rescue.
- id: req-3
  status: not_started
  blocking: false
  summary: Reuse the deficit and margin measurements verbatim.
  detail: pc00010-repression-arithmetic's peer-deficit method and replisome_arrest's gate-margin
    helper are reused unchanged so the refitted arm is measured exactly as the existing runs were.
- id: req-4
  status: done
  blocking: true
  summary: Re-run the TU-dedup ParCa refit in FULL mode -- the 2026-09-04 refit ran in debug mode
    and carries no transcription regulation.
  detail: 'out/cache_tudedup was built by scripts/parca_run.py in fast/debug mode. step_02_input_adjustments.py:228
    prunes tf_to_active_inactive_conditions to a SINGLE key when debug=True, so the promoter-binding
    fit at step 6 saw one TF. Verified in the cache: 6 nonzero delta_prob entries versus 979 in out/cache,
    6 TUs carrying any TF versus 727, and ZERO LexA (PC00010) edges versus 45. Every surviving edge
    is CPLX-125. TU00352 therefore shows LexA delta 0.0 in the refit where the same extraction reads
    -0.999999956832897 from out/cache, and the two restored TUs (TU00434 idx 2878, TU00435 idx 2879)
    carry basal_prob 0.0 and no TFs at all. Axes 2 and 3 both read the fitted TF structure, so neither
    can be graded from this cache: the numbers it yields (1 of 3 off the boundary, LexA fraction
    0.0) are artefacts of regulation being absent globally, not evidence about the dnaG locus. The
    refit must be redone with debug=False before Phase B resumes -- roughly 4-8 h rather than the
    80 s this one took.'
  unblocks: restored-dnag-tus-escape-the-constraint, lexa-still-regulates-rpsup3, dnag-transcription-recovers,
    lineage-completes-with-restored-tus
  launched: '2026-09-05T10:45:41Z'
  launch_note: v2ecoli-parca --mode full --cpus 8 -o out/parca_tudedup_full --cache-dir out/cache_tudedup_full.
    Same inputs as the debug refit (operons=True, new_genes=off, rnaseq_source=reference, defaults-only
    overrides) with --mode full the only change, and --allow-partial-fit deliberately NOT passed
    so a failed step-9 fit aborts rather than writing a partially-fit state. The debug refit is kept
    at out/cache_tudedup as the contrast arm.
alternative_hypotheses:
- name: H1 promoter collapse is the root cause
  discriminator: lineage-completes-with-restored-tus
  statement: With three transcripts dnaG's supply is the sum, at least one escapes the constraint,
    DnaG accumulates and the lineage completes. Predicts all four primary axes pass.
- name: H2 all three TUs land on the boundary
  discriminator: restored-dnag-tus-escape-the-constraint
  statement: 'The refit pins every dnaG-bearing TU at Z@R ~ 0, because they share a gene set and
    so nearly share an alpha. Restoration then changes nothing and the constraint is the sole cause.
    Plausible: the three TUs are near-identical, and the 10 currently-pinned targets include BOTH
    surviving rpoD-bearing TUs.'
  status: outcome confirmed, mechanism refuted
  resolution: 'Confirmed in outcome: 0 of 3 dnaG-bearing TUs escape the boundary, so restoration
    changes nothing and Phase C is not worth running. Refuted in mechanism, and the difference is
    the study''s real result. H2 said the restored TUs would be pinned because they share a gene
    set and so nearly share an alpha and a LexA delta. They are not pinned that way -- they receive
    no alpha at all. The basal fit allocates 5.430831e-06 to TU00352 and exactly 0.0 to both restored
    TUs, so every fitted delta on them is zero too. They sit at the boundary by holding no probability
    mass, not by having it cancelled.'
- name: H3 transcription recovers but the lineage still stalls
  discriminator: lineage-completes-with-restored-tus
  statement: dnaG's deficit falls but something else limits the lineage -- the activator residual,
    or another subunit. Predicts the deficit axis passes while the lineage axis fails, which would
    still be a real advance.
- name: H4 the rescue is a global artefact
  discriminator: restoration-is-not-a-global-growth-artefact
  statement: Refitting shifts basal allocation broadly and the lineage survives for reasons unrelated
    to dnaG. This is how ppgpp-off-rescue's apparent rescue was voided.
falsifiability: H2 is a genuine and quite likely outcome -- the three dnaG TUs share a gene set and
  so nearly share an alpha, and both surviving rpoD-bearing TUs are already pinned -- so this study
  can fail on its own central mechanism at the second axis, before any simulation. That is why the
  escape axis is graded separately from the lineage axis instead of being folded into it.
assumptions:
- assumption: Restoring TUs is a data-side change with no runtime component.
  basis: The dedup runs in getter_functions during ParCa, so the change is entirely upstream of simulation.
    That is what makes this cheaper than re-solving the convex program's constraint, though it still
    needs a full refit.
  risk: low
- assumption: An across-cache comparison is admissible here.
  basis: 'It has to be: the refit necessarily produces a different cache. Every prior study in this
    investigation compared arms WITHIN one cache, so this is the first that cannot, and the control
    arm''s stall generation must be re-verified on the new cache rather than assumed from the old
    runs.'
  risk: high
