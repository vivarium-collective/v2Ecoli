- name: restored-dnag-tus-escape-the-constraint
  kind: positive
  hypothesis: If all three dnaG TUs are still pinned at Z@R ~ 0, restoration cannot help and H2 holds.
  expected: at least 2 of 3 above Z@R = 1e-9.
  observed: ''
