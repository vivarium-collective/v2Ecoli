      that allocates exactly zero to both restored TUs, making them inert. That both rules out promoter
      restoration as a repair and explains why the dedup exists.
report:
  verdict: failed
  basis: 'Restoration is refuted as a repair: both Phase B acceptance criteria fail, and the measured
    cause -- a degenerate cistron-to-TU expression fit leaving the restored promoters at exactly
    zero expression -- rules out the whole approach rather than this instance of it. Phase C not
    run, per the rule pre-registered at design time.'
discovery_implications:
  resolved_uncertainties:
  - 'Whether restoring deduplicated promoters can relieve dnaG''s repression: it cannot. The restored
    TUs receive exactly zero fitted expression and are inert.'
  - 'Why the gene-set dedup exists: it keeps the cistron-to-TU expression fit determinate. TUs with
    identical cistron sets are indistinguishable to cistron-level abundance data.'
  remaining_uncertainties:
  - Whether assigning regulation by promoter coordinates gives dnaG a working transcript -- untested
    here, and now the only candidate repair left standing.
  - Whether the winner-take-all allocation generalises beyond the single group this study created;
    the narrow relaxation deliberately produced only one.
  - 'What the residual deficit is once LexA is off dnaG: dnag-locus-targeted-fix measured LexA''s
    whole contribution at 0.455 of the log-space deficit, leaving the 2.6x basal and 8.2x ppGpp terms
    untouched by any promoter fix.'
  followup_study_proposals:
  - id: ppgpp-basal-residual
    title: Attack the 8.2x ppGpp term -- the largest remaining factor in dnaGs deficit
    motivation: 'Correction to this proposal as first written, which named promoter-specific-regulation
      as the candidate repair. That study already exists and is CLOSED: the promoter-coordinate rule
      does remove the misattributed LexA edge (misattributed-lexa-edges-are-removed = 1.0) but strips
      89.5% of the adjudicated network, so it cannot be applied generally from this export. dnag-locus-targeted-fix
      then applied it narrowly as a single-edge deletion and measured the ceiling: the lineage completes
      12 generations with no global growth artefact, but dnaG recovers only 0.455 of the deficit.


      So all three routes to the 6.2x LexA term are now closed -- global rule refuted, narrow deletion
      at its ceiling, TU restoration refuted here. The deficit factorises 2.6x basal x 8.2x ppGpp
      x 6.2x LexA, and ppGpp is the largest term still untouched. ppgpp-basal-residual is already
      scoped with four authored tests and zero runs.'
    mechanism: Removing the LexA edge leaves a flat ~8x shortfall across all twelve generations,
      and the runtime is not responsible -- delivered probability matches target to three decimal
      places. That points at the ppGpp-adjusted basal vector as the carrier. Predicts the residual
      is in the target rather than the runtime, and that disabling ppGpp removes it.
