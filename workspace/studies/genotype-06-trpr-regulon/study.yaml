schema_version: 4
name: genotype-06-trpr-regulon
investigation: genotype-perturbation-response
title: How does v2ecoli realize a transcription-factor knockout?
created: '2026-08-20'
status: in-progress
phase: Design
study_type: exploratory
design_status: complete
implementation_status: partial
expert_review_status: not_requested
question: 'When the perturbed gene is a transcriptional regulator rather than an enzyme, how does v2ecoli
  realize the knockout, and how much of that regulator''s documented biology can the model represent at
  all? Concretely, for trpR: by which routes can the genotype be built, what does each route let us observe,
  and what does the model''s own regulatory parameterization put out of reach of every route?'
claim: 'A regulator knockout is realizable by three distinct routes in v2ecoli, and the route determines
  what can be observed. For trpR the model''s regulon is structurally complete - 12 edges spanning all
  5 of EcoCyc''s operator regions - so the divergence from biology is one of parameterization, not coverage:
  the TrpR repression terms are 2.62-4.03x where the literature reports 70-300x, and on every gene where
  both mechanisms act the model''s attenuation term exceeds its repression term, inverting the documented
  ordering. The model''s mechanistic reach over transcriptional regulation overall is ~51% of mRNA cistrons.
  What the run adds is that those table terms do not set the dynamic response: because a bound promoter''s
  transcription probability is fitted to exactly zero, the knockout''s measured effect is governed by
  TrpR occupancy in the condition rather than by the size of any fold-change term, which is why one knockout
  yields four answers spanning seven orders of magnitude.'
experiment: 'Read the model''s shipped regulatory tables directly (fold_changes.tsv filtered by fold_changes_removed.tsv,
  transcriptional_attenuation.tsv, genes.tsv, rnas.tsv) to fix what the model can represent before anything
  is run, then realize the ΔtrpR genotype by each available route and record what each route does. Route
  A builds the deletion at the ParCa level; route B zeroes the TrpR monomer''s translation efficiency
  on a post-ParCa run. A third route - imposing a measured differential-expression table at ParCa time
  via the rnaseq_experimental key - exists in the model and is named here for completeness, but is not
  exercised by this study: it requires a measured DE table, which makes it an input question rather than
  a property of the genotype machinery.'
result: 'The static pass is complete (F-01 to F-04, measured from the model''s own tables and holding
  independently of any simulation). ROUTE A HAS RUN: both arms fail ParCa at step 9 on the TRP[c] amino-acid
  homeostasis check, with every structural build-integrity axis passing first (F-05, F-06). ROUTE B HAS
  RUN IN FOUR CONDITIONS, recorded as four runs with their own outcomes (F-09..F-12). The same knockout
  measures 1.06x in stock basal, 2.26x with tryptophan removed but TrpR''s own cell spec held fixed, 6.29x
  in AA-replete media, and 6.1e7 at saturating tryptophan. Those are not four strengths of one effect:
  every knockout arm sits at the same derepressed level, and what varies is how much of the time the WILD
  TYPE is repressed. The knockout changes the operon''s OCCUPANCY, not its level. F-13 adds that a chromosome-level
  deletion leaves 11 of trpR''s 12 fold-change rows intact, so a genome edit alone does not remove the
  fitted repression. The route comparison itself - what each build route can and cannot represent - is
  the deliverable, not a preliminary to one.'
canonical_runs:
- name: route-a-parca-builds
  entry: sims/run_route_a.py
  description: Regenerates the trpR and trpR+tnaA knockout bundles from ecoli-sources, grades build integrity
    structurally, then runs ParCa on each. Records the failure as the result; writes data/route_a_summary.json.
    Does not read any scratch directory, so it reproduces on a fresh checkout.
- name: static-regulatory-evidence
  entry: sims/extract_evidence.py
  description: Re-derives every number the study cites from v2ecoli's raw_data flat files; writes data/evidence.json.
    No simulation.
- name: route-b-multigen-arms
  entry: sims/run_route_b.py
  description: 'One arm per invocation (--arm), three generations each, writing data/route_b_<arm>.json;
    sims/analyze_route_b.py then reduces the traces to data/route_b_summary.json without re-running anything.
    WARNING: the basal_with_trp arms need caches built by sims/build_ko_cache.py from a FULL-mode ParCa
    state at ecoli-sources 840bc973 -- the committed 51-condition fixture does not carry that condition.'
- name: regulon-survival-under-deletion
  entry: sims/measure_regulon_survival.py
  description: Runs the real fold-change loader against wild-type raw_data and a generated trpR knockout
    bundle; reports how many of trpR's regulon rows survive, with a positive control. Writes data/regulon_survival.json.
    No ParCa fit, no simulation.
runtime:
  default_emitter: sqlite
assumptions:
- text: TrpR represses the trp operon 70-300 fold in vivo; transcriptional attenuation contributes a further
    8-10 fold, and repression is the dominant of the two.
  cites: []
  verified_in_v2ecoli: false
- text: EcoCyc documents five TrpR operator-bearing regions - trpLEDCBA, aroH, aroL, mtr, and trpR's own
    autoregulation.
  cites: []
  verified_in_v2ecoli: false
- text: tnaA (tryptophanase) is the main catabolic sink for tryptophan, and tnaB - a second Trp permease
    - shares its operon. A trpR-only arm is therefore not like-for-like against a ΔtrpR ΔtnaA reference
    strain.
  cites: []
  verified_in_v2ecoli: false
inputs:
- artifact: build-integrity-baseline
  from: genotype-00-build-integrity
- artifact: ko-mechanics-control-panel
  from: genotype-01-control-panel
pipeline_gate:
  enables: []
  proceed_condition: The static regulatory-reach pass (F-01..F-04) is complete and re-derivable. The run
    arms may proceed independently; nothing downstream waits on them.
conditions:
  baseline:
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params: {}
  variants:
  - name: route-B-trpR-ko
    role: perturbation
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      knockouts:
      - EG11029
    perturbation: 'Route B: translation-level knockout of trpR (EG11029). The TrpR monomer''s translation
      efficiency is zeroed, so the repressor protein is not made while transcription of the gene continues.
      The protein is what represses, which makes this the mechanistically faithful lever for a repressor.'
    expected_contrast: Derepression of the trp operon bounded by the model's own TrpR term (2.62-4.03x
      static; 6.29x measured at TU level, F-07/F-08), not by the 70-300x the literature reports.
  - name: route-B-trpR-tnaA-dko
    role: perturbation
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      knockouts:
      - EG11029
      - EG11005
    perturbation: 'Route B, double: trpR (EG11029) + tnaA (EG11005). Removes the repressor and the main
      catabolic sink together, which is the genotype a dtrpR dtnaA reference strain carries.'
    expected_contrast: Same derepression ceiling as the single knockout; tnaA loss additionally removes
      tryptophan degradation, so intracellular Trp should not be drawn down as fast.
  - name: route-B-trpR-ko-attenuation-on
    role: control
    composite: v2ecoli.composites.ecoli_baseline.ecoli_baseline
    params:
      knockouts:
      - EG11029
      trna_attenuation: true
    perturbation: The same trpR knockout with tRNA transcriptional attenuation switched ON. Attenuation
      is OFF in a default run (F-04), so this arm is what isolates the second control mechanism rather
      than assuming it is active.
    expected_contrast: If the attenuation terms behave as parameterized, this arm should show a LARGER
      trp response than the repressor knockout alone - the inverted ordering F-03 measures in the tables,
      made visible in a run.
  - name: route-A-trpR-parca-ko
    role: perturbation
    composite: v2ecoli.composites.parca.parca
    params:
      debug: true
      cpus: 8
    perturbation: 'Route A: chromosomal deletion of trpR before reconstruction, via an ecoli-sources variant
      bundle. A different composite from the other arms by nature - route A is a BUILD, not a run. Recorded
      because its failure is a result, not an obstacle to route around: see F-05.'
    expected_contrast: Expected NOT to complete - CONFIRMED 2026-08-20 (F-05). Fails at ParCa step 9 on
      the TRP[c] amino-acid homeostasis check, both arms, with all six structural build-integrity axes
      passing first (F-06).
  model_settings:
  - name: trna_attenuation
    default: false
    current: false
    range:
    - false
    - true
    units: ''
    cites: []
behavior_tests:
- name: trp-operon-derepresses-above-ten-fold
  classification: primary
  question: B1. Does removing TrpR derepress the trp operon by more than ten fold?
  measure:
    kind: derived
    path: listeners.rna_synth_prob.actual_rna_synth_prob
    window: second_half
    statistic: time_mean_ratio_ko_over_wt
  pass_if:
    op: at_least
    value: 10.0
    provenance:
      kind: literature
      note: In vivo TrpR repression of the trp operon is reported at 70-300 fold; 10x is a deliberately
        permissive floor so the band tests the model's order of magnitude rather than a precise value.
  status: pending
  cites: []
- name: aroH-responds-to-trpR-loss
  classification: supporting
  question: B3. Does aroH respond to TrpR loss at roughly six fold?
  measure:
    kind: derived
    path: listeners.rna_synth_prob.actual_rna_synth_prob
    window: second_half
    statistic: time_mean_ratio_ko_over_wt
  pass_if:
    op: in_range
    low: 3.0
    high: 12.0
    provenance:
      kind: literature
      note: EcoCyc reports aroH as a TrpR target responding ~6x; the band brackets that value within a
        factor of two.
  status: pending
  cites: []
- name: mtr-responds-to-trpR-loss
  classification: primary
  question: B2. Does mtr - a documented TrpR regulon member - respond at all?
  measure:
    kind: derived
    path: listeners.rna_synth_prob.actual_rna_synth_prob
    window: second_half
    statistic: time_mean_ratio_ko_over_wt
  pass_if:
    op: at_least
    value: 1.5
    provenance:
      kind: literature
      note: mtr is an EcoCyc TrpR regulon member. The band asks only for a detectable response, not a
        magnitude. ⛔ This band was originally predicted to FAIL as unreachable, on the retracted claim
        that the model carried no TrpR->mtr edge. It does carry one (3.89x), so the band is gradeable
        and is now expected to PASS.
  status: pending
  cites: []
- name: aroL-does-not-respond
  classification: supporting
  question: B4. Does aroL correctly show little or no response?
  measure:
    kind: derived
    path: listeners.rna_synth_prob.actual_rna_synth_prob
    window: second_half
    statistic: time_mean_ratio_ko_over_wt
  pass_if:
    op: at_most
    value: 1.5
    provenance:
      kind: literature
      note: 'aroL carries a TrpR operator and is reported to respond weakly. ⛔ CORRECTED: the model DOES
        carry an aroL edge (2.62x) in the merged fold_changes + fold_changes_nca table, so aroL is expected
        to respond above the 1.5x threshold and this band is now predicted to FAIL - the model over-represses
        a weakly-coupled gene. The original note claimed no aroL edge (from fold_changes.tsv alone) and
        predicted a pass for the wrong reason.'
  status: pending
  cites: []
- name: repression-exceeds-attenuation
  classification: primary
  question: B5. Is TrpR repression the dominant control on the trp operon, exceeding attenuation?
  measure:
    kind: derived
    path: listeners.rna_synth_prob.actual_rna_synth_prob
    window: second_half
    statistic: time_mean_ratio_ko_over_wt
  pass_if:
    op: at_least
    value: 1.0
    provenance:
      kind: literature
      note: Literature has TrpR repression (70-300x) dominating attenuation (8-10x). Graded as the ratio
        of the repressor-knockout response to the attenuation-arm response; >1 means repression dominates.
        F-03 measures the model's TABLES as inverted on 5 of 5 shared targets, so this band is predicted
        to fail.
  status: pending
  cites: []
- name: deleted-regulator-regulon-is-not-pruned
  classification: primary
  question: B6. When trpR is deleted from the chromosome, how many of its fold-change rows does the reconstruction
    still carry? A regulon that survives its regulator means ParCa keeps fitting repression attributable
    to a gene no longer in the genome.
  measure:
    kind: derived
    path: tf_to_fold_change[CPLX-125]
    window: not_applicable
    statistic: surviving_row_count_after_chromosomal_deletion
  pass_if:
    op: at_most
    value: 0
    provenance:
      kind: theory
      note: Passing means the deletion prunes the regulon. This is the expectation the study tests, NOT
        a literature value and not a target to tune toward -- the measured answer is 11 of 12, so the
        test is expected to fail and the failure is the result. Recorded as a criterion so the behaviour
        is graded rather than asserted in prose.
  status: pending
  cites: []
readouts:
- name: trp-operon-synthesis-probability
  store_path: listeners.rna_synth_prob.actual_rna_synth_prob
  description: Per-transcription-unit actual synthesis probability. This is the quantity the model's TrpR
    fold-change terms actually modify - repression enters as a delta_prob on synthesis probability - so
    it is the most direct readout of the mechanism under study, and it is verified emittable by the baseline
    composite.
  units: probability
  status: available
- name: tf-binding-per-tu
  store_path: listeners.rna_synth_prob.n_bound_TF_per_TU
  description: Bound transcription factors per transcription unit. Distinguishes "the repressor is gone"
    from "the repressor is present but its term is small", which B5 needs.
  units: count
  status: available
- name: trp-operon-cistron-counts
  store_path: listeners.rna_counts.mRNA_cistron_counts
  description: 'Per-cistron mRNA counts for the trp operon and the wider regulon candidates. ASPIRATIONAL:
    the baseline composite as configured emits five listener groups (atp, mass, ribosome_data, rna_synth_prob,
    rnap_data) and none carries per-cistron mRNA counts, so this path is NOT currently emittable. Kept
    because it is the readout the question naturally wants; reaching it requires enabling the RNA-counts
    listener on the composite.'
  units: counts
  status: aspirational
- name: total-transcription-initiation
  store_path: listeners.rna_synth_prob.total_rna_init
  description: 'Total RNAP initiations per tick - the denominator behind every actual_rna_synth_prob share.
    Carried as a DIAGNOSTIC, not a correction: a same-gene between-arm ratio cancels any global normalization,
    so this only needs checking if the arms differ in total transcription, which matched conditions make
    unlikely.'
  units: count
  status: available
- name: trp-intracellular-pool
  store_path: bulk
  description: Intracellular TRP[c] pool. Route A's build failure is an assertion on this quantity's ParCa-time
    counterpart, so the run-time pool is the observable that connects the two routes.
  units: counts
  status: derived-needed
biological_summary: 'TrpR is the tryptophan repressor. Bound to L-tryptophan it forms a holorepressor
  that

  occupies operators in front of the tryptophan biosynthetic operon and several other loci,

  shutting transcription down when tryptophan is plentiful. Removing trpR therefore

  derepresses tryptophan biosynthesis - it is one of the cleanest and best characterised

  regulatory knockouts in E. coli, which is why it is a good public exemplar even when the

  motivation for studying it comes from elsewhere.


  Two mechanisms control the trp operon, and their relative strength is the part that matters

  here. TrpR repression is the coarse, dominant switch, reported at 70-300 fold. Transcriptional

  attenuation - a translation-coupled decision made at a leader peptide - modulates on top of

  it at roughly 8-10 fold. Repression dominates; attenuation trims.


  v2ecoli represents transcriptional regulation as a table of fold-change terms keyed by

  transcription-factor common name. That representation is what bounds this study: a

  regulator can only act on genes it has a row for. For trpR the model carries twelve rows,

  covering all five EcoCyc operator regions - the trp operon (trpLEDCBA), aroH, aroL, mtr,

  and trpR''s own autoregulation - plus aroM and yaiA. Every documented region is represented;

  each is repressed by trpR in the merged fold_changes + fold_changes_nca table the model

  actually loads.


  So a trpR knockout in v2ecoli is not a perturbation of a smaller object - the regulon is

  structurally complete against EcoCyc. What bounds it is parameterization, not coverage:

  whichever route builds the genotype, the response is confined to the magnitudes the model''s

  twelve edges carry, and those magnitudes (2.62-4.03x) are an order of magnitude below the

  literature''s 70-300x. That is a statement about the model''s regulatory parameterization,

  and it is visible without running anything.

  '
literature_anchors:
- expectation: TrpR represses the trp operon 70-300 fold in vivo.
  model_observable: merged fold_changes + fold_changes_nca trpR rows, 2.62-4.03x
  source: Yanofsky-lineage trp regulation literature
  status_in_workspace: Verified (static) - measured in F-02
- expectation: Attenuation contributes 8-10 fold, subordinate to repression.
  model_observable: transcriptional_attenuation.tsv tRNA-Trp rows, 5.98-7.36x
  source: Yanofsky-lineage trp regulation literature
  status_in_workspace: Verified (static) - measured in F-03
- expectation: EcoCyc documents five TrpR operator-bearing regions.
  model_observable: all five regions represented (trpLEDCBA, aroH, aroL, mtr, trpR autoregulation)
  source: EcoCyc TrpR regulon
  status_in_workspace: Verified (static) - measured in F-02
robustness:
  n_replicates: 1
  seeds:
  - 0
  parameter_sweep: false
preregistered:
  criteria:
  - B1 trp operon derepresses > 10x
  - B2 mtr responds at all
  - B3 aroH responds ~6x (bracketed 3-12x)
  - B4 aroL does not respond (< 1.5x)
  - B5 repression exceeds attenuation
  thresholds:
    trp-operon-derepresses-above-ten-fold:
      op: at_least
      value: 10.0
    aroH-responds-to-trpR-loss:
      op: in_range
      low: 3.0
      high: 12.0
    mtr-responds-to-trpR-loss:
      op: at_least
      value: 1.5
    aroL-does-not-respond:
      op: at_most
      value: 1.5
    repression-exceeds-attenuation:
      op: at_least
      value: 1.0
  predictions:
  - B1 FAIL - the model's own TrpR term caps static derepression at 2.62-4.03x (the run measures 6.29x
    at TU level, F-07/F-08, still an order of magnitude below the 10x floor).
  - B2 - ⛔ ORIGINAL PREDICTION RETRACTED. Predicted FAIL on the false premise that no TrpR->mtr edge exists;
    the edge exists at 3.89x, so a response is expected. ⚠ This band's prediction was corrected AFTER
    the run, so it is no longer pre-registered and must not be counted as a pre-registered pass.
  - B3 - ⛔ ORIGINAL PREDICTION RETRACTED. Predicted MARGINAL on the false premise that aroH's term is
    2.03x (fold_changes.tsv alone); the merged table has aroH at 3.46x, inside the 3-12x band, so a PASS
    is expected. ⚠ Corrected after the data, so no longer pre-registered and must not be counted as a
    pre-registered pass.
  - B4 - ⛔ ORIGINAL PREDICTION RETRACTED. Predicted PASS ("aroL absent from the regulon"); aroL carries
    a 2.62x trpR edge in the merged table, so it is expected to respond ABOVE the 1.5x threshold and B4
    (aroL <1.5x) is now predicted to FAIL - the model over-represses a weakly-coupled gene. ⚠ Corrected
    after the data, so no longer pre-registered.
  - B5 FAIL - the tables invert the ordering on 5 of 5 shared targets.
  controls:
  - route-B-trpR-ko-attenuation-on
  registered_at: '2026-08-20'
controls:
- name: route-B-trpR-ko-attenuation-on
  kind: positive
  hypothesis: Attenuation is off by default (F-04), so any trp response in the default knockout arm is
    attributable to the TrpR term alone. Turning attenuation on should move the trp operon further, and
    by MORE than the repressor did if the tables' inverted ordering is real in a run.
  expected: A larger trp-operon response than the repressor knockout produces alone.
  observed: ''
  result: PENDING
- name: mtr-as-negative-control
  kind: negative
  hypothesis: ⛔ VOID. This control rested on the retracted claim that mtr carries no edge in the model.
    mtr is repressed by trpR at 3.89x in the merged fold_changes + fold_changes_nca table the model loads,
    so it is an EXPECTED responder (see B2), not a null - it cannot serve as a negative control. Retained
    rather than deleted so the reasoning error stays visible; a genuine no-edge negative control has not
    yet been identified.
  expected: (void - mtr is an expected responder, not a null)
  observed: ''
  result: VOID
alternative_hypotheses:
- claim: The trp response is weak because the knockout did not take effect, not because the model's regulatory
    terms are small.
  discriminated_by: The static measurement. The terms are 2.62-4.03x in the merged table, independently
    of whether any knockout succeeds - so the ceiling is set before the run.
  status: excluded
- claim: Attenuation compensates for the weak repression term, so the total trp control is closer to the
    literature than the repression term alone suggests.
  discriminated_by: F-04 - attenuation is OFF in a default run, so it compensates for nothing unless explicitly
    enabled. The attenuation-on control arm tests this directly.
  status: not-excluded
- claim: The model's TrpR regulation is inert - removing the repressor changes nothing.
  discriminated_by: 'F-07. Measured in BOTH conditions: 6.29x derepression where the model declares TrpR
    active, 1.06x where it declares it inactive. Inert regulation would give ~1.0x in both.'
  status: excluded
falsifiability: 'The central claim - that the model''s parameterization, not its coverage, bounds what
  any build route can show - is overturned if a trpR knockout by any route moves a gene the model carries
  no regulatory edge for, or if the observed trp derepression approaches the literature''s 70-300x rather
  than staying within a small factor of the 2.62-4.03x the merged table permits (the run''s 6.29x is the
  expected TU-level counterpart of those per-target terms - see F-08 - not a breach). The originally-designated
  no-edge test case, mtr, is void: the model carries a 3.89x TrpR->mtr edge, so mtr is an expected responder,
  not a null.'
limitations:
- 'The static findings (F-01..F-04) measure the model''s PARAMETER TABLES. They constrain what a run can
  show but are not themselves run results. F-05..F-08 are the run results: route A (build) and route B
  (multigen) have both executed.'
- Route C - imposing a measured differential-expression table at ParCa time via the rnaseq_experimental
  key - is named but not exercised. It depends on which DE table is supplied, which makes it an input
  question rather than a property of the machinery.
- F-07's positive arm is measured in with_aa, which is a blunt instrument for the question. Relative to
  basal it supplies all 20 amino acids, shortens the doubling time from 44.0 to 25.0 min, and declares
  five TFs active and three inactive rather than TrpR alone (condition_defs.tsv). The 6.29x is therefore
  attributable to "a condition where the model declares TrpR active", not to tryptophan specifically.
  The basal_with_trp condition (ecoli-sources#15, merged 2026-08-23) isolates tryptophan at basal's own
  44.0 min and is the intended clean re-run; it is not yet reachable from v2ecoli, which still pins ecoli-sources
  to a rev predating it.
- EcoCyc region membership is entered by hand in the evidence extractor. It is literature, not model data,
  and is the one input a reader must take on trust rather than re-derive.
findings:
- id: F-01
  tier: observation
  statement: v2ecoli's transcriptional-regulatory network covers 2198 of 4347 mRNA cistrons - 50.6%. It
    is 4209 edges from 150 transcription factors onto 2231 distinct target names. ⛔ An earlier version
    of this finding reported 663 of 4347 (15.2%) from 47 TFs; that was measured from fold_changes.tsv
    ALONE and was wrong - see the correction note below.
  claim_scope: mechanism
  lifecycle_state: observation
  generality:
    axes_tested:
    - parameter_regime
    level: mechanism
  next_action: The ceiling this investigation operates under is roughly half the genome, not ~15%. That
    is a materially different framing of the model's mechanistic reach and belongs in the investigation's
    own framing rather than only here.
  next_action_type: escalate_model
  evidence:
    observed: 'Both fold-change tables merged as the loader merges them (simulation_data.py:191 iterates
      ["fold_changes", "fold_changes_nca"], NCA second so it wins on overlap), minus fold_changes_removed.tsv:
      4209 edges, 150 TFs, 2231 distinct targets, 2198 of which resolve to mRNA cistrons out of 4347.
      Re-derivable via sims/extract_evidence.py.'
    from_test: ''
- id: F-02
  tier: observation
  statement: The model's trpR regulon is 12 edges and covers ALL FIVE of EcoCyc's TrpR operator regions
    - trpLEDCBA, aroH, aroL, mtr, and trpR's own negative autoregulation - plus aroM and yaiA. ⛔ An earlier
    version of this finding claimed 7 edges over 2 of 5 regions, and that aroL, mtr and trpR carried no
    regulatory edge from any transcription factor. That was wrong in both halves; all three are repressed
    by trpR in the table the model actually loads.
  claim_scope: mechanism
  lifecycle_state: observation
  generality:
    axes_tested:
    - parameter_regime
    level: instance_specific
  next_action: The regulon is structurally complete against EcoCyc. Whatever divergence this study finds
    is therefore a PARAMETERIZATION question, not a coverage one - which is a cleaner result than the
    original claim and removes the "unreachable by any route" framing entirely.
  next_action_type: refine_representation
  evidence:
    observed: 'Effective trpR targets after merging both tables and applying fold_changes_removed: yaiA
