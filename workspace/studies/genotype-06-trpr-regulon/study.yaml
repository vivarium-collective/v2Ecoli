    from_test: deleted-regulator-regulon-is-not-pruned
    observed: 'WT 12 rows (aroH aroL aroM mtr trpA trpB trpC trpD trpE trpL trpR yaiA); trpR-KO 11 rows,
      dropping trpR. Positive control: lacZ 2 incoming edges in the wild type, 0 after a lacZ deletion.
      Artifact: data/regulon_survival.json.'
  next_action: 'The direction of the result is the useful part: the 11 survivors are exactly the rows
    whose targets remain on the chromosome - every row that can still mis-parameterise a downstream gene
    - while the one row removed is the one whose target is gone and which therefore had no downstream
    consequence left. So a genome edit alone leaves the fitted repression of the trp regulon fully in
    place, which is why an imposed-expression route is the lever rather than a second genome edit.'
  tier: observation
discovery_implications:
  resolved_uncertainties:
  - Whether a ParCa-level TF knockout prunes that TF's regulon entries. It does NOT - the deletion transform
    touches genes, transcription_units, dna_sites and the genome sequence, and never fold_changes. All
    12 trpR rows survive a trpR deletion, so ParCa continues fitting delta_prob entries for a regulator
    no longer in the genome. This closes an open decision on the parent investigation.
  remaining_uncertainties:
  - Whether the inverted table ordering (F-03) manifests as an inverted RUN response once attenuation
    is enabled, or whether downstream machinery re-weights the two mechanisms.
  - Whether ParCa's continued fitting of an absent regulator's regulon is a defect or a defensible modelling
    choice. It needs deciding for every TF knockout, not just trpR.
  followup_study_proposals:
  - id: FU-01
    title: VOID - the TrpR->mtr edge already exists
    motivation: '⛔ This proposal rested on the retracted half of F-02. mtr is repressed by trpR at 3.89x
      in the table the model loads, so there is no edge to add and B2 was never unreachable. Retained
      rather than deleted so the reasoning error stays visible: it was derived from fold_changes.tsv alone,
      and the model also loads fold_changes_nca.tsv.'
  - id: FU-02
    title: Re-parameterize the TrpR fold-changes toward the literature range
    motivation: F-03 shows the magnitudes are an order of magnitude low AND inverted against attenuation.
      A re-parameterization would test both at once, and because operon polarity is already correct it
      is a scaling question rather than a structural one.
  - id: FU-03
    title: Reproduce and characterize the route-A TRP[c] build failure
    motivation: F-05 records a real measured ParCa failure that currently has no public artifact. The
      underlying amino-acid parameterization looks foundational and is out of scope here, but the failure
      itself should be reproducible on demand rather than remembered.
design_pivot_required:
- id: GENO06-EQ-01
  status: open
  question: Is ParCa's continued fitting of delta_prob entries for a deleted transcription factor a defect
    or a defensible modelling choice?
  alternatives:
  - Prune fold_changes rows whose TF has been deleted from the genome.
  - Keep them, and treat the regulator's absence as acting only through the protein.
  - Make it a declared option on the deletion transform.
  requested_response: A decision that applies to every TF knockout, not just trpR. Surfaced by this study
    but owned by the parent investigation.
conclusion_verdicts:
  regression_compatibility:
    basis: The study changes no shipped code or data. The static pass reads the model's own tables, and
      the run arms (route A build attempts, route B multigen) execute stock v2ecoli against cache-baked
      knockouts without modifying it.
  biological_validation:
    basis: Not asserted. The parent investigation is descriptive and asserts no verdict past build integrity;
      this study contributes a ranked set of divergences, not a pass/fail on the model.
  explanatory_gain:
    basis: F-03 identifies a specific, actionable mis-parameterization - the repression/attenuation ordering
      is inverted on every gene where both act - and F-02 establishes that the regulon is structurally
      COMPLETE against EcoCyc (12 edges, all five operator regions), so the divergence is one of parameterization
      rather than coverage.
