    points at a measurement defect rather than a wrong mechanism. Occupancy is measured PER-TU --
    any LexA at dnaG''s coordinate marks the timestep occupied -- while the code applies delta PER
    PROMOTER. With ~2 promoters, a timestep with one bound and one free is scored as fully repressed
    though the free copy still contributes b, biasing the prediction down. bound_TF_coordinates cannot
    resolve this: two copies of the same promoter share a coordinate. So the account is directionally
    right and quantitatively unclosed, and saying so is more useful than reporting the mechanism
    as confirmed.'
