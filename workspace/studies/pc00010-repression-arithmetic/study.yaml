biological_summary: 'LexA is the repressor that keeps the cell''s DNA-damage response switched off
  until it is needed. In these simulations it sits on dnaG''s promoter essentially permanently --
  98.8% of the first generation and 100% afterwards -- and the model encodes its effect as near-total
  silencing. The consequence is that dnaG, which the cell needs to start every round of DNA replication,
  is switched off, and every one of the ten genes LexA represses this strongly goes silent with it.
  Genes LexA does not regulate are untouched: the forty-one ribosomal-protein transcripts checked
  as controls receive what they are assigned.


  dnaG IS a LexA target (log2FC -1.71) (corrected 2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv
  log2FC -1.71). It shares an operon with rpsU, also a target, and with rpoD, which is not.


  What is not settled is the exact size of the effect. Predicting dnaG''s transcription from the
  measured repressor occupancy under-shoots what the simulation actually produces by about fivefold,
  and the reason is known: occupancy can only be observed for the gene as a whole, while the model
  applies repression to each copy of the promoter separately. A cell carrying two copies with one
  bound and one free looks fully repressed to the measurement but is not fully repressed in the model.'
conclusion_verdicts:
- claim: LexA occupancy silences dnaG and its cohort
  verdict: supported
  basis: 10/10 targets below 1e-9; occupancy 0.988 -> 1.000; unregulated peers at 1.078.
- claim: The collapse has a global (non-LexA) cause
  verdict: refuted
  basis: 41 unregulated rProtein peers retain what they are assigned.
- claim: The arithmetic closes quantitatively
  verdict: refuted
  basis: Predicted/measured 0.211, consistently one-sided; per-TU occupancy identified as the cause.
- claim: A negative initiation probability reaches the sampler
  verdict: refuted
  basis: EG10620's emitted target minimum is exactly 0.
discovery_implications:
- 'The causal chain is established end to end: ParCa misencodes lexA->rpoD, the delta silences TU00352,
  dnaG is silenced through its own LexA edge (corrected 2026-09-07: dnaG is a DIRECT LexA target,
  fold_changes_nca.tsv log2FC -1.71), DnaG protein depletes, the replisome gate fails, the lineage
  stalls.'
- Closing the arithmetic needs PER-PROMOTER occupancy, which no current listener provides -- two
  copies of a promoter share a coordinate. That is a concrete, scoped instrumentation gap.
- Negative probabilities in the fit are floored at zero at runtime, so they cause silencing rather
  than crashes. That makes them easy to miss and worth an explicit check wherever deltas below -1
  exist.
- All 10 of LexA's strongly-repressed targets are silenced, so the phenotypic cost of the fit defect
  is not confined to replication; it removes a whole regulon's basal expression.
