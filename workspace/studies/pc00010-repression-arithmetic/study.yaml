    observed: 10
    units: of 10 targets
    divergence_factor: 0.0
  explanation: Every one of the 10 LexA targets whose encoded delta retains <1e-6 is silenced below
    1e-9 in the last generation of every seed, while the 41 rProtein peers -- none of them LexA targets
    -- retain 1.078 of what they are assigned. The runtime confirms at the phenotype level what foldchange-to-delta-fidelity
    found at the fit level, and rules out any global explanation of the collapse.
