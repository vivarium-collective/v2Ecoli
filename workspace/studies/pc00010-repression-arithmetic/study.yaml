        generation, in every seed. dnaG is not a special case but one member of a class, exactly
        as foldchange-to-delta-fidelity found at the fit level. This is the strongest single result
        here.
    unregulated-peers-are-unaffected:
      result: PASS
      measured_value: 1.0775
      evaluated_by: agent
      operator: derived/band [0.67, 1.5]
      gate_class: acceptance_criterion
      detail: The control holds cleanly. NONE of the 41 idx_rprotein peers is a LexA target, and
        they retain 1.078 of their in-force basal in the last generation -- i.e. they get what they
        are assigned. Silencing is confined to LexA's targets, which rules out any global explanation
        of the collapse.
    negative-initiation-probability:
      result: PASS
      measured_value: 0.0
      evaluated_by: agent
      operator: derived/>= 0
      gate_class: acceptance_criterion
      detail: EG10620_RNA[c]'s emitted target probability never goes below zero; its minimum is exactly
        0. So the negative delta that foldchange-to-delta-fidelity found in the FIT (-9.25e-06 implied
        retained) does not reach the sampler as a negative probability -- it is floored at zero somewhere
        between the delta and the emitted target. The fit defect is real; its runtime consequence
        is silencing rather than a malformed distribution.
    dnag-occupancy-at-generation-1:
      result: PASS
      measured_value: 0.9881
      evaluated_by: agent
      operator: derived/<= 0.99
      gate_class: regression_pin
      detail: 0.988 median across 6 seeds, just inside the pin. That ~1.2% unbound fraction is precisely
        what leaves dnaG any generation-1 expression at all, and it closes to 1.000 by the last generation
        in every seed.
