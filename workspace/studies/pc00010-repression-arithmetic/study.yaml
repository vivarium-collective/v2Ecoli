implementation_requirements:
- id: req-1
  status: complete
  blocking: false
  summary: Extend generational_decay.py with occupancy and the in-force delta/basal terms.
  detail: 'All six axes read one aggregation: per generation, per seed -- measured target, promoter
    count, per-timestep in-force basal (reconstructed from the emitted ppgpp_conc, validated to 1.0003
    against the per-generation mean), and PC00010 occupancy per target TU derived from bound_TF_coordinates.
    No new emission is needed.'
- id: req-2
  status: complete
  blocking: false
  summary: 'NOT NEEDED: emitting ppgpp_state was attempted and abandoned.'
  detail: 'inforce-basal-vector proposed emitting ppgpp_state.basal_prob from the ppgpp-initiation
    step''s existing listeners port. It does not work: the listeners SCHEMA is declared centrally
    in composites/_helpers.py, which is in cache_version.INPUT_FILES, so a step output has no leaf
    to land in and is silently dropped. The edit was reverted. Emission proved unnecessary anyway
    -- reconstructing per-timestep from the emitted ppgpp_conc agrees with the per-generation mean
    to 1.0003, so the Jensen concern that motivated it is quantitatively negligible.'
alternative_hypotheses:
- name: H1 the arithmetic closes and occupancy is the whole story
  discriminator: occupancy-explains-the-generational-collapse
  statement: dnaG's transcription is b*(1-occupancy) to first order; the four-study 'generational
    decay' is a repressor going from 96.3% to 100% bound. Predicts both quantitative axes PASS.
- name: H2 a term is still missing
  discriminator: arithmetic-predicts-dnag-transcription
  statement: The measured value stays outside 2x of the prediction, meaning something beyond b, delta
    and occupancy is acting. The first pass showed predicted 4.3167e-08 against measured 2.2e-07,
    a 5x gap; if occupancy does not absorb it, this hypothesis is live.
- name: H3 a class-level representation defect
  discriminator: the-near-total-repression-cohort-is-silenced
  statement: 10 of PC00010's 45 targets retain <1e-6 and one is NEGATIVE (-9.25e-06). If those are
    silenced too, near-total repression is systematically mis-represented and the scope is far wider
    than dnaG.
falsifiability: Both quantitative axes compare a prediction assembled from independently measured
  terms against a measured outcome, so neither can be satisfied by restating the other. The cohort
  axis can refute the class-level reading, and the unregulated-peer control can refute the entire
  repressor chain in one measurement.
assumptions:
- assumption: The per-timestep reconstruction of the in-force basal is exact.
  basis: synth_prob is deterministic in ppgpp_conc (copy_number is derived from it internally via
    tau), and trna_attenuation -- the only other term that mutates basal_prob in ppgpp_initiation
    -- is off by default. Reconstructing per timestep rather than at a per-generation mean changes
    the value by a factor of 1.0003, so the nonlinearity is negligible at these concentrations.
  risk: low
- assumption: Coordinate matching identifies binding at dnaG's promoter.
  basis: bound_TF_coordinates is matched to the TU's replication_coordinate (-715213) within +/-1.
    This gave a clean signal -- only TF index 14 ever appears there, on 96.3% then 100% of timesteps
    -- but it is a positional join, not a promoter identity, and a second TU at the same coordinate
    would be indistinguishable.
  risk: medium
