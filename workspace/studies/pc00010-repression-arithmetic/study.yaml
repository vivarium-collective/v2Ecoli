controls:
- name: unregulated-peers-are-unaffected
  kind: negative
  hypothesis: If transcripts with no PC00010 site are silenced too, the repressor is not the mechanism.
  expected: unregulated rProtein peers retain transcription within 1.5x of their in-force basal.
  observed: None of the 41 rProtein peers is a LexA target; they retain 1.078 of their in-force basal.
  result: PASS
- name: the-near-total-repression-cohort-is-silenced
  kind: positive
  hypothesis: If the mechanism is real, PC00010's other near-totally-repressed targets should share
    dnaG's fate.
  expected: at least 8 of the 10 identified TUs below 1e-9 in the last generation.
  observed: All 10 of LexA's near-total-repression targets silenced below 1e-9 in every seed.
  result: PASS
limitations:
- "CORRECTION 2026-09-07 — this study's account of WHY LexA acts on the rpsU-dnaG-rpoD operon is\
  \ wrong, and the wrongness is inherited, not original to it.\nStatements in this file to the effect\
  \ that 'LexA regulates rpoD and dnaG is silenced as a passenger', or that a dnaG-bearing TU acquires\
  \ LexA because it contains rpoD, do not match the model. They came from checking only fold_changes.tsv,\
  \ which carries lexA->rpoD at log2FC -0.65 and no dnaG entry. There is a SECOND source, fold_changes_nca.tsv:\n\
  \    lexA  dnaG  -1.71        lexA  rpsU  -1.89\nand it is the one in force. tf_to_fold_change['PC00010']\
  \ holds EG10239_RNA (dnaG) at 0.30566, which is 2^-1.71 exactly, plus EG10896_RNA (rpsU) — and\
  \ does NOT contain EG10920_RNA (rpoD) at all. target_tf likewise lists PC00010 for dnaG and rpsU,\
  \ not rpoD. LexA is a DIRECT, cistron-level regulator of dnaG in this model. dnaG is not a passenger.\n\
  The real structural defect is different and stronger: regulation is assigned per CISTRON and then\
  \ unioned onto every TU containing that cistron (relation.py::_build_RNA_to_tf_mapping). dnaG's\
  \ LexA edge therefore lands on whatever TU carries dnaG, and after the gene-set dedup there is\
  \ exactly ONE such TU. The model cannot express 'LexA represses dnaG through this promoter but\
  \ not that one' — TU-specific differential regulation is structurally impossible, not merely mis-assigned.\
  \ It also means restoring the deduplicated promoters could not have separated them: all three TUs\
  \ carry an identical cistron set, so cistron-level regulation attaches LexA to all three.\nWHAT\
  \ THIS DOES AND DOES NOT INVALIDATE: measurements of the encoded delta, occupancy, the deficit\
  \ and the lineage outcomes are unaffected — they measured the model as built. What is wrong is\
  \ the causal STORY told about them. Any figure computed against rpoD's -0.65 as dnaG's input baseline\
  \ is wrong and should be recomputed against -1.71; in this investigation that includes the fold-change-to-delta\
  \ distortion, which is 7.08e+06-fold, not 1.48e+07.\nLeft in place rather than rewritten: the original\
  \ text is preserved above so the record shows what was believed when the work was done."
- 'PC00010 is the LexA dimer, identified from reconstruction/ecoli/flat/{complexation_reactions,transcription_factors}.tsv.
  LexA reaches this TU through dnaG''s OWN cistron-level edge (log2FC -1.71) and rpsU''s; rpoD is
  not in tf_to_fold_change (corrected 2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv
  log2FC -1.71). So dnaG is repressed as a LexA target in its own right (log2FC -1.71), not as an
  operon passenger (corrected 2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv log2FC
  -1.71). Whether ~100% LexA occupancy is biologically right is NOT settled here and is not this
  study''s question.'
- Occupancy is inferred by matching bound_TF_coordinates to a TU's replication_coordinate. It is
  a positional join; a second promoter at the same coordinate would be indistinguishable.
- Everything is measured in a lineage that stalls by generation 4-5, so the terms are read from failing
  cells.
- 'The study explains HOW dnaG is silenced. It does not establish whether the delta of -0.999999957
  or the ~100% occupancy is the thing that is wrong, and it cannot: that needs a reference for what
  dnaG''s expression should be, which this investigation does not have.'
- Occupancy is per-TU, not per-promoter, because two copies of a promoter share a replication coordinate.
  This is the identified cause of the arithmetic axis failing and cannot be resolved with current
  listeners.
- The in-force basal is reconstructed from emitted ppgpp_conc (validated to 1.0003), not measured
  directly; emitting it would require editing the cache-hashed _helpers.py.
claim: LexA silences all ten of its near-total-repression targets and only its targets, dnaG among
  them; the mechanism is confirmed but the arithmetic remains ~5x unclosed because occupancy can
  only be measured per-TU.
conclusion: 'Mixed, and the split is the useful part. The MECHANISM is confirmed: all 10 of LexA''s
  near-total-repression targets are silenced below 1e-9 in every seed, the 41 unregulated rProtein
  peers retain 1.078 of their assigned probability, and dnaG''s generation-1 occupancy of 0.988 --
  with its ~1.2% unbound fraction -- is exactly what leaves it any expression before occupancy closes
  to 1.000.

  The ARITHMETIC does not close. Prediction under-shoots measurement by ~5x, consistently and in
  one direction, and the cause is identified rather than left open: occupancy is measured per-TU
  while delta is applied per promoter, so a timestep with one of dnaG''s two promoters bound is scored
  as fully repressed. That biases the prediction down, which is the direction seen. bound_TF_coordinates
  cannot fix it, because two copies of one promoter share a coordinate; per-promoter occupancy would
  need a listener that does not exist.

  One clean negative result: the negative initiation probability that exists in the FIT never reaches
  the sampler. It is floored at zero, so the defect''s runtime consequence is silencing rather than
  a malformed distribution.'
confidence: Investigating
preliminary_observations:
- note: PC00010 = LexA dimer. My first search claimed it appeared in no flat file; that was WRONG
    -- I searched a path that does not exist in this worktree plus a 3-file validation directory,
    while the reconstruction data ships as an installed package (69 TSVs under .venv/lib/python3.12/site-packages/reconstruction/ecoli/flat).
    Searched properly it resolves immediately in two files.
runs:
- name: pc00010-repression-arithmetic__analysis
  status: complete
  canonical: true
  started_at: '2026-09-04T03:00:00Z'
  started_at_iso: '2026-09-04T03:00:00Z'
  note: 'NO NEW SIMULATION -- reuses dnag-promoter-availability''s 6 independent seeds. Every term
    measured: in-force basal reconstructed per timestep from the emitted ppgpp_conc, occupancy from
    the deriver-repaired bound_TF_coordinates, delta from the in-force matrix built with ppgpp=True
    (-0.999999957), and the measured per-promoter probability as target/promoter_count. Occupancy
    is necessarily PER-TU, which is this analysis''s main limitation and the identified cause of
    the arithmetic axis failing.'
  outcomes:
    arithmetic-predicts-dnag-transcription:
      result: FAIL
      measured_value: 0.2107
      evaluated_by: agent
      operator: derived/band [0.5, 1.5]
      gate_class: acceptance_criterion
      detail: 'Predicted over measured is 0.211: the account UNDER-predicts dnaG''s transcription
        by ~5x, consistently and in one direction (per-seed generation-1 values 0.43, 0.25, 0.27,
        0.18, 0.29, 0.25). A consistent one-sided miss of a fixed size is a measurement defect, not
        a broken mechanism, and the likely cause is identified: occupancy here is per-TU -- a timestep
        counts as occupied if ANY promoter at dnaG''s coordinate carries LexA -- while the code applies
        delta PER PROMOTER. dnaG holds ~2 promoters, so a timestep with one bound and one free is
        scored as fully repressed while the free copy still contributes b. That biases the prediction
        DOWN, which is the direction observed. Closing this needs per-promoter occupancy, which bound_TF_coordinates
        cannot supply because two copies of one promoter share a coordinate.'
    occupancy-explains-the-generational-collapse:
      result: FAIL
      measured_value: 0.423
      evaluated_by: agent
      operator: derived/band [0.5, 1.5]
      gate_class: acceptance_criterion
      detail: '0.423, just outside the band, and inherits the same per-TU occupancy defect: the occupancy-only
        model predicts a steeper collapse than measured because it treats a partly-bound TU as fully
        repressed. Directionally the account holds -- occupancy does rise to 1.000 in every seed
        and transcription does collapse -- but occupancy as measured here does not carry the collapse
