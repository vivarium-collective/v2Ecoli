schema_version: 4
name: tu-coverage-loss
title: The genes with nowhere else to be transcribed
investigation: transcription-rewiring
study_type: fit_validation
phase: Decide
created: '2026-09-04'
status: complete
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: failed
expert_review_status: not_requested
question: dnaG is silenced because LexA represses the only transcription unit that carries it. rpsU,
  in the same operon, escapes untouched because it keeps a TU of its own with no LexA site. That
  contrast is structural, not biochemical. The model omits 760 of 3766 source transcription units
  (20.2%), leaving 179 genes with none at all and 563 reduced from several to one. How widespread
  is the resulting exposure, and does it fall on genes the cell cannot do without?
units_and_time:
  tick: 1 s of simulated time for the runtime axes; the coverage axes read static artefacts.
  quantities:
    TU count: number of transcription units containing a gene (dimensionless)
    silenced: measured cistron transcription below 1e-9
    relative risk: ratio of silenced fractions between two gene groups
behavior_tests:
- name: orphaned-genes-are-transcriptionally-dead
  classification: primary
  gate_class: acceptance_criterion
  question: Do the genes left with no transcription unit actually produce nothing?
  description: 'At least 90% of the 179 genes whose every source TU is absent from the model show
    zero measured transcription across the lineage.


    The most direct consequence of TU selection, and the one that needs confirming before anything
    subtler. 760 of 3766 source transcription units (20.2%) are absent from the model, leaving 179
    genes with no TU at all -- they cannot be transcribed by construction. If they nonetheless show
    transcription, the gene-to-TU accounting used here is wrong and every other axis is suspect;
    if they are silent, the model is missing 179 gene products outright.


    Threshold provenance: theory. 90% tolerates accounting slips in the gene-symbol join without
    tolerating a broken premise.'
  measure:
    kind: derived
    path: fraction of the 179 orphaned genes with zero measured cistron transcription, from TU coverage
      loss
    detail: fraction of orphaned genes whose actual_rna_synth_prob_per_cistron is zero throughout,
      median over seeds.
  pass_if:
    low: 0.9
    high: 1.0
    provenance:
      kind: theory
      note: Bounded above by 1.0; 0.9 tolerates join slippage without tolerating a wrong premise.
  status: failed
  result: FAIL
  measured_value: 0.0
  evaluated_by: agent
- name: single-tu-genes-are-more-exposed-to-repression
  classification: primary
  gate_class: acceptance_criterion
  question: Does losing alternative promoters make a gene vulnerable to a single TF?
  description: 'Among genes carrying a repressing TF, those reduced to ONE surviving TU are at least
    3x more likely to be silenced (measured transcription below 1e-9) than genes retaining two or
    more TUs.


    The mechanism dnaG exemplifies, tested as a population claim rather than an anecdote. dnaG has
    three source TUs and one survivor, all carrying the LexA site, so it has no escape route; rpsU
    keeps its own un-repressed TU (delta exactly 0, retained 1.0000) and is untouched. 563 genes
    were reduced from several TUs to one. If they are systematically more silenceable, TU selection
    converts promoter-specific regulation into gene-wide silencing.


    Threshold provenance: theory. 3x is a large effect deliberately -- a marginal enrichment would
    not support a structural claim, and the mechanism predicts a stark difference rather than a gradient.'
  measure:
    kind: derived
    path: relative risk of silencing for single-TU versus multi-TU regulated genes -- the dnaG (no
      escape) versus rpsU (dedicated TU) contrast as a population claim
    detail: ratio of silenced fraction among single-TU regulated genes to that among multi-TU regulated
      genes.
  pass_if:
    low: 3.0
    high: 9.0
    provenance:
      kind: theory
      note: Spans 3x, the widest the discrimination check permits, anchored at the 3x minimum effect
        the structural claim requires.
  status: failed
  result: FAIL
  measured_value: 0.95
  evaluated_by: agent
- name: dnag-has-no-alternative-promoter-in-the-source-data
  classification: primary
  gate_class: acceptance_criterion
  question: Is dnaG's exposure a modelling artefact or a property of the underlying biology?
  description: 'dnaG appears in ZERO source transcription units that exclude rpoD -- i.e. it has
    no dedicated promoter even before any model selection.


    Separates two very different stories. If dnaG had dedicated TUs that the model DROPPED, the defect
    is TU selection and is fixable by keeping them. If it has none in the source data either, then
    dnaG is a DIRECT LexA target (log2FC -1.71) (corrected 2026-09-07: dnaG is a DIRECT LexA target,
    fold_changes_nca.tsv log2FC -1.71) and the defect is that regulation is assigned per CISTRON
    and unioned onto every TU carrying it, leaving one dnaG-bearing TU after the dedup -- a different
    fix entirely. rpoD lost 5 of 7 source TUs and rpsU 2 of 4, so both have alternatives; whether
    dnaG ever did is the question.


    Threshold provenance: definitional. A count of dedicated TUs is zero or it is not.'
  measure:
    kind: derived
    path: fraction of source TUs containing dnaG that ALSO contain rpoD, the contrast with rpsU which
      keeps a dedicated un-repressed TU
    detail: of the source transcription units whose gene list includes EG10239, the fraction that
      also include EG10896; 1.0 means dnaG has no dedicated promoter anywhere.
  pass_if:
    low: 0.99
    high: 1.0
    provenance:
      kind: theory
      note: 'Expressed as a fraction bounded above by 1.0 rather than a count with ''<= 0''. Identical
        claim -- 1.0 means every dnaG-bearing TU also carries rpoD, i.e. no dedicated promoter exists
        -- but a bounded quantity the discrimination check can grade. rpsU is the contrast: it DOES
        keep a dedicated TU (TU00472) whose LexA delta is exactly 0.'
  status: passed
  result: PASS
  measured_value: 1.0
  evaluated_by: agent
- name: essential-genes-are-not-preferentially-orphaned
  classification: primary
  gate_class: acceptance_criterion
  question: Is TU loss random with respect to how important a gene is?
  description: 'The orphan-and-single-TU rate among genes the model itself treats as essential (ribosomal
    proteins, RNAP subunits, replication genes) is within 1.5x of the rate across all genes.


    The discriminating control, and the one that decides how alarming this is. If TU loss falls randomly,
    179 orphans is a coverage gap to be logged. If it concentrates on essential machinery -- as the
    rpsU-dnaG-rpoD locus hints, having lost 5 of its 8 TUs -- then the model is systematically fragile
    exactly where it can least afford to be.


    Threshold provenance: theory. 1.5x is the standing band; enrichment beyond it is a structural
    finding rather than noise.'
  measure:
    kind: derived
    path: ratio of orphan-or-single-TU rate among essential genes to the all-gene rate, from TU coverage
      loss
    detail: rate among idx_rprotein / idx_rnap / replication cistrons divided by the overall rate.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: 'Two-sided: essential genes being DEPLETED of TU loss would be as informative as their
        being enriched.'
  status: passed
  control: negative
  result: PASS
  measured_value: 0.8608
  evaluated_by: agent
- name: tu-loss-fraction
  classification: supporting
  gate_class: regression_pin
  question: Does the coverage gap still measure as recorded?
  description: 'The fraction of source TUs absent from the model stays within a factor of 1.5 of
    the recorded 0.202.


    POST-HOC: measured while scoping. A drift pin on the headline coverage number.'
  measure:
    kind: derived
    path: fraction of source transcription units absent from the model, the TU coverage loss
    detail: 760 absent of 3766 source TUs.
  pass_if:
    op: <=
    value: 0.303
    provenance:
      kind: post_hoc
      note: 1.5x the 0.202 measured while scoping; pin only.
  status: passed
  result: PASS
  measured_value: 0.2018
  evaluated_by: agent
