findings:
- summary: 'CORRECTION: there are no orphaned genes. My ''179 genes with no TU'' was an accounting
    error.'
  status: contradicts
  evidence:
    from_test: orphaned-genes-are-transcriptionally-dead
    observed: 0
    units: genes with zero model TUs
    divergence_factor: 1.0
  explanation: Every one of the 4538 cistrons has at least one model TU (min 1, max 6). The '179
