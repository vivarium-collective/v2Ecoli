- summary: 'CORRECTED ROOT CAUSE: regulation is assigned by cistron content, not promoter position,
    so no dnaG-bearing TU can escape LexA.'
  status: novel
  evidence:
    from_run: tu-coverage-loss__static-plus-reuse
    observed: 2
    units: of 2 rpoD-bearing model TUs LexA-regulated
  explanation: 'Added after the user challenged this study''s conclusion, and it replaces my reasoning
    rather than refining it. I had written that restoring the omitted TUs would not rescue dnaG ''because
    there is no dnaG-only TU to restore''. That was the wrong reason: dnaG does not need a dnaG-ONLY
    TU, it needs any dnaG-bearing TU that is not repressed.

    The actual barrier is that rna_id_to_regulating_tfs assigns a TF to a TU by CISTRON CONTENT.
    Both rpoD-bearing model TUs carry PC00010; TU00472 starts at the SAME coordinate as TU00352 (3210646)
    and is unregulated purely because it excludes rpoD. Since all three dnaG-bearing source TUs also
    contain rpoD, restoring TU00434 or TU00435 would give them the LexA delta too. No dnaG-bearing
    TU can escape while the rule is cistron-content-based.

    That is the promoter-specificity defect: a repressor binding one operator should silence only
    transcripts initiated from the promoter it blocks, not every transcript containing a downstream
    gene. The three dnaG-bearing TUs have three different 5'' ends (3210646 / 3210712 / 3210735)
    -- three distinct promoters -- and the model cannot represent an operator that blocks one of
    them.'
biological_summary: 'The question this study set out to answer was whether the model routinely strips
  genes of their alternative promoters, leaving them at the mercy of a single regulator. The answer
  is no. Every gene in the model can be transcribed from at least one transcription unit, genes that
  lost alternatives are no more likely to fall silent than genes that kept them, and essential machinery
  is if anything slightly better covered than average.


  So dnaG is not a symptom of a general fragility. It is unusual in a specific way: of the three
  genes in its operon, it is the only one with no transcription unit of its own anywhere in the underlying
  data. rpsU has a dedicated unit that LexA does not touch at all, which is why the ribosomal protein
  sails through; rpoD has four. dnaG has none, so whatever happens to the operon happens to the primase.


  That makes its silencing a coincidence of two things rather than one: a gene that depends entirely
  on a shared transcript, and a fitting step that happened to drive that particular transcript to
  zero. Neither alone would have stopped the cell. It also settles a practical question -- putting
  the omitted transcription units back would not rescue dnaG, because there is no dnaG-only unit
  to put back.'
conclusion_verdicts:
- claim: 179 genes are left with no transcription unit
  verdict: refuted
  basis: Zero cistrons lack a model TU; the count was a source-vs-model accounting error.
- claim: Losing alternative promoters makes a gene silenceable (H1)
  verdict: refuted
  basis: Relative risk 0.95 (0.0167 vs 0.0175) against a required 3x.
- claim: dnaG is a special case (H2)
  verdict: supported
  basis: No dedicated promoter in the source data; only 4 of 237 repressed genes silenced at all.
- claim: TU loss targets essential machinery (H3)
  verdict: refuted
  basis: Essential single-TU rate 0.729 vs 0.847 overall.
discovery_implications:
- THE FIX IS PROMOTER-SPECIFIC REGULATION. rna_id_to_regulating_tfs assigns a TF to every TU containing
  a regulated cistron, so a repressor silences transcripts initiated from promoters it cannot physically
  block. Restoring omitted TUs cannot help while that rule holds, because all three dnaG-bearing
  TUs contain rpoD.
- The three dnaG-bearing TUs have three distinct 5' ends (3210646 / 3210712 / 3210735) -- the rpsUp
  promoter set. Representing an operator as blocking ONE of them is the minimal change that would
  let dnaG escape.
- The model's TU coverage is not a systemic fragility, which removes a whole line of suspicion this
  investigation was about to pursue.
- dnaG's silencing is a conjunction of two unusual properties, so other genes at risk would need
  BOTH -- no dedicated promoter AND an operon TU at the constraint boundary. That is a small, enumerable
  set worth listing.
- 'A source-side TU absence fraction is not a coverage gap: the model adds 271 TUs of its own. Any
  future audit of coverage must use the model''s cistron_tu_mapping_matrix, not a source-file diff.'
