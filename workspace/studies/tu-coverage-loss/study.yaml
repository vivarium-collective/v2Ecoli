controls:
- name: essential-genes-are-not-preferentially-orphaned
  kind: negative
  hypothesis: If TU loss is random with respect to importance, 179 orphans is a coverage gap rather
    than a structural fragility.
  expected: essential-gene orphan/single-TU rate within 1.5x of the all-gene rate.
  observed: Essential genes single-TU at 0.729 vs 0.847 overall (ratio 0.861) -- slightly less exposed.
  result: PASS
limitations:
- "CORRECTION 2026-09-07 — this study's account of WHY LexA acts on the rpsU-dnaG-rpoD operon is\
  \ wrong, and the wrongness is inherited, not original to it.\nStatements in this file to the effect\
  \ that 'LexA regulates rpoD and dnaG is silenced as a passenger', or that a dnaG-bearing TU acquires\
  \ LexA because it contains rpoD, do not match the model. They came from checking only fold_changes.tsv,\
  \ which carries lexA->rpoD at log2FC -0.65 and no dnaG entry. There is a SECOND source, fold_changes_nca.tsv:\n\
  \    lexA  dnaG  -1.71        lexA  rpsU  -1.89\nand it is the one in force. tf_to_fold_change['PC00010']\
  \ holds EG10239_RNA (dnaG) at 0.30566, which is 2^-1.71 exactly, plus EG10896_RNA (rpsU) — and\
  \ does NOT contain EG10920_RNA (rpoD) at all. target_tf likewise lists PC00010 for dnaG and rpsU,\
  \ not rpoD. LexA is a DIRECT, cistron-level regulator of dnaG in this model. dnaG is not a passenger.\n\
  The real structural defect is different and stronger: regulation is assigned per CISTRON and then\
  \ unioned onto every TU containing that cistron (relation.py::_build_RNA_to_tf_mapping). dnaG's\
  \ LexA edge therefore lands on whatever TU carries dnaG, and after the gene-set dedup there is\
  \ exactly ONE such TU. The model cannot express 'LexA represses dnaG through this promoter but\
  \ not that one' — TU-specific differential regulation is structurally impossible, not merely mis-assigned.\
  \ It also means restoring the deduplicated promoters could not have separated them: all three TUs\
  \ carry an identical cistron set, so cistron-level regulation attaches LexA to all three.\nWHAT\
  \ THIS DOES AND DOES NOT INVALIDATE: measurements of the encoded delta, occupancy, the deficit\
  \ and the lineage outcomes are unaffected — they measured the model as built. What is wrong is\
  \ the causal STORY told about them. Any figure computed against rpoD's -0.65 as dnaG's input baseline\
  \ is wrong and should be recomputed against -1.71; in this investigation that includes the fold-change-to-delta\
  \ distortion, which is 7.08e+06-fold, not 1.48e+07.\nLeft in place rather than rewritten: the original\
  \ text is preserved above so the record shows what was believed when the work was done."
- The gene-to-TU join is by identifier across two artefacts; unresolved genes are counted and reported,
  but systematic naming mismatches would bias which genes are examined.
- '''Essential'' is taken from the model''s own class lists (idx_rprotein, idx_rnap, replication
  cistrons), not from an external essentiality dataset, so it is a proxy.'
- 'The study measures exposure and silencing. It does NOT establish that the omitted TUs should have
  been kept: the model may exclude them for reasons this study does not examine.'
- Silencing is read from a stalling lineage, so a gene silent here need not be silent in healthy
  growth.
- The orphan axis is recorded as FAILED because its premise was false, not because the model has
  orphans. Read the detail before citing the result.
- Only 4 of 237 repressed genes are silenced at all, so the relative-risk comparison rests on very
  small counts (3 and 1). It cannot exclude a modest real effect -- only the 3x one the design required.
- '''Essential'' uses the model''s own class lists as a proxy, not an external essentiality dataset.'
- Whether TU00434/TU00435 would in reality escape the LexA operator depends on the operator's position
  relative to their transcription start sites, which this study did not establish -- it shows only
  that under the current cistron-content rule they could not escape regardless of position.
claim: There are no orphaned genes and single-TU genes are not more silenceable; dnaG is a genuine
  special case -- the only one of its operon with no promoter of its own.
conclusion: 'Largely a refutation, including of my own framing, and the study is more useful for
  it.

  H1 is refuted: genes reduced from several transcription units to one are silenced at 0.0167 against
  0.0175 for genes retaining several -- a relative risk of 0.95 where the design required 3x. Losing
  alternative promoters does not make a gene silenceable, and dnaG''s exposure does not generalise.
  Only 4 of 237 repressed genes are silenced at all.

  The premise axis also fired, correctly, against me. There are ZERO orphaned genes: every one of
  the 4538 cistrons has at least one model TU. My scoping figure of 179 came from comparing source
  TU ids against model TU ids while missing the 271 TUs the model carries that the source file does
  not, and 71 of 104 ''orphans'' were visibly transcribing. The alarm I raised about 20.2% coverage
  loss was unfounded.

  What survives is the fact that matters: dnaG has NO dedicated promoter in the source data -- all
  3 of its TUs also carry rpoD -- while rpsU keeps TU00472 with a LexA delta of exactly 0.0 and rpoD
  has 4 dedicated source TUs. So dnaG''s silencing is a CONJUNCTION of two unusual things, a gene
  with no promoter of its own and an operon TU that landed on ParCa''s constraint boundary, not a
  systematic structural failure. That decides the fix: restoring omitted TUs would not help dnaG,
  because there is no dnaG-only TU to restore.


  CORRECTED after review: the claim that restoring TUs would not help dnaG stands, but my reason
  for it was wrong. dnaG does not need a dnaG-only TU, only an unrepressed dnaG-bearing one. The
  real barrier is that rna_id_to_regulating_tfs assigns TFs to TUs by CISTRON CONTENT -- both rpoD-bearing
  model TUs are LexA-regulated, while TU00472 at the same start coordinate escapes solely by excluding
  rpoD -- and since all three dnaG-bearing TUs carry an IDENTICAL cistron set, any restored TU inherits
  dnaG''s own LexA edge regardless (corrected 2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv
  log2FC -1.71). The fix is therefore promoter-specific regulation, not TU restoration: the three
  dnaG-bearing TUs have three distinct 5'' ends, and an operator blocking one promoter should not
  silence transcripts initiated from the others.'
confidence: Refuted
