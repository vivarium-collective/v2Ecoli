implementation_requirements:
- id: req-1
  status: complete
  blocking: true
  summary: Build the source-TU to model-TU coverage map per gene.
  detail: 'Join transcription_units.tsv (3766 TUs, gene lists as JSON) against the model''s rna_data
    ids, per gene: source TU count, surviving TU count, and whether every survivor carries the same
    repressing TF. Genes whose symbols do not resolve must be counted and reported, not dropped --
    the join is the study''s main methodological risk.'
- id: req-2
  status: complete
  blocking: false
  summary: Reuse the per-cistron transcription measurement.
  detail: actual_rna_synth_prob_per_cistron is emitted since the deriver repair, so orphan and single-TU
    silencing can be read from dnag-promoter-availability's sweep with no new runs.
alternative_hypotheses:
- name: H1 structural exposure
  discriminator: single-tu-genes-are-more-exposed-to-repression
  statement: Losing alternative promoters converts promoter-specific regulation into gene-wide silencing;
    single-TU genes are markedly more silenceable. The dnaG-versus-rpsU contrast generalises.
- name: H2 coincidence
  discriminator: single-tu-genes-are-more-exposed-to-repression
  statement: dnaG's exposure is a one-off and single-TU genes are no more silenceable than others;
    the TU gap is a coverage nuisance rather than a mechanism.
- name: H3 the loss is targeted at essential machinery
  discriminator: essential-genes-are-not-preferentially-orphaned
  statement: TU loss concentrates on essential genes, as the rpsU-dnaG-rpoD locus hints at having
    lost 5 of its 8 TUs. Would make the model systematically fragile where it can least afford to
    be.
falsifiability: 'H2 is a real possibility and the relative-risk axis is powered to detect it: a 3x
  minimum effect was chosen so a marginal enrichment cannot be read as a structural claim. The essential-gene
  control can independently show the loss is random with respect to importance.'
simulation_set: []
