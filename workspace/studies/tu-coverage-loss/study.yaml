  criteria:
  - test: orphaned-genes-are-transcriptionally-dead
    prior: Do the genes left with no transcription unit actually produce nothing?
  - test: single-tu-genes-are-more-exposed-to-repression
    prior: Does losing alternative promoters make a gene vulnerable to a single TF?
  - test: dnag-has-no-alternative-promoter-in-the-source-data
