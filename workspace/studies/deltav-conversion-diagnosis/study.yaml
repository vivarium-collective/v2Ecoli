implementation_requirements:
- id: req-1
  status: complete
  blocking: true
  summary: Reproduce deltaV from r_vector, and identify what the fit was constrained to.
  detail: 'calculateRnapRecruitment (fit_sim_data_1.py:4022) reads deltaV from r[col_names_to_index[rnaIdNoLoc
    + ''__'' + tf]] and basal_prob from the matching ''__alpha'' column, where r = cell_specs[''basal''][''r_vector''],
    set at line 3705. The fold changes enter far upstream (lines ~758, 874, 3879) as constraints
    on that fit, NOT through any direct formula. So the question is not ''what transform is wrong''
    but ''what was the regression asked to satisfy, and is deltaV/basal_prob the quantity that answers
    it''. req-1 is to reproduce the stored deltaV from r_vector (axis 1) and to read the fit''s objective
    -- what residual it minimises and in what space -- WITHOUT yet evaluating fidelity.


    RESOLVED. r_vector (4739,) and r_columns both recover from models/parca/parca_state.pkl.gz ->
    cell_specs[''basal''], so NO ParCa re-run is needed and the main scoping risk is closed. Replaying
    calculateRnapRecruitment''s indexing reproduces 979 of 979 stored deltaV entries within 1e-9
    relative and 100% of basal_prob. Only 3 TUs had a negative fitted alpha clipped to zero.'
- id: req-2
  status: complete
  blocking: true
  summary: State the candidate correction BEFORE measuring its effect.
  detail: 'The two repair axes are only meaningful if the correction is specified in advance. Once
    req-1 identifies what the fit optimises, the candidate correction must be written into this study''s
    record BEFORE recomputing anything, otherwise ''the correction that restores fidelity'' is chosen
    by fitting to the answer. This requirement exists because that is precisely how studies 13-15
    leaked: numbers measured during scoping could only be recorded post-hoc.


    SATISFIED: the candidate diagnosis and BOTH correction options are recorded in the candidate_diagnosis
    block above, with their predictions, before any fidelity measurement.'
- id: req-3
  status: complete
  blocking: false
  summary: Reuse the join from foldchange-to-delta-fidelity.
  detail: The TF-target join (564 entries, with unjoined counts) is already implemented in that study's
    analyses/measure.py. Import it rather than re-deriving, so corrected and uncorrected fidelity
    are measured over an identical entry set.
- id: req-conv-1
  status: not_started
  blocking: true
  summary: Re-solve the promoter fit with the alpha + delta >= 0 constraint repaired, then regrade
    axes 4 and 5.
  detail: Both remaining axes need a corrected deltaV that does not exist yet. The fit minimises
    norm(G@R - k) subject to 0 <= Z@R <= 1; when the lower bound binds the optimiser sits exactly
    on it, giving delta/alpha = -1 and total silencing regardless of the target fold change, because
    the objective matches absolute probabilities and never sees the ratio. Repairing it means changing
    what the objective sees, not post-processing the output. Until then corrected-lexa-dnag-is-non-lethal
    stays blocked and corrected-conversion-restores-fidelity stays superseded.
alternative_hypotheses:
- name: H1 fit residual
  discriminator: candidate-explains-magnitude-uniformity
  statement: 'deltaV is a least-squares coefficient, not an encoding, so the distortion is fit error:
    the regression cannot satisfy all constraints simultaneously and distributes the residual. Predicts
    magnitude-uniform, sign-asymmetric distortion -- consistent with BOTH inherited constraints,
    which makes it the leading candidate a priori.'
- name: H2 space mismatch
  discriminator: candidate-explains-magnitude-uniformity
  statement: 'The fit works in log space while the runtime applies delta additively in probability
    space. DISFAVOURED a priori: this predicts error growing with |log2FC|, and foldchange-to-delta-fidelity
    measured 1.166 strong-vs-weak. Recorded so the refutation is explicit rather than assumed.'
- name: H3 negative-basal clipping
  discriminator: negative-basal-clipping-is-not-the-cause
  statement: basal_prob[basal_prob < 0] = 0 clips the intercept without clipping deltaV, so entries
    on clipped TUs get a delta divided by a zeroed basal. Cannot be the general cause -- dnaG's basal
    is 1.2128e-04 and unclipped -- but may explain a subset, including some of the six negative-probability
    entries.
- name: H4 the fit is faithful and the comparison is wrong
  discriminator: conversion-path-reproduces-the-cache
  statement: 'deltaV/basal_prob is simply not the quantity 2**log2FC describes -- the regression
    targets a promoter-bound probability under a different baseline, and foldchange-to-delta-fidelity
    compared incommensurable numbers. This would make the ''defect'' an artefact of that study rather
    than of ParCa, and it must be taken seriously: it is the hypothesis under which this investigation''s
    last two studies are wrong.'
falsifiability: 'H4 is included deliberately: it is the hypothesis under which this investigation''s
  own recent conclusions are the error, and it is discriminated by reading what the fit was constrained
  to rather than by any measurement this study could tune. The two repair axes prevent a diagnosis
  that explains the symptoms without fixing the numbers, and req-2 forces the candidate correction
  to be stated before its effect is measured.'
assumptions:
- assumption: The cache's delta_prob came from calculateRnapRecruitment on this r_vector.
  basis: Asserted from source but NOT yet verified against the cache, which is exactly what axis
    1 checks before anything downstream is trusted.
  risk: low
- assumption: 2**log2FC remains the right comparison for a corrected deltaV.
  basis: Inherited from foldchange-to-delta-fidelity and NOT independent of it. If H4 holds, this
    assumption is false and the corrected-fidelity axes are measuring the wrong thing -- which is
    why H4 is discriminated by reading the fit's objective rather than by these axes.
  risk: high
simulation_set: []
planned_runs:
- name: static-parca-analysis
  status: planned
  n_steps: 0
  details: NO SIMULATION. Reads the ParCa cache (fingerprint ea05ac9b23b1d843), r_vector via cell_specs
    if obtainable, fit_sim_data_1.py source, and reconstruction/ecoli/flat/fold_changes.tsv. If r_vector
    is not recoverable from the cache alone, req-1 becomes a ParCa re-run and this study's cost changes
    materially -- that is the main scoping risk and is checked first.
robustness:
  n_replicates: 1
  seeds: []
  parameter_sweep: false
  note: Deterministic static artefacts; replication is meaningless. Breadth comes from the 564 joined
    entries and 23 modelled TFs.
controls:
- name: negative-basal-clipping-is-not-the-cause
  kind: negative
  hypothesis: If distortion is concentrated on clipped-basal TUs, H3 rather than H1 is the mechanism.
  expected: clipped-basal prevalence among high-distortion entries within 2x of base rate.
  observed: Only 3 of 3277 TUs clipped; 47 of 48 boundary entries sit on unclipped TUs. Not the general
    cause, though the enrichment measure nominally fails at 22.8x on n=1.
  result: FAIL
- name: conversion-path-reproduces-the-cache
  kind: positive
  hypothesis: If the identified path does not reproduce the stored deltaV, the diagnosis is of the
    wrong code.
  expected: '>= 99% of entries reproduced within 1e-9 relative.'
  observed: 979/979 deltaV entries and 100% of basal_prob reproduced within 1e-9.
  result: PASS
limitations:
- Two of six axes cannot be graded from the current record. corrected-lexa-dnag-is-non-lethal needs
  a corrected deltaV that does not exist until the constraint repair is implemented (req-conv-1),
  and corrected-conversion-restores-fidelity was measured on the 564-entry incomplete join rather
  than the 1606-entry in-force one. Both are marked rather than carried as results.
- This study has no analyses/ directory. Every number in it was produced by code that was not saved,
  so nothing here could be re-executed — the active-constraint diagnosis was re-verified from scratch
  on 2026-09-07 and does reproduce (Z@R = 5.235e-12), but that was a reimplementation, not a rerun.
- "CORRECTION 2026-09-07 — this study's account of WHY LexA acts on the rpsU-dnaG-rpoD operon is\
  \ wrong, and the wrongness is inherited, not original to it.\nStatements in this file to the effect\
  \ that 'LexA regulates rpoD and dnaG is silenced as a passenger', or that a dnaG-bearing TU acquires\
  \ LexA because it contains rpoD, do not match the model. They came from checking only fold_changes.tsv,\
  \ which carries lexA->rpoD at log2FC -0.65 and no dnaG entry. There is a SECOND source, fold_changes_nca.tsv:\n\
  \    lexA  dnaG  -1.71        lexA  rpsU  -1.89\nand it is the one in force. tf_to_fold_change['PC00010']\
  \ holds EG10239_RNA (dnaG) at 0.30566, which is 2^-1.71 exactly, plus EG10896_RNA (rpsU) — and\
  \ does NOT contain EG10920_RNA (rpoD) at all. target_tf likewise lists PC00010 for dnaG and rpsU,\
  \ not rpoD. LexA is a DIRECT, cistron-level regulator of dnaG in this model. dnaG is not a passenger.\n\
  The real structural defect is different and stronger: regulation is assigned per CISTRON and then\
  \ unioned onto every TU containing that cistron (relation.py::_build_RNA_to_tf_mapping). dnaG's\
  \ LexA edge therefore lands on whatever TU carries dnaG, and after the gene-set dedup there is\
  \ exactly ONE such TU. The model cannot express 'LexA represses dnaG through this promoter but\
  \ not that one' — TU-specific differential regulation is structurally impossible, not merely mis-assigned.\
  \ It also means restoring the deduplicated promoters could not have separated them: all three TUs\
  \ carry an identical cistron set, so cistron-level regulation attaches LexA to all three.\nWHAT\
  \ THIS DOES AND DOES NOT INVALIDATE: measurements of the encoded delta, occupancy, the deficit\
  \ and the lineage outcomes are unaffected — they measured the model as built. What is wrong is\
  \ the causal STORY told about them. Any figure computed against rpoD's -0.65 as dnaG's input baseline\
  \ is wrong and should be recomputed against -1.71; in this investigation that includes the fold-change-to-delta\
  \ distortion, which is 7.08e+06-fold, not 1.48e+07.\nLeft in place rather than rewritten: the original\
  \ text is preserved above so the record shows what was believed when the work was done."
- If r_vector is not recoverable from the cache, req-1 requires re-running ParCa, which changes this
  study from an afternoon of analysis into a substantial job. Checked first.
- The corrected-fidelity axes rest on 2**log2FC being the right target, an assumption inherited from
  foldchange-to-delta-fidelity and marked high risk. If H4 holds they measure the wrong thing, which
  is why H4 is discriminated separately.
- 'The study can identify WHAT the conversion does wrong without establishing what it SHOULD do:
  the regression may be satisfying a constraint that is itself mis-specified upstream, and this study
  does not reach that far.'
- The cache deliberately predates the LexA-related ParCa fix recorded on another branch. Whether
  that fix touches this conversion is not checked here.
- 'corrected-lexa-rpod-is-non-lethal is UNGRADED: the corrected value requires re-solving a 4739-variable
  ECOS program and cannot be estimated entry-by-entry. Left ungraded rather than guessed.'
- The clipping diagnostic is underpowered (3 clipped TUs, 1 hit) and its nominal 22.8x failure should
  not be read as evidence FOR clipping; the substantive result is that 47 of 48 boundary entries
  are on unclipped TUs.
- The activator mechanism is not identified. This study bounds it (no boundary involvement, magnitude-uniform,
  60.8% of entries) without explaining it.
claim: 'dnaG''s silencing is an ACTIVE-CONSTRAINT artefact of ParCa''s convex fit — TU00352 sits
  on alpha + delta >= 0 at Z@R = 5.235e-12, with 110 of 727 regulated TUs there — and that fully
  explains the boundary entries. It does NOT explain the graded distortion across the wider population:
  remeasured on the in-force join, strong and weak repressors differ 3.41x where the candidate predicted
  1.26x, so magnitude uniformity is refuted rather than supported.'
conclusion: 'Half solved, precisely, and the other half now sharply posed.

  The conversion is located and confirmed: calculateRnapRecruitment reads deltaV straight out of
  a convex fit''s solution vector, reproduced here 979/979 within 1e-9. The fit minimises norm(G@R
  - k) subject to 0 <= Z@R <= 1, where the lower bound is alpha + sum(delta) >= 0. When it is ACTIVE
  the optimiser sits exactly on it, giving delta/alpha = -1 and total silencing regardless of the
  target fold change, because the objective matches absolute probabilities and never sees the ratio.
  All 10 near-total LexA targets sit at Z@R = 5.23e-12 -- one boundary, not ten coincidences -- and
  dnaG''s -0.999999957 is that boundary to solver precision, correcting my earlier description of
  it as floating-point cancellation.

  Repressors are then fully accounted for: 46 boundary entries at a median ratio of 0.0000, 175 free
  entries at 0.9959. The magnitude-uniformity that refuted every transform-error explanation is reproduced
  at 1.077.

  But my recorded prediction that the upper bound would bind for activators is REFUTED: none of the
  343 activating entries is at any boundary, and their 4.77x over-shoot has a separate cause. Repairing
  the constraint would take repressors to a median of exactly 1.0000 and the network only from 2.006
  to 1.968, because activators are 60.8% of entries. The one axis that cannot be evaluated -- what
  dnaG''s entry would become once released -- needs the ECOS program re-solved and is left ungraded
  rather than estimated.


  AMENDED 2026-09-04: this study''s conclusion stands on its direct evidence, but two of its framing
  numbers came from foldchange-to-delta-fidelity''s uncorrected comparison. The magnitude-uniformity
  it leaned on is 1.660 corrected rather than 1.166 (its own axis still passes at 0.757), and more
  importantly the lexA->rpoD encoding is 1.88x off rather than 1.476e+07x. The constraint artefact
  is REAL -- r is pinned at -1 -- but it is not by itself the catastrophe: at the fit''s own occupancy
  of 0.6615 a delta of -1 yields a retained fraction of 0.34, which is survivable. It becomes lethal
  only when runtime occupancy reaches 1.0.'
confidence: Investigating
candidate_diagnosis:
  recorded_at: '2026-09-04T09:40:00Z'
  recorded_before_measuring: true
  statement: 'The distortion is an ACTIVE-CONSTRAINT artefact of the convex fit, not a transform
    error and not residual scatter.

    fit_sim_data_1.py:3578-3592 minimises norm(G@R - k) subject to 0 <= Z@R <= 1 and T@R >= 0, where
    Z@R is the initiation probability with ALL TFs bound. The lower bound therefore states alpha
    + sum(delta) >= 0, i.e. delta/alpha >= -1. When that constraint is ACTIVE the optimiser sits
    exactly on it, giving delta/alpha = -1 and a retained fraction of 0 -- total silencing -- regardless
    of what the target fold change asked for. The objective never sees the ratio delta/alpha; it
    matches absolute probabilities k, so nothing pulls a boundary-bound entry back toward 2**log2FC.'
  predictions:
  - 'BIDIRECTIONAL: the lower constraint (Z@R >= 0) binds for repressors, driving retained -> 0 (under-shoot);
    the upper constraint (Z@R <= 1) binds for strongly activated TUs, driving retained up (over-shoot).
    This is why activators are distorted MORE than repressors.'
  - 'MAGNITUDE-UNIFORM: a constraint either binds or it does not. Whether it binds depends on the
    TU''s whole regulatory context, not on any single |log2FC|, so distortion does not grow with
    fold-change magnitude.'
  - The 10 near-total-repression targets should sit at Z@R ~ 0, i.e. the lower constraint is active
    for them.
  - EG10620_RNA[c]'s ratio slightly BELOW -1 (-1.000009) is ECOS solver tolerance overshooting the
    boundary, not a distinct defect.
  - dnaG's -0.999999957 is the boundary itself, to solver precision -- NOT a coincidence and NOT
    floating-point cancellation.
  candidate_correction: 'Two options, stated now so neither is chosen by fitting to the answer.

    (A) Floor the constraint: replace 0 <= Z@R with eps <= Z@R for a small positive eps, so a fully-repressed
    TU retains a floor instead of collapsing to zero. Cheap, but arbitrary in eps and does not make
    the encoding faithful -- it only makes it non-lethal.

    (B) Constrain the RATIO: add delta/alpha == 2**log2FC - 1 for entries with a measured fold change,
    either as an equality constraint or as a penalty term in the objective. This is the correction
    that would make the encoding faithful, and it is the one the repair axes should be graded against.

    PREDICTION under (B): entries whose constraint was NOT active are already near-faithful and barely
    move; the network median improves mainly by repairing the boundary-bound entries.'
  note: Recorded per req-2 BEFORE measuring any of it. Axis 1 has passed (979/979 deltaV entries
    reproduced within 1e-9), so the code path is confirmed; nothing about fidelity has been evaluated
    at the time of writing.
