biological_summary: 'The model learns how strongly each regulator affects each gene by solving one
  large optimisation problem: find the set of regulatory strengths that best reproduces the measured
  expression of every gene under every condition. That problem carries a sensible-looking safety
  rule -- no combination of regulators may drive a gene''s transcription probability below zero.


  For a few dozen genes that rule turns out to be the binding one. The optimiser cannot satisfy everything
  at once, and for these genes it settles exactly on the floor: the regulator is assigned just enough
  strength to cancel the gene''s expression completely and not one part more. The gene is then not
  repressed but abolished, whatever its measurement said. dnaG''s operon is one of these, and all
  ten of the genes LexA silences sit at precisely the same value -- not ten separate errors but one
  boundary they are all pressed against.


  Genes not pressed against that floor are encoded almost perfectly, within half a percent of their
  measurement. So for repressors this is a clean and complete explanation.


  It does not explain activators, and that was a wrong prediction on my part. Genes that are turned
  UP are encoded almost five-fold too strongly, and not one of them is against any boundary. Whatever
  distorts them is a different fault, it affects three-fifths of the regulatory network, and it remains
  open.'
conclusion_verdicts:
- claim: The conversion is a convex fit, not a formula
  verdict: supported
  basis: 979/979 deltaV entries reproduced from r_vector; objective and constraints read from source.
- claim: Repressor distortion is an active-constraint artefact (H1, refined)
  verdict: supported
  basis: 46 boundary entries at median 0.0000; 175 free at 0.9959; all 10 LexA targets at Z@R=5.23e-12.
- claim: The same constraint explains activators
  verdict: refuted
  basis: 0 of 343 activating entries at any boundary, yet median distortion 4.77x.
- claim: Negative-alpha clipping is the cause (H3)
  verdict: refuted
  basis: 3 clipped TUs of 3277; 47 of 48 boundary entries on unclipped TUs.
- claim: A space mismatch or saturation explains it (H2)
  verdict: refuted
  basis: Distortion uniform in magnitude (predicted 1.256 vs measured 1.166).
discovery_implications:
- 'The repressor defect has a concrete fix location: the constraint 0 <= Z@R in fit_sim_data_1.py:3588-3592.
  Whether to floor it, or to constrain delta/alpha against the fold change directly, is a modelling
  decision for the ParCa owner -- and either requires re-solving the fit.'
- 'The activator over-shoot is now the single largest open defect in this investigation: 4.77x, 60.8%
  of the network, no boundary involvement, no candidate mechanism. It deserves its own study.'
- Negative initiation probabilities are ECOS overshooting its own constraint within tolerance, not
  a separate bug. pc00010-repression-arithmetic already showed they are floored at zero before the
  sampler, so they cause silencing rather than crashes.
- 'dnaG''s -0.999999957 is a constraint boundary, not floating-point cancellation as I described
  it earlier. The distinction matters: a boundary is a modelling decision that can be changed, whereas
  cancellation noise would not be actionable.'
- 'The whole chain is now: ParCa''s fit hits its probability-validity floor on TU00352 -> LexA''s
  delta totally silences the operon -> dnaG is silenced through its OWN LexA edge, log2FC -1.71 (corrected
  2026-09-07: dnaG is a DIRECT LexA target, fold_changes_nca.tsv log2FC -1.71) -> DnaG depletes ->
  the replisome gate fails -> the lineage stalls.'
