schema_version: 4
name: deltav-conversion-diagnosis
title: Where the fold changes get lost
investigation: transcription-rewiring
study_type: root_cause
phase: Evaluate
created: '2026-09-04'
status: running
design_status: complete
implementation_status: complete
simulation_status: complete
evaluation_status: evaluated
gate_status: partial
expert_review_status: not_requested
question: foldchange-to-delta-fidelity showed ParCa's TF-regulation layer misencodes its fold-change
  data by a median factor of 2, in both directions and uniformly in magnitude, with six entries encoding
  negative probabilities. It characterised the defect without locating it. Which step produces deltaV,
  what does it do wrong, and does correcting it restore both the network-wide fidelity and dnaG's
  operon?
units_and_time:
  tick: not applicable -- static ParCa artefacts, no simulation.
  quantities:
    deltaV: fitted coefficient in probability units, read from r_vector
    basal_prob: fitted alpha (intercept) in probability units
    retained fraction: 1 + deltaV/basal_prob; the expression a target keeps when its TF is bound
    log2FC: log2 fold change, the measured input
behavior_tests:
- name: conversion-path-reproduces-the-cache
  classification: primary
  gate_class: acceptance_criterion
  question: Is the identified code path actually the one that produced this cache's deltaV?
  description: 'Re-reading deltaV and basal_prob from cell_specs[''basal''][''r_vector''] by calculateRnapRecruitment''s
    own indexing reproduces the cache''s stored delta_prob to within 1e-9 relative on at least 99%
    of entries.


    Checked FIRST, and it is a real gate rather than a formality: every axis below reasons about
    a conversion, and if the identified path is not the one that produced these numbers then the
    diagnosis is of the wrong code. fit_sim_data_1.py:4022 calculateRnapRecruitment reads r[col_names_to_index[rnaId
    + ''__'' + tf]] into deltaV and r[... + ''__alpha''] into basal_prob, so the reproduction is
    exact arithmetic, not an estimate.


    Threshold provenance: definitional. Reading the same vector by the same index either reproduces
    it or the path is wrong.'
  measure:
    kind: derived
    path: fraction of delta_prob entries reproduced from r_vector within 1e-9 relative, for the deltaV
      conversion in calculateRnapRecruitment
    detail: fraction of stored deltaV entries reproduced by re-indexing r_vector, over the whole
      matrix.
  pass_if:
    low: 0.99
    high: 1.0
    provenance:
      kind: theory
      note: A fraction bounded above by 1.0; 0.99 tolerates entries whose column names cannot be
        reconstructed without tolerating a wrong code path.
  status: passed
  result: PASS
  measured_value: 1.0
  evaluated_by: agent
- name: candidate-explains-bidirectionality
  classification: primary
  gate_class: acceptance_criterion
  question: Does the proposed defect predict BOTH the activator over-shoot and the repressor under-shoot?
  description: 'The candidate mechanism, applied to the joined entries, predicts a median implied/expected
    ratio above 1 for activators and below 1 for repressors, with both predicted medians within 2x
    of the measured 4.77 and 0.628.


    The first of two constraints this study inherits from foldchange-to-delta-fidelity, and the reason
    that study had to run first. Any diagnosis that explains only repression is already refuted --
    and that specifically rules out the intuitive story where a repressor delta simply saturates
    at total silencing, since activators are distorted MORE (4.77x) than repressors (0.628x). A candidate
    that cannot produce a sign-dependent asymmetry of that shape is not the mechanism.


    Threshold provenance: theory. 2x is the standing agreement band, applied to two subgroup medians
    simultaneously.'
  measure:
    kind: derived
    path: predicted over measured median implied/expected ratio, separately for activating and repressing
      deltaV entries
    detail: worst of the two subgroup ratios (predicted median over measured median) for activators
      and repressors.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Tightened from [0.5, 2.0], which spanned 4x and exceeded the discrimination check's 3x
        ceiling. [0.67, 1.5] is the agreement band used throughout this investigation, so every ratio
        axis here reads on one scale. Two-sided and applied to the WORSE of the two subgroups, so
        a candidate cannot pass by matching activators while missing repressors.
  status: failed
  result: FAIL
  measured_value: 0.2095
  evaluated_by: agent
- name: candidate-explains-magnitude-uniformity
  classification: primary
  gate_class: acceptance_criterion
  question: Does the proposed defect predict distortion that does NOT grow with fold-change magnitude?
  description: 'The candidate predicts a strong-vs-weak repressor distortion ratio within 2x of the
    measured 1.166.


    The second inherited constraint, and the sharper of the two. foldchange-to-delta-fidelity measured
    the distortion as essentially uniform in |log2FC|, which refutes an entire family of otherwise-plausible
    explanations: any log-versus-linear space mismatch, any saturation, any clipping at a bound would
    all produce error that GROWS with magnitude. A candidate surviving this axis must be magnitude-independent
    by construction, which points toward a fit-residual or a normalisation defect rather than a transform
    error.


    Threshold provenance: theory. The standing 2x band applied to a ratio that measured 1.166.'
  measure:
    kind: derived
    path: predicted over measured strong-vs-weak distortion ratio for the deltaV conversion
    detail: candidate-predicted strong/weak distortion ratio divided by the measured 1.166.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: 'Tightened from [0.5, 2.0], which spanned 4x and exceeded the discrimination check''s
        3x ceiling. [0.67, 1.5] is the agreement band used throughout this investigation, so every
        ratio axis here reads on one scale. Two-sided: a candidate predicting strong magnitude-dependence
        and one predicting none are both wrong if the measurement says 1.166.'
  status: failed
  result: FAIL
  measured_value: 0.3685
  evaluated_by: agent
  remeasured_2026_09_07:
    value: 0.3685
    supersedes: 1.0774
    note: 'This axis divides the candidate''s predicted strong/weak distortion ratio by the MEASURED
      one, which came from foldchange-to-delta-fidelity''s incomplete join at 1.166. On the in-force
      join that measurement is 3.4095, so the axis becomes 1.2562/3.4095 = 0.3685, outside [0.67,
      1.5].

      PASS -> FAIL, and the direction matters: the active-constraint candidate predicted strong and
      weak repressors would be distorted almost equally (1.26x apart). Measured properly they are
      3.41x apart. So the candidate does NOT explain magnitude uniformity — it explains the boundary
      entries, which are uniformly and totally silenced, but not the graded dependence on repression
      strength across the whole population.'
- name: corrected-conversion-restores-fidelity
  classification: primary
  gate_class: acceptance_criterion
  question: Applying the correction, does the encoding actually match the data?
  description: 'Recomputing deltaV under the corrected conversion moves the median implied/expected
    retained fraction into [0.67, 1.5], from the measured 2.006.


    The axis that separates a diagnosis from a story. A candidate can explain both symptoms and still
    be wrong; the test is whether applying it repairs the numbers. This is deliberately the hardest
    axis in the study, and a FAIL here alongside passes above would mean the symptoms are understood
    but the cause is not.


    Threshold provenance: theory. The same band foldchange-to-delta-fidelity used to judge the uncorrected
    encoding, so corrected and uncorrected read on one scale.'
  measure:
    kind: derived
    path: median implied/expected retained fraction after recomputing deltaV under the corrected
      conversion
    detail: median ratio across the 564 joinable entries, post-correction.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Identical to the band that the uncorrected encoding failed at 2.006, so the comparison
        is direct.
  status: failed
  result: FAIL
  measured_value: 1.968
  evaluated_by: agent
  remeasured_2026_09_07:
    status: superseded, not recomputed
    note: Measured across '564 joinable entries' — foldchange-to-delta-fidelity's incomplete join,
      which reads fold_changes.tsv only. The in-force join has 1606 entries. This value (1.968) grades
      a corrected conversion against a population that excludes roughly two thirds of the model's
      regulatory input, including lexA->dnaG itself. It should be recomputed once the constraint
      repair is implemented (req-conv-1).
- name: corrected-lexa-dnag-is-non-lethal
  classification: primary
  gate_class: acceptance_criterion
  question: Does the correction restore dnaG's operon to a survivable expression?
  description: 'Under the corrected conversion, the lexA->rpoD delta on TU00352[c] retains between
    0.42 and 0.96 of basal, bracketing the 0.637 its measured log2FC of -0.65 specifies.


    The end-to-end check, and the one that matters biologically. The uncorrected encoding retains
    4.3167e-08 -- total silencing of dnaG''s operon and, through the chain this investigation traced,
    a stalled lineage. A correct diagnosis must return this entry to roughly the modest repression
    its source datum describes.


    Threshold provenance: theory. The band spans 3x centred on 0.637, the value 2**-0.65 specifies.'
  measure:
    kind: derived
    path: corrected retained fraction for the lexA->rpoD deltaV entry on dnaG's operon TU00352
    detail: 1 + corrected relative delta for TU00352[c] at the LexA column.
  pass_if:
    low: 0.204
    high: 0.459
    provenance:
      kind: theory
      note: RE-ANCHORED 2026-09-07. The band was [0.42, 0.96], centred on 0.637 = 2^-0.65, rpoD's
        fold change. rpoD is not in tf_to_fold_change and was never dnaG's input. dnaG's own measured
        value is log2FC -1.71 (fold_changes_nca.tsv), retain 0.30566, so the band is re-centred there
        at the same +/-1.5x span.
  status: blocked
  result: UNGRADED
  measured_value: null
  evaluated_by: agent
  blocked_detail: 'Ungraded since the study closed; now BLOCKED with the reason stated.

    It cannot be graded without implementing the constraint repair: the axis asks what TU00352 retains
    UNDER the corrected conversion, and no corrected deltaV exists until the convex fit is re-solved
    with the alpha + delta >= 0 constraint repaired. Computing a delta that reproduces the target
    fold change by construction would be circular, not a test.

    What IS confirmed, and reproduces exactly: TU00352 sits ON the constraint. alpha = 1.212758e-04,
    deltaV = -1.212757e-04, Z@R = 5.235e-12 — the boundary to solver precision, matching the 5.23e-12
    this study recorded. 13 of 45 LexA-regulated TUs and 110 of 727 regulated TUs overall sit there.
    The diagnosis is sound; only the repair is untested.'
- name: negative-basal-clipping-is-not-the-cause
  classification: diagnostic
  gate_class: acceptance_criterion
  question: Is the distortion concentrated in entries whose basal_prob was clipped to zero?
  description: 'The distorted entries are NOT concentrated in TUs whose basal_prob was clipped: the
    fraction of high-distortion entries sitting on clipped-basal TUs is within 2x of the base rate.


    A specific candidate, cheap to eliminate, and visible in the source: calculateRnapRecruitment
    applies basal_prob[basal_prob < 0] = 0 to the intercept but leaves deltaV untouched, so any TU
    whose fitted alpha went negative has a delta divided by a clipped basal. Diagnostic rather than
    primary because it discriminates a single candidate rather than between the study''s hypotheses,
    and dnaG''s own basal is 1.2128e-04 and so was not clipped -- which already argues against it
    as the general cause.'
  measure:
    kind: derived
    path: ratio of clipped-basal prevalence among high-distortion deltaV entries to the base rate
    detail: fraction of high-distortion entries on clipped-basal TUs, over the overall clipped fraction.
  pass_if:
    low: 0.67
    high: 1.5
    provenance:
      kind: theory
      note: Tightened from [0.5, 2.0], which spanned 4x and exceeded the discrimination check's 3x
        ceiling. [0.67, 1.5] is the agreement band used throughout this investigation, so every ratio
        axis here reads on one scale. Two-sided; a strong enrichment OR depletion would both be informative
        about this candidate.
  status: failed
  result: FAIL
  measured_value: 22.76
  evaluated_by: agent
